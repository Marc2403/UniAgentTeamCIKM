- id: TRIP_THIRD_PARTY_FUNDING
  text: "Leistungen von dritter Seite werden auf die Reisekostenerstattung angerechnet und sind vor Antritt der Reise vollständig mitzuteilen; dieselben Kosten dürfen nicht doppelt finanziert werden."
  applies_to: [kassel]
  query: "Leistungen von dritter Seite angerechnet Reisekostenerstattung vor Antritt der Reise mitteilen"
  sources:
    - {corpus: university-kassel-public-de, doc_id: 8f78f05e-61f4-4f5f-ba79-35b18e2c4a0f, title: "Dienstreisemanagement - INTERN - Uni Kassel"}
- id: TRIP_FOREIGN_TRAVEL
  text: "Bei Auslandsreisen muss das Feld 'Reise ins Ausland' ausgefüllt sein; für Reisen in EU/EWR/Schweiz ist rechtzeitig eine A1-Bescheinigung zu beantragen."
  applies_to: [kassel]
  sources: []
- id: TRIP_DATES_CONSISTENT
  text: "Reiseverlauf und Dienstgeschäft müssen widerspruchsfrei sein: Reisebeginn vor Beginn, Ende des Dienstgeschäfts nach dessen Beginn und vor der Rückkehr."
  applies_to: [kassel, other]
  sources: []
- id: TRIP_COSTS_COMPLETE
  text: "Hin- und Rückreise und alle Kostenpositionen müssen angegeben sein, damit die Gesamtkosten feststehen."
  applies_to: [kassel, other]
  sources: []
