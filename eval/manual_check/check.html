m ersten Krankheitstag an durch ärztliche Bescheinigung nachzuweisen, da nur in diesem Fall die Gutschrift von Urlaubstagen und Gleittagen erfolgt.\n\nÄrztliche Untersuchungen sowie therapeutische Maßnahmen sind grundsätzlich außerhalb der Arbeitszeit wahrzunehmen. Soweit aus persönlichen Gründen eine Verletzung der Kernzeit unumgänglich wird (Arztbesuch), ist dies im Vorfeld mit der zuständigen vorgesetzten Person abzusprechen. Entstandene Fehlzeiten werden nicht auf die Arbeitszeit angerechnet.\n\nEine Anrechnung auf die Arbeitszeit während der Kernzeit kann erfolgen, wenn einer der folgenden Gründe vorliegt. Der Grund ist auf der Bescheinigung zu dokumentieren: \n\n  • Der Arztbesuch dient der Behandlung oder Versorgung eines akuten Leidens (z. B. (Zahn-)Arztbesuch wegen starker Schmerzen).\n  • Der Arztbesuch ist zur Inanspruchnahme eines medizinischen Gerätes erforderlich, das nur zu bestimmten Zeiten zur Verfügung steht.\n  • Eine Blutentnahme muss zwingend morgens erfolgen.\n  • Der Arztbesuch steht in unmittelbarem Zusammenhang mit einer Schwangerschaft, einer anerkannten Behinderung oder einer chronischen Erkrankung. Zur Anrechnung der Zeiten aufgrund einer chronischen Erkrankung, ist ein ärztliches Attest über das Vorliegen einer chronischen Erkrankung vorzulegen, ohne Benennung der Erkrankung.\n  • Der Arztbesuch oder die therapeutische Maßnahme steht in unmittelbarem Zusammenhang mit einem Arbeits-/Dienstunfall.\n\nFür die Anrechnung ist ein schriftlicher Nachweis der Arztpraxis/Therapiestelle vorzulegen, der folgende Angaben enthält:\n\n  • Zeitraum des Aufenthalts in der Praxis/Therapiestelle,\n\n  • Bestätigung des Vorliegens eines der oben genannten Gründe.\n\nDer Nachweis ist unverzüglich bei der zuständigen Personalsachbearbeitung in der Abteilung Personal und Organisation (digital) einzureichen. Nach Prüfung erfolgt ggf. eine Zeitgutschrift einschließlich der erforderlichen Wegezeiten gemäß den jeweils gültigen tarifvertraglichen bzw. beamtenrechtlichen Regelungen.\n\nArztbesuche am Nachmittag können nur bis zum individuellen Kernzeitende (z. B. Vollzeitbedienstete Mo-Do 15 Uhr, Fr 12 Uhr) angerechnet werden. Bitte beachten Sie, dass in den Monaten Juni, Juli und August die Kernzeit von Montag bis Donnerstag auf 14:00 Uhr aufgrund der Dienstvereinbarung \"Hitze\" herabgesetzt wird. Dies bedeutet, dass eine Anrechnung von Arztbesuchen in dieser Zeit nur bis 14:00 Uhr möglich ist.\n\nRegelmäßig stattfindende Kontrolluntersuchungen (z. B. beim Zahnarzt) oder sonstige Arztbesuche, bei denen kein anderer Termin zu bekommen war, sind nicht auf die Sollarbeitszeit anrechenbar.\n\nTisoware Meldungen und Sonstiges\n\nZeigt Ihnen das System an, dass Sie die Kernzeit verletzt haben, so können Sie diesen Hinweis eigenhändig ausbuchen. Dies gilt nicht für die Fälle, in denen Sie krank nach Hause oder zum Arzt gegangen sind!\n\nInfo: Grundsätzlich können bereits genehmigte Abwesenheiten nur in begründeten Einzelfällen und nur mit Zustimmung der/des Vorgesetzten zurückgenommen werden.\n\nSie erhalten sowohl bei der Genehmigung, als auch bei der Ablehnung eine automatische E-Mail an Ihre dienstliche E-Mail-Adresse.\n\nBitte wählen Sie im Menü: \"Workflow\", \"Neuer Antrag\", \"Stornoantrag\" aus. Es werden Ihnen alle genehmigten Abwesenheiten, die in der Zukunft liegen, aufgelistet.\n\nBitte klicken Sie den entsprechenden Workflow an, den Sie stornieren möchten und geben im Info­feld für Ihre Vorgesetzten an, aus welchen Gründen die genehmigte Abwesenheit storniert wer­den soll.\n\nAnschließend klicken Sie oben rechts auf „Speichern“.\n\nFällt Ihr Geburtstag auf einen Werktag (Montag bis Freitag), der zu Ihrem regulären Arbeitstag gehört, besteht die Möglichkeit, für einen halben Tag (die Hälfte Ihrer an diesem Tag geltenden Sollarbeitszeit) Geburtstagsfrei zu bekommen.\n\n \n\nFür die Gewährung bestehen zwei Möglichkeiten:\n\nVor dem Geburtstag: Möchten Sie den halben Tag Abwesenheit bereits im Voraus buchen, so beantragen Sie in Tisoware einen „Gleitzeitantrag“ oder „Gleitzeitantrag ohne Vertretung“. In der entsprechenden Maske wählen Sie das Datum Ihres Geburtstages sowie „1/2“ aus. Daraufhin muss angegeben werden, ab wann dieser halbe Tag genommen werden soll (ab 8:00 Uhr) und ggf. wer in dieser Zeit Ihre Vertretung ist. Anschließend wird der Workflow an Ihre Vertretung sowie Ihre:n Vorgesetzten zur Genehmigung weitergeleitet.\n\nWichtig: Der zweite halbe Tag muss nach Ihrem Geburtstag durch einen Korrekturworkflow als „Geburtstagsfrei“ korrigiert werden.\n\nNach dem Geburtstag: Um „Geburtstagsfrei“ in Tisoware kenntlich zu machen, müssen Sie einen Workflow-Antrag zur „Korrektur“ stellen und daraufhin das Ereignis „Geburtstagsfrei“ auswählen. Auch dieser Antrag muss von Ihren Vorgesetzten genehmigt werden. Wichtig hierbei ist, dass der Workflow erst im Nachhinein, also am nächsten Werktag nach Ihrem Geburtstag möglich ist.\n\nSofern die dienstlichen Gegebenheiten in den jeweiligen Arbeitsbereichen dies zulassen und die Bediensteten die beabsichtigte Teilnahme an der Veranstaltung rechtzeitig mit ihren Vorgesetzten abgestimmt haben, gilt die Teilnahme am Sporttag \"Uni in Bewegung\" ab 13:30 Uhr und am \"Campusfest\" ab 15:00 Uhr als Dienst. Es wird das Ende der Regelarbeitszeit als fiktives Arbeitsende berücksichtigt.\n\nDiese Regelung kann nur dann in Anspruch genommen werden, wenn an dem besagten Tag planmäßig Dienst versehen wird. Ich bitte um Verständnis, dass für Bedienstete, die an diesem Tag keinen regulären Arbeitstag haben, keine Zeitgutschrift vorgesehen werden kann.\n\nSofern Sie am Sporttag „Uni in Bewegung“ oder am Campusfest an einem Ihrer regulären Arbeitstage teilnehmen, betätigen Sie bitte beim Verlassen des Dienstgebäudes unbedingt die Taste \"Dienstgang\" (gelbe Taste) am Zeiterfassungsgerät. Die Be­tätigung der Taste \"Dienstgang\" dient Ihrem Versicherungsschutz auf dem Weg zur jeweiligen Veranstaltung.\n\nFür diesen Tag gilt damit das jeweilige Ende der geltenden Regelarbeitszeit, welches von Ihnen an Ihrem nächsten Arbeitstag persönlich in tisoware® zu korrigieren ist.\n\nEnde der Regelarbeitszeit für Vollzeitbedienstete (jeweils unter Berücksichtigung einer halbstündigen Pause und unabhängig davon, wann morgens der Dienst tatsächlich begonnen wurde).\n\n  • 41 Stunden = 16:27 Uhr\n  • 40 Stunden = 16:15 Uhr\n  • 38,5 Stunden = 15:57 Uhr\n\nDas Ende der Regelarbeitszeit bei Teilzeitbeschäftigten ergibt sich aus der täglichen Sollarbeitszeit, gerechnet ab 7:45 Uhr (unabhängig davon, wann morgens der Dienst tatsächlich begonnen wurde).\n\nZusammenfassend:\nBeginnen Sie Ihren Dienst an diesem Tag später als 7:45 Uhr, erwirtschaften Sie ein Tagesminus; beginnen Sie Ihren Dienst an diesem Tag früher als 7:45 Uhr, erwirtschaften Sie eine Tagesplus.\n\nDie Kombination mit einem halben Gleittages ist nicht möglich. Eine Zeitgutschrift erhält nur, wer an dem Tag planmäßig im Dienst anwesend ist.\n\nsiehe Was muss ich tun, wenn ich vergessen habe „Kommen“ „Gehen“ oder „Dienstgangende“ zu buchen oder aus einem anderen Grund bei einer Buchung kein Zeiterfassungsgerät bedienen konnte?\n\nDer Tag des Betriebsausfluges ist am nächsten Arbeitstag zu korrigieren.\n\nDa der Beginn und die Endezeit für diesen Tag fehlen, klicken Sie bitte auf der Startseite auf die „1“ vor dem Wort „Fehler“. Bitte klicken Sie hier auf das Stiftsymbol. Bitte klicken Sie unten bei „Lohnart“ rechts auf den Pfeil, hier wählen Sie „Betriebsausflug“ aus. Ihre an diesem Tag geltende Sollarbeitszeit wird automatisch verbucht. An den „Von“/„Bis“‐Zeiten ist keine Änderung vorzunehmen.\nBitte tragen Sie oben im Feld „Info“ das Ziel des Betriebsausflug ein. Bitte klicken Sie oben rechts auf das Diskettensymbol, um den Workflow zu speichern.\n\nDie folgende Tabelle enthält eine Auflistung der Gleizeitplusstunden bzw. Gleitzeitminusstunden, die Sie gemäß Ihrer regelmäßigen wöchentlichen Arbeitszeit haben dürfen."}, {"id": "P15", "query": "Conference fees reimbursement", "description": "Are conference registration fees reimbursed as travel expenses?", "narrative": "Relevant documents explain reimbursement of conference fees and related costs.", "title": "Semester Fee - UNI", "url": "https://www.uni-kassel.de/uni/en/international-service/coming-to-kassel/studying-in-kassel/during-studies/semester-fee-1.html", "text": "Semester Fee\n\nThis page contains automatically translated content.\n\nThe semester fee must be paid upon enrolment and then when re-registering for the following semester.\n\nIt is made up of contributions for various institutions (see below).\n\nIn the event of late re-registration, the late fee is € 30.00.\n\nFirst payment\n\nDuring the enrolment you will receive information how and when to pay the semester fee.\n\nRe-registration\n\nThe semester fee is due as part of the re-registration prior to each semester.\n\nRe-registration: Read More\n\nComposition of the semester fee\n\n1. Studierendenwerk (Student Services)       106,00 €\n2. Administration Fee\nThe administration fee does not apply to exchange students. \t\t        50,00 €\n3. AStA (Student Council) (-0,05 €)  17,15 €\n3.1 Deutschlandsemesterticket  (+18,00 €) 226,80 €\n3.2 Hardship Fund     1,30 €\n3.3 \"Notfonds\"0,75 €\n3.4 Bicycle Rental System (nextbike) (+0,05 €)     2,70 €\n3.5  \"Kulturticket\" (Culture Ticket)    4,02 €\n3.6  allerleih e.V.\n\n0,55 €\n\nTotal Required Fee409,27 €\nthe change from the previous semester in brackets\n\nManagement School der Universität Kassel (UNIKIMS)\n\nFor students of the Management School of the University of Kassel (UNIKIMS) the semester fee is 175,20 €. This group does not have to pay for the semester ticket, the bicycle rental system, the Kulturticket and allerleih e.V.. Students of the course of studies REMENA are excluded from this regulation.\n\nBank transfer\n\nPlease transfer the semester fee to the account of the University of Kassel at the Kasseler Sparkasse, stating the following transfer details:\n\nBank details\n\nRecipient: Universität Kassel\nIBAN: DE98 5205 0353 0002 1984 28\nBIC: HELADEF1KAS\nName of the bank: Kasseler Sparkasse\n\n  1. Please enter your student registration number in the “payment reference” box.\n  2. Please enter your name in the “further payment reference” box.\n\nPlease note that additional fees are incurred if you are transferring funds from abroad. Please ask your bank about these and factor them in when transferring the fees.\n\nQR code\n\nIf you use a banking app on your smartphone, you can use it to scan this QR code. The recipient, IBAN and amount will then be filled in automatically. Nevertheless, please make sure to include your matriculation number and your name in the payment reference.\n\nWhat is financed with the semester fee?\n\nThe Kassel Studierendenwerk (Student Services) provides a range of support services for the students of the University of Kassel. The Studierendenwerk is responsible for processing financial aid applications in accordance with the Federal Training Assistance Act (Bafög) as well as for applications related to student accident insurance programmes. Furthermore, the Studierendenwerk is responsible for running students canteens and cafeterias, for constructing and operating student housing , as well as for providing private accommodation. In terms of social services, the Studierendenwerk offers universal, psychological and legal counseling services. \n\nFor further information see the Studierendenwerk's website.\n\nThe administration fee covers a range of general services, including enrolment, leave of absence, re-registration, deregistration, student advising, internship placement, and international student services.  The fee is regulated according to § 56 of the Hessian Higher Education Act, which can be viewed on the Rechtsgrundlagen (Legal Affairs) page. \n\n \n\nAccording to the Hessian Higher Education Act, university students form a student body which constitutes a legal entity under public law and collects contributions from its members.  The “Allgemeine Studierendenausschuss” (AStA) is the executive agency of this student body.\n\nFor further inquiries regarding the Deutschlandsemesterticket, please get in touch with the AStA under 0561/804-2886.\n\nStudents with free travel authorization due to severe disability may be exempt from the payment of the semester ticket contribution (this must be arranged with the AStA).\n\nThe Hardship Fund serves to fund reimbursements as well as the work of the university’s hardship office. \n\nFurther information will follow.\n\nPayment fines are applicable only in cases of late re-registration. The semester fee is considered late if the payment is not made or not made in full within the registration period. The calculation of the payment fine amounting to € 30 is set by the Hessian Ministry for Science and the Arts which can be found here: Rechtsgrundlagen (Legal Affairs).\n\nGo-Link of this page: www.uni-kassel.de/go/semesterbeitrag"}, {"id": "P16", "query": "Verzicht Reisekostenvergütung Leistungen Dritter", "description": "Kann ein Beschäftigter auf Reisekostenvergütung verzichten, etwa weil ein Drittmittelgeber oder Veranstalter die Kosten trägt?", "narrative": "Relevant sind Vorschriften zum Verzicht und zur Anrechnung von Leistungen Dritter.", "title": " § 3 ForstGDV HE 2006 | Landesnorm Hessen | Reisekosten | § 3 - Reisekosten | gültig ab: 19.10.2011 | gültig bis: 08.07.2013", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/jlr-NNLHE000052EENN00000000005", "text": "Verordnung über Forstausschüsse\nVom 14. Juli 2006\n\n§ 3\nReisekosten\n\n(1) Die im Dienst eines Dienstherrn im Geltungsbereich des Hessischen Reisekostengesetzes beschäftigten Mitglieder der Forstausschüsse erhalten Reisekostenvergütung wie bei Dienstreisen. Den übrigen Ausschussmitgliedern werden die Reisekosten in entsprechender Anwendung des Hessischen Reisekostengesetzes vom 9. Oktober 2009 (GVBl. I S. 397) erstattet.\n\n(2) Arbeitnehmerinnen und Arbeitnehmer, die nicht Beschäftigte des Landes sind, wird außer Reisekostenvergütung nach Abs. 1 der nachgewiesene Verdienstausfall ersetzt. Er ist zusammen mit der Reisekostenvergütung anzufordern.\n\n(3) Ausschussmitglieder, die nicht Arbeitnehmerinnen oder Arbeitnehmer sind, erhalten neben den zu erstattenden Reisekosten nach Abs. 1 für Zeitversäumnis und entgangenen Arbeitsverdienst eine Entschädigung, soweit eine solche nicht von anderer Seite gewährt wird; die Höhe der Entschädigung wird durch Verwaltungsvorschrift festgesetzt.\n\nWeitere Fassungen dieser Norm ausblendenWeitere Fassungen dieser Norm\n\n§ 3 ForstGDV HE 2006, vom 14.07.2006, gültig ab 28.07.2006 bis 18.10.2011"}, {"id": "P17", "query": "Arbeitszeit Beamte Hessen", "description": "Wie lang ist die regelmäßige Arbeitszeit hessischer Beamter?", "narrative": "Relevant ist die Hessische Arbeitszeitverordnung.", "title": " § 18 HPVG | Landesnorm Hessen | Freiheit der Wahl, Kosten | § 18 - Freiheit der Wahl, Kosten | gültig ab: 06.04.2023", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/jlr-NNLHE00005189NN00000000022", "text": "Hessisches Personalvertretungsgesetz\n(HPVG)\nVom 28. März 2023*\n\n§ 18\nFreiheit der Wahl, Kosten\n\n(1) Niemand darf die Wahl des Personalrats behindern oder in einer gegen die guten Sitten verstoßenden Weise beeinflussen. Insbesondere dürfen die Wahlberechtigten in der Ausübung des aktiven und passiven Wahlrechts nicht beschränkt werden.\n\n(2) Die sächlichen Kosten der Wahl trägt die Dienststelle. Notwendige Versäumnis von Arbeitszeit infolge der Ausübung des Wahlrechts, der Teilnahme an den in den §§ 16 und 17 Abs. 1 genannten Personalversammlungen oder der Betätigung im Wahlvorstand hat keine Minderung der Dienstbezüge oder des Arbeitsentgelts zur Folge. Für die Mitglieder des Wahlvorstandes gelten § 35 Abs. 2 und 3, die §§ 37 und 38 Abs. 1 sowie § 39 entsprechend.\n\n(3) Den Beschäftigten werden die notwendigen Fahrtkosten für die Reise von der Beschäftigungsstelle oder von der Ausbildungsstelle zum Wahlort und zurück nach den Vorschriften über die Reisekostenvergütung der Beamtinnen und Beamten erstattet.\n\nFußnoten ausblendenFußnoten\n\n*)\nVerkündet als Artikel 1 des Gesetzes zur Novellierung des Hessischen Personalvertungsrechts und zur Änderung dienstrechtlicher Vorschriften vom 28. März 2023 (GVBl. S. 183)"}, {"id": "P18", "query": "Fahrtkostenerstattung Personalratsmitglieder HRKG", "description": "Nach welchen Regeln werden Fahrtkosten freigestellter Personalratsmitglieder erstattet?", "narrative": "Relevant ist der Beschluss zur Anwendung des Hessischen Reisekostengesetzes auf Personalratsmitglieder.", "title": " § 11 HRKG | Landesnorm Hessen | Erstattung von sonstigen Kosten | § 11 - Erstattung von sonstigen Kosten | gültig ab: 01.01.2010", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/jlr-NNLHE0000518BNN00000000020", "text": "Hessisches Reisekostengesetz\n(HRKG)\nVom 9. Oktober 2009 1)\n\n§ 11\nErstattung von sonstigen Kosten\n\nZur Erledigung des Dienstgeschäfts notwendige Auslagen, die nicht nach den §§ 5 bis 10 zu erstatten sind, werden als Nebenkosten erstattet.\n\nFußnoten ausblendenFußnoten\n\n1)\nVerkündet als Artikel 1 des Gesetzes zur Reform des hessischen Reisekostenrechts und zur Verlängerung der Geltungsdauer des Hessischen Personalvertretungsgesetzes vom 9. Oktober 2009 (GVBl. I S. 397)"}, {"id": "P19", "query": "Frist Reisekostenabrechnung", "description": "Bis wann muss ich meine Reisekosten nach einer Dienstreise abrechnen?", "narrative": "Relevant sind Angaben zur Ausschlussfrist für die Beantragung der Reisekostenvergütung.", "title": "Förderung - FB05 - Uni Kassel", "url": "https://www.uni-kassel.de/fb05/forschung/qualifikation/kigg/foerderung.html", "text": "Förderung\n\nDas KIGG unterstützt Promovierende sowie Habilitierende/ Post-docs und Master Studierende (in der Abschlussphase) des Fachbereichs 05 unter anderem durch die Förderung von am FB05 organisierten Workshops und Tagungen und die Bezuschussung von Reisekosten.\n\nFörderungswürdig sind Veranstaltungen, organisiert durch und mit Wissenschaftler*innen in der Qualifikationsphase, an denen mindestens zwei der am Fachbereich 05 angesiedelten Disziplinen beteiligt sind, besondere Programme oder Workshops der Graduiertenakademie sowie Reisekosten, die zur Erstellung einer Qualifikationsarbeit nötig sind.\n\nVoraussetzungen\n\n  • Der/ die Antragsteller*in ist Promovend*in/ Post-doc/ Habilitand*in/ des Fachbereichs 05.\n  • Die Förderung des KIGG steht auf Antrag und nach Bewilligung in Ausnahmefällen auch MA Studierenden des FB05 in der Abschlussphase Ihres Studiums zur Verfügung. Ausdrücklich wird aber darauf hingewiesen, vor einem Antrag beim KIGG zunächst alternative Förderangebote auszuschöpfen und dies auch zu dokumentieren.\n  • Das Vorhaben ist für die Erreichung des Qualifizierungsziels explizit notwendig. Im Antrag auf Reisekostenzuschuss muss die unmittelbare Notwendigkeit der Reise für den Promotions-/ Habilitations-/ Masterprozess offengelegt werden. Dazu zählt auch die Teilnahme an Tagungen, Konferenzen etc.\n\n \n\nNicht gefördert werden: \n\n  • Es werden keine Druckkostenzuschüsse finanziert.\n  • Es wird kein Lektorat finanziert.\n  • Es wird kein Tagegeld übernommen.\n  • Verpflegungskosten sind nicht übernahmefähig.\n  • Es werden keine Mitgliedschaften finanziert.\n\n     \n\nDie nächste Frist ist wird hier in Kürze bekannt gegeben - Ausschreibung \n\nDie Universität Kassel schließt wie alle öffentlichen Einrichtungen den Haushalt zum 1.12. eines Jahres. Daher müssen die Rechnungen bis 30.11. im Fachbereich abgerechnet sein.\n\nEs gilt ein Höchstsatz von 600€ für Auslandsaufenthalte und 300€ für Inlandsaufenthalte pro Antragssteller*in pro Jahr. Darüber hinaus werden keine Anträge gefördert, wenn Antragssteller*innen im Vorjahr bereits Anträge mit einer Gesamtsumme von 1.500€ bewilligt bekommen haben.\n\nDer Geschäftsführende Ausschuss entscheidet über die Bewilligung des Antrags.\n\nDies sind die Vergaberichtlinien.\n\nFinanzierung\n\nFördermöglichkeiten für Studierende außerhalb des KIGG\n\nEMF Förderung\n\nDas EMF-Programm muss durch den Geschäftsführenden Ausschluss bewilligt werden und unterliegt ebenfalls der Regelung zu den Höchstförderbeträgen.\n\nWissenschaftspreise"}, {"id": "P20", "query": "Conference travel for doctoral researchers", "description": "Can doctoral researchers without an employment contract get conference travel costs reimbursed?", "narrative": "Relevant documents explain travel funding options for doctoral researchers.", "title": "Application with German certificates - UNI", "url": "https://www.uni-kassel.de/uni/en/forschung/nachwuchsfoerderung/promotion/vor-der-promotion/bewerbung-mit-deutschen-zeugnissen.html", "text": "Application with German certificates\n\nThis page contains automatically translated content.\n\nBefore the doctorate: acceptance, registration, enrollment with German certificates\n\nIf you are already working as a research assistant at the chair, all steps from the application onwards are relevant for you!\n\nStep-by-step instructions\n\n  1. 1.Obtaining information\n\n    Graduates who have studied to qualify as a teacher for primary schools or for primary and lower secondary schools must complete additional activities in the acceptance procedure. You will find a summary of the type and scope of these activities here.\n\n  2. 2.Looking for a supervisor\n\n    • I need to narrow down the faculty that is most suitable for my topic.\n    • I need to go through the list of faculties. (You will find detailed information on doctoral procedures under the headline \"research\".)\n    • I need to find out about the individual specialist fields on the faculties’ websites and the lecturers based there.\n    • I need to discover information about the content of the units of instruction that are available and the contact details from the lecture list.\n    • I need to contact potential supervisors.\n    • As soon as I have found a supervisor, I need to write my research proposal (at least 5 – 10 pages, including a bibliography and a schedule in tabular form, if possible) in conjunction with my supervisor.\n\n    If you are seeking to gain a doctorate, the first step involves looking for a supervisor for your doctoral project. This will usually mean supervisors at the University of Kassel, who have been appointed to the faculty where you would like to study for your doctorate. They will support you in selecting your topic and methodology, planning your work and the individual further training opportunities.\n\n    Unfortunately, it is not possible to provide any central service to find supervisors.\n\n    When making contact, please attach your CV, your certificates and any publications in addition to the outline of your research project. \n\n  3. 3.Supervision agenda\n\n    • You need to go through the supervision agenda with your supervisor.\n\n    All doctoral candidates at the University of Kassel must sign an agreement with their supervisor, what is known as the supervision agenda. It helps to synchronise the mutual expectations during your PhD studies and plan various aspects at an early stage – e.g. attending conferences, publication strategies. A copy of the fifth page, signed by all parties must be submitted to the Doctoral Office via uni-assist. We urgently recommend that you update the supervision agenda every year and this is the precondition for any extension to agreements during the qualification phase.\n\n  4. 4.Application\n\n    + required documents\n\n    • I am applying for admission as a doctoral candidate via eCampus and am uploading the required documents digitally.\n\n    I upload the following documents to eCampus:\n\n    • The signed fifth page of the supervision agenda\n    • Copy of my completed university degree (e.g. Magister, Diplom, Bachelor's and Master's degree)\n    • Transcript of records of my university degrees\n    • Copy of the university entrance qualification \n    • Exposé: working title and written description of the planned dissertation including timetable in modular form (Dr.-Ing.: please enclose this in the form of a bar chart)\n    • Curriculum vitae in tabular form\n    • Copy of identity card or passport\n\n    I am uploading further documents that apply to me with the application:\n\n    • Proof of name change (e.g. marriage certificate), as I have acquired qualifications under a different name\n    • Officially certified translation, as my documents and certificates were not issued in German or English\n    • Copy of the grading system of my former university, as I did not complete my degrees at a German university\n    • If applicable, proof of foreign language skills (please read the note below)\n    • List of my academic publications\n    • Proof of the type and scope of the contract for doctoral counselling used\n    • Officially certified copies of my existing doctoral certificate\n\n    Online application via the eCampus\n\n    Please read the information on the required documents carefully:  \n\n    eCampus: If you are not yet enrolled at the University of Kassel, you must first register via eCampus. Once you have successfully registered, you can access the online portal via the menu (top left of the eCampus page) by clicking on \"Study Application\".\n\n    Supervision agenda: Page 5 of the supervision agenda is sufficient.\n\n    Foreign language skills: In Departments 01, 02 and 05, foreign language skills are required and correspondent evidence must be provided for some doctoral subjects. Please check the special provisions of the faculty in which you are planning your doctorate to find out whether and which foreign language skills you need to provide.\n\n    Please note:\n    Depending on the subject area, additional subject-specific documents may be required. Please consult your supervisor and compare the special provisions of the subject area in which you are planning your doctorate.\n\n  5. 5.Acceptance procedure\n\n    Between examination and decision\n\n    If you have successfully completed the online application portal, uploaded your documents and submitted the application digitally, you will then receive an electronic confirmation of receipt to your e-mail address.\n\n    The doctoral office\n\n    • checks your application for completeness and requests any missing documents and\n    • determines whether the formal requirements for acceptance as a doctoral candidate have been met and\n    • forwards your application to the relevant doctoral committee.\n\n    The doctoral committee\n\n    • checks whether acceptance as a doctoral candidate is possible,\n    • whether any conditions need to be fulfilled or\n    • whether an aptitude assessment procedure must be initiated and\n    • informs the doctoral office of the result.\n\n    The overall process can take up to two months. Please refrain from enquiring during this time. As soon as the doctoral office has received the result, they will contact you by email.\n\n    Please memorise your access data for the eCampus. You will be regularly informed about the status of your application by e-mail. If any documents are missing for processing your application, you will also be informed on this by e-mail. As a precaution, please also check your spam folder to see if you have received an e-mail from the University of Kassel.\n\n  6. 6.Enrolment (optional)\n\n    Once I have received my notification of acceptance, I can\n\n    • apply for my visa or\n    • extend my visa at the foreigners’ registration office or\n    • initiate the optional enrolment process as a doctoral candidate at the University of Kassel or\n    • apply for a scholarship.\n\n    This link takes you to the enrolment section at the eCampus. You will also obtain information on this site about which other documents you need to submit to successfully enrol at the student affairs office. \n\n    It is possible to enrol for a summer semester until 10th May and for a winter semester until 10th November.\n\n    Enrolment is voluntary. Once you enrol, you will receive a CampusCard; this not only enables you to eat at reduced prices in the cafeterias at the University of Kassel and use the libraries, but it is also your semester ticket to use public transportation free of charge in parts of the state of Hesse or upgrade the ticket to travel in Germany.\n\n     \n\n     \n\n     \n\n  7. 7.Arriving in Germany, making preparations\n\n    As I am travelling to Germany from abroad, I need to find out about what preparations I need to make to travel. The web pages of theWelcome Centre provide detailed infomation on all necessary steps and procedures that I need to keep in mind."}, {"id": "P21", "query": "Weiterbildung Beschäftigte", "description": "Welche Fortbildungsangebote gibt es für Beschäftigte der Verwaltung?", "narrative": "Relevant sind interne Weiterbildungsprogramme und Anmeldewege.", "title": "Nutzungsbedingungen - HOCHSCHULVERWALTUNG", "url": "https://www.uni-kassel.de/hochschulverwaltung/themen/personal-und-organisationsentwicklung/nutzungsbedingungen.html", "text": "Veranstaltungen der Internen Fortbildung\n\nDie Teilnahme an den Schulungsangeboten der Internen Fortbildung der Universität Kassel (Abteilung Personal und Organisation sowie Referat Strategische Personal- und Organisationsentwicklung) bedarf einer vorherigen Zustimmung der Nutzungsbedingungen. Diese werden mit der Anmeldung durch die Teilnehmenden bestätigt.\n\nDie Anmeldung zur Teilnahme an Veranstaltungen der Internen Fortbildung kann bis zum vorgegebenen Anmeldeschluss erfolgen. Bei freier Platzkapazität ist eine Anmeldung auch nach Anmeldeschluss möglich.\n\nDie Anmeldungen werden in der Reihenfolge ihres Eingangs über das Veranstaltungstool Campus Events berücksichtigt.  \n\nSofern Sie als Teilnehmer*in vom System registriert wurden, erhalten Sie per E-Mail eine automatisierte Anmeldebestätigung. Sollten sich nach der Anmeldung Änderungen ergeben, erhalten Sie gesondert Nachricht von uns.\n\nIst die Veranstaltung bereits ausgebucht, erscheint der Hinweis \"Diese Veranstaltung ist leider ausgebucht.\" In diesem Fall wird in der Regel eine Warteliste eröffnet.\n\nDas Interne Fortbildungsprogramm richtet sich an alle Beschäftigten der Universität Kassel. Wenn Veranstaltungen sich an einzelne Beschäftigtengruppen richten, geht dies klar aus dem Ankündigungstext hervor. Bitte stimmen Sie die Teilnahme an einer Veranstaltung vor der Anmeldung mit Ihrer/Ihrem Vorgesetzten ab.\n\nBitte nehmen Sie zur Kenntnis, dass die Teilnehmendendaten (Name, Vorname, Titel, dienstliche Adresse, Organisationseinheit, dienstliche Telefonnummer, dienstliche E-Mailadresse und teilweise uk-Nummer) zur Organisation der Seminare gespeichert und ggfs. an externe Trainer:innen weitergegeben werden. Die Anonymisierung Ihrer personenbezogenen Daten erfolgt 15 Monate nach dem Ende der Veranstaltung bzw. nach Abschluss des zugehörigen Programms.\n\nDie Veranstaltungen der Internen Fortbildung sind in der Regel für alle Beschäftigten kostenfrei. Sofern eine Selbstbeteiligung erhoben wird, ist dies der Veranstaltungsbeschreibung zu entnehmen.\n\nBei Verhinderung besteht die Verpflichtung sich bis spätestens eine Woche vor der Veranstaltung abzumelden. Senden Sie dazu eine formlose E-Mail an den Veranstaltenden oder an pewbp[at]uni-kassel[dot]de.\n\nBitte melden Sie sich auch bei kurzfristiger Verhinderung oder wenn Sie von der Warteliste genommen werden möchten, damit die Plätze anderweitig vergeben werden können. \n\nSollte eine Veranstaltung ausgebucht sein, wird eine Warteliste eingerichtet, für die Sie sich registrieren können. Sollte ein Platz frei werden, erfolgt die Vergabe in der Reihenfolge des Eintrags in die Warteliste.\n\nBei ungenügender Beteiligung bzw. bei unvorhersehbaren Ereignissen kann die Veranstaltung abgesagt werden. Die Teilnehmenden werden hierüber umgehend informiert.\n\nEs werden Teilnahmelisten geführt, auf welchen Sie Ihre Teilnahme bitte durch Unterschrift bestätigen. Die Listen enthalten Angaben zu Name, Vorname, Titel, Organisationseinheit und dienstliche E-Mailadresse. Bei Online-Schulungen wird Ihre Teilnahme durch die Schulungsleitung bestätigt.\n\nNach der Veranstaltung werden Teilnahmebescheinigungen erstellt; diese werden Ihnen für Ihre Unterlagen per E-Mail zugesandt."}, {"id": "P22", "query": "Rückforderung Trennungsgeld", "description": "Kann zu viel gezahltes Trennungsgeld zurückgefordert werden?", "narrative": "Relevant sind Entscheidungen zur Rückforderung überzahlten Trennungsgeldes.", "title": "2 UE 413/93 | Hessischer Verwaltungsgerichtshof 2. Senat | 06.12.1995 | Urteil", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/LARE190026932", "text": "Trennungstagegeld - Nichtgewährung des Höchstsatzes im Falle Nichtverheirateter - kein Verstoß gegen das Diskriminierungsverbot von Frauen im Erwerbsleben\n\nVerfahrensgang ausblendenVerfahrensgang\n\nvorgehend VG Frankfurt, 21. Oktober 1992, III/1 E 281/89\n\nTatbestand\n\nRandnummer1\n\nDie nicht verheiratete Klägerin begehrt anstelle des ihr gewährten Trennungstagegeldes von 14,10 DM (1985) bzw. 16,50 DM (1986) den Höchstsatz von 20,70 DM (1985) bzw. 24,30 DM (1986), den gemäß § 5 Abs. 1 Satz 2 der Hessischen Trennungsgeldverordnung - HTGV - derjenige Beamte erhält, der\n\nRandnummer2\n\n1. mit bestimmten Personen - u. a. mit seinem Ehegatten - in häuslicher Gemeinschaft lebt und 2. die Wohnung beibehält und 3. einen getrennten Haushalt führt.\n\nRandnummer3\n\nSie ist insoweit der Auffassung, die Gewährung eines geringeren Trennungstagegeldsatzes an nicht verheiratete Beamte - in der Mehrzahl weiblichen Geschlechts - sei Ausdruck einer nach höherrangigem Recht unzulässigen \"mittelbaren Diskriminierung\" der Frau, die jedenfalls für die Vergangenheit durch Zahlung des Höchstsatzes beseitigt werden müsse.\n\nRandnummer4\n\nDie damals in O wohnende Klägerin wurde durch Erlaß des Hessischen Ministers für Wissenschaft und Kunst vom 26. September 1985 für die Zeit vom 1. Oktober 1985 bis zum 31. Oktober 1986 mit der Vertretung einer Professur am Fachbereich Rechtswissenschaft der Johann-Wolfgang-Goethe-Universität F beauftragt. In dieser Zeit war sie ohne Dienstbezüge von ihrem Amt als Richterin am Arbeitsgericht Oldenburg beurlaubt und erhielt vom Beklagten eine außertarifliche Vergütung in Höhe der Besoldung eines Professors der Besoldungsgruppe C 3.\n\nRandnummer5\n\nMit Anträgen vom 25. November 1985 und 7. März 1986 machte sie zusätzlich zu dem bereits beantragten und gemäß § 5 Abs. 2 HTGV gewährten Trennungstagegeld die Differenz zwischen dem Trennungsgeld für Ledige und demjenigen für Verheiratete geltend. Unter Hinweis auf ein Urteil des Bayerischen Verwaltungsgerichtshofs vom 26. März 1980 (Nr. 259 XXIV 78, DöD 1980, 174 ff. = ZBR 1980, 390), wonach die unterschiedliche Bemessung des Trennungstagegeldes für alleinstehende und verheiratete Beamte keinen Verstoß gegen den Gleichheitssatz darstellt, lehnte der Präsident der Johann-Wolfgang-Goethe-Universität F diese Anträge durch - nicht mit einer Rechtsbehelfsbelehrung versehenen - Bescheid vom 27. Oktober 1986 ab. Über den hiergegen erhobenen Widerspruch vom 30. Januar 1987 wurde nicht entschieden.\n\nRandnummer6\n\nAm 4. Februar 1987 hat die Klägerin bei dem Arbeitsgericht Frankfurt am Main Klage mit dem Antrag auf Feststellung erhoben, daß ihr als nicht verheirateter Berechtigten Trennungsgeld in derselben Höhe wie einem verheirateten Beamten zustehe. Durch Urteil vom 22. Oktober 1987 hat das Arbeitsgericht die Klage im wesentlichen mit der Begründung abgewiesen, die in § 5 Abs. 1 und 2 HTGV getroffene Regelung habe keine (mittelbare) Diskriminierung der Klägerin in ihrer Geschlechtsrolle zur Folge; sie beruhe vielmehr auf im Zusammenhang mit gemeinsamer Haushaltsführung stehenden objektiven Gegebenheiten, die die u. a. zugunsten verheirateter Beamter vorgenommene Differenzierung sachlich rechtfertigten. Die Berufung gegen dieses Urteil blieb erfolglos; auf den Hilfsantrag der Klägerin verwies jedoch das Landesarbeitsgericht Frankfurt am Main am 15. Juli 1988 den Rechtsstreit an das Verwaltungsgericht Frankfurt am Main.\n\nRandnummer7\n\nIm verwaltungsgerichtlichen Verfahren hat die Klägerin unter Wiederholung ihres bisherigen Vorbringens beantragt,\n\nRandnummer8\n\nden Beklagten zu verpflichten, ihr, der Klägerin, unter Aufhebung des Bescheides des Präsidenten der Johann- Wolfgang-Goethe-Universität F vom 27. Oktober 1986 für den Zeitraum vom 9. Oktober 1985 bis zum 30. September 1986 den Unterschiedsbetrag zwischen dem Trennungstagegeld nach § 5 Abs. 2 und Abs. 1 Satz 2 Nr. 1 HTGV in der jeweils geltenden Fassung zu gewähren.\n\nRandnummer9\n\nDer Beklagte hat weiterhin beantragt,\n\nRandnummer10\n\ndie Klage abzuweisen.\n\nRandnummer11\n\nDurch Urteil vom 21. Oktober 1992 hat das Verwaltungsgericht die Klage abgewiesen und ausgeführt, ein Verstoß des Trennungsgeldrechts gegen Art. 119 des EWG-Vertrages, gegen die Lohngleichheitsrichtlinie (75/117/EWG) und die Gleichbehandlungsrichtlinie (76/207/EWG) sowie gegen Art. 3 Abs. 2 GG könne, selbst wenn er vorläge, nicht dazu führen, daß der Klägerin der begehrte Höchstsatz des Trennungstagegeldes zu gewähren sei. Der von der Klägerin gesehene Rechtsverstoß führe nämlich zur Nichtigkeit des § 5 HTGV und damit zum Wegfall der Anspruchsnorm; auf welche Weise der Normgeber die Folgen der Nichtigkeit einer leistungsgewährenden Vorschrift regele, stehe in seinem - grundsätzlich weiten - Gestaltungsspielraum.\n\nRandnummer12\n\nGegen dieses ihren Prozeßbevollmächtigten am 21. Dezember 1992 zugestellte Urteil hat die Klägerin am 19. Januar 1993 Berufung eingelegt, zu deren Begründung sie vorträgt:\n\nRandnummer13\n\nAuch bei der Gewährung von Trennungstagegeld als einer Erscheinungsform von \"Entgelt\" müßten die vom Europäischen Gerichtshof zum Rechtsinstitut der \"mittelbaren Diskriminierung\" entwickelten Grundsätze beachtet werden, wonach eine unzulässige Benachteiligung von Frauen nicht nur bei einer ausdrücklich auf das Geschlecht gestützten Differenzierung vorliege; vielmehr könne eine nachteilige Regelung bereits dann gegen das Diskriminierungsverbot verstoßen, wenn sie abstrakt zwar Männer und Frauen gleichermaßen erfasse, tatsächlich jedoch wesentlich mehr Frauen als Männer treffe. So liege es hier bei der Gewährung eines höheren Trennungstagegeldes u. a. für verheiratete Beamte (§ 5 Abs. 1 Satz 2 Nr. 1 HTGV) einerseits und eines niedrigeren für ledige Beamte (§ 5 Abs. 2 HTGV) andererseits. Denn nach vom Bundesministerium des Innern im Jahre 1986 veröffentlichten Zahlen seien von den männlichen Beamten lediglich 16,7 % nicht verheiratet, während 45,7 % der Beamtinnen ledig seien. Die sich aus diesem Zahlenverhältnis ergebende wesentliche Benachteiligung von Frauen sei nicht anders als mit dem Geschlecht bzw. den Geschlechtsrollen zu erklären. Die Trennungsgeldvorschriften seien - wie auch andere beamtenrechtliche Regelungen - immer noch durch das überholte Leitziel des in einer Hausfrauenehe lebenden Beamten geprägt. Die stärkere Betroffenheit eines Geschlechts durch eine Regelung oder Maßnahme erzeuge die Vermutung einer Diskriminierung, die der Arbeitgeber bzw. der Dienstherr widerlegen müsse. Dieser sei auch beweispflichtig für die Behauptung, wesentlich mehr Frauen als Männer seien nur zufällig (und nicht geschlechtstypisch) nachteilig betroffen. Dem Beklagten sei aber dieser Nachweis in bezug auf die trennungsgeldrechtliche Benachteiligung von Frauen nicht gelungen. Nach wie vor führe die überkommene Rollenverteilung des - erwerbstätigen - Ehemannes und der - für die Heim- und Familienarbeit zuständigen - Ehefrau dazu, daß wesentlich mehr weibliche Beamte ledig seien als männliche Beamte. Die auch hierin zum Ausdruck kommende strukturelle Diskriminierung der Frau im öffentlichen Dienst dürfe entsprechend der neueren Rechtsprechung des Bundesverfassungsgerichts (BVerfGE 85, 191, 207) nicht durch staatliche Maßnahmen verfestigt werden. Die Gewährung eines niedrigeren Trennungstagegeldes an nicht verheiratete Beamte - in der großen Mehrzahl Frauen - sei entgegen der vom Bayerischen Verwaltungsgerichtshof und dem Arbeitsgericht Frankfurt am Main vertretenen Auffassung auch nicht durch objektive Kriterien gerechtfertigt. Abgesehen davon, daß wirtschaftliche Erwägungen allein zur Rechtfertigung einer geschlechtsspezifischen Ungleichbehandlung ohnehin nicht ausreichten, sei es auch in der Sache verfehlt, im Falle einer Versetzung bzw. Abordnung von einem hierdurch verursachten höheren Aufwand verheirateter Beamter, sei es am neuen Dienstort, sei es gar am beibehaltenen Wohnort, auszugehen; nicht verheiratete Beamte - ganz überwiegend Frauen - könnten jedenfalls nicht günstiger wirtschaften und erlitten durch eine den Anspruch auf Trennungstagegeld auslösende Maßnahme des Dienstherrn eher noch größere finanzielle Einbußen als verheiratete - meist männliche - Beamte. Zumindest sei es nicht gerechtfertigt, einem verheirateten Beamten, der durch das Zusammenleben mit seiner Ehefrau ohnehin schon günstiger wirtschaften könne, im Falle einer Versetzung bzw. Abordnung den Wegfall dieses Vorteils am Einsatzort gesondert, gar noch in der konkret geregelten Höhe, zu vergüten. Eine Besserstellung um 6,60 DM (1985) bzw. um 7,80 DM (ab 1986) pro Tag stelle sich für den verheirateten Beamten als regelrecht gewinnbringend dar. Da somit der Tatbestand der \"mittelbaren Diskriminierung\" erfüllt sei und es sich bei dem streitigen Trennungstagegeld um \"Entgelt\" handele, verstoße die in § 5 Abs. 1 und 2 HTGV getroffene Regelung gegen Art. 119 des EWG-Vertrages sowie gegen die Lohngleichheitsrichtlinie, ferner aber auch - im Hinblick auf die Beeinflussung der Arbeitsbedingungen - gegen die Gleichbehandlungsrichtlinie des Gemeinschaftsrechts sowie gegen das Diskriminierungsverbot des Art. 3 Abs. 3 GG mit der nach der Rechtsprechung sowohl des Europäischen Gerichtshofs als auch des Bundesverfassungsgerichts zwingenden Folge, daß ihr als nicht verheirateter Berechtigten für die Vergangenheit ebenfalls der Höchstsatz des Trennungstagegeldes zu gewähren sei. Die Klägerin beantragt,\n\nRandnummer14\n\ndas Urteil des Verwaltungsgerichts Frankfurt am Main vom 21. Oktober 1992 abzuändern und nach ihrem erstinstanzlichen Klageantrag zu erkennen.\n\nRandnummer15\n\nDer Beklagte beantragt,\n\nRandnummer16\n\ndie Berufung zurückzuweisen.\n\nRandnummer17\n\nEr erwidert, die Erhöhung des Trennungstagegeldes nach § 5 Abs. 1 Satz 2 Nr. 1 HTGV beruhe auf einer durch nationales Verfassungsrecht (Art. 6 Abs. 1 GG) gebotenen, zumindest aber gerechtfertigten Bevorzugung verheirateter Beamtinnen und Beamten gegenüber ledigen. Eine geschlechtsspezifische Differenzierung finde insoweit nicht statt; maßgeblicher Anknüpfungspunkt für die Gewährung des höchsten Trennungstagegeldes sei nämlich das - freilich auf bestimmte Personen, darunter Ehegatten, beschränkte - Leben des Beamten \"in häuslicher Gemeinschaft\". Im übrigen würde ein etwaiger Verstoß trennungsgeldrechtlicher Vorschriften gegen höherrangiges Recht nicht zwangsläufig zu der von der Klägerin geforderten Angleichung nach oben führen, weil die Art und Weise der Herstellung der gebotenen Gleichbehandlung dem Normgeber überlassen bleiben müsse.\n\nRandnummer18\n\nZur Ergänzung des Tatbestands wird auf die von den Beteiligten eingereichten Schriftsätze Bezug genommen.\n\nEntscheidungsgründe\n\nRandnummer19\n\nDie Berufung ist nicht begründet. Das Verwaltungsgericht hat die Klage jedenfalls im Ergebnis zu Recht abgewiesen. Die Klägerin kann ein höheres als das ihr gewährte Trennungstagegeld nicht beanspruchen. Dies folgt im einzelnen aus nachstehenden Erwägungen:\n\nRandnummer20\n\nDie Klägerin war im maßgeblichen Zeitraum vom 9. Oktober 1985 bis zum 30. September 1986, obwohl sie damals von ihrem Richteramt beurlaubt war, wie eine Beamtin - nach öffentlich-rechtlichen Grundsätzen - trennungsgeldberechtigt; denn sie stand, wie das Landesarbeitsgericht Frankfurt am Main in seinem Urteil vom 15. Juli 1988 näher ausgeführt hat, für die Dauer der Vertretung einer Professur in einem durch mitwirkungsbedürftigen Verwaltungsakt (nämlich den ministeriellen Erlaß vom 26. September 1985) begründeten öffentlich-rechtlichen Dienstverhältnis eigener Art mit der Folge der Nichtanwendbarkeit der privatrechtlichen Vorschriften über den Dienstvertrag (§§ 611 ff. BGB, insbesondere §§ 611 a Abs. 1 und 612 Abs. 3 BGB in der Fassung des Gesetzes vom 13. August 1980, BGBl. I S. 1308; vgl. hierzu im einzelnen Pfarr/Bertelsmann, Gleichbehandlungsgesetz, 1985, herausgegeben vom Hessendienst der Staatskanzlei in Wiesbaden).\n\nRandnummer21\n\nGemäß Abs. 1 Satz 2 des deshalb vom Beklagten zu Recht angewendeten § 5 HTGV (in der bis zum 31. Dezember 1985 geltenden Fassung der Zweiten Änderungsverordnung vom 17. Januar 1978, GVBl. I S. 90, sowie der ab 1. Januar 1986 maßgeblichen Fassung der Dritten Änderungsverordnung vom 23. Januar 1986, GVBl. I S. 31) beträgt das Trennungstagegeld für Angehörige der hier allein interessierenden Reisekostenstufe I 20,70 DM bzw. 24,30 DM (statt 14,10 DM bzw. 16,50 DM nach dem im Falle der Klägerin herangezogenen Abs. 2), wenn der Beamte\n\nRandnummer22\n\n1. mit seinem Ehegatten in häuslicher Gemeinschaft lebt oder 2. mit einem Verwandten bis zum 4. Grade, einem Verschwägerten bis zum 2. Grade, einem Adoptiv- oder Pflegekind, Adoptiv- oder Pflegeeltern in häuslicher Gemeinschaft lebt und ihnen aus gesetzlicher oder sittlicher Verpflichtung - nicht nur vorübergehend - Unterkunft und Unterhalt ganz oder überwiegend gewährt oder 3. mit einer Person in häuslicher Gemeinschaft lebt, deren Hilfe er aus beruflichen oder nach amtsärztlichem Zeugnis aus gesundheitlichen Gründen - nicht nur vorübergehend - bedarf, und die Wohnung beibehält und einen getrennten Haushalt führt.\n\nRandnummer23\n\nDie Klägerin selbst geht zutreffend davon aus, daß sie die in den Nrn. 1 bis 3 - alternativ - aufgeführten Voraussetzungen nicht erfüllt; sie führt dies auf die Tatsache zurück, daß sie nicht verheiratet ist, weshalb sie sich zu einer gegenüber vergleichbaren männlichen Trennungsgeldberechtigten zahlenmäßig stärkeren Gruppe von ledigen, durch § 5 Abs. 1 Satz 2 HTGV nachteilig betroffenen Frauen zählt. Auf die Beantwortung der bei dieser Betrachtungsweise naheliegenden Frage, ob die Anspruchsnorm, soweit sie ledigen Berechtigten den Höchstsatz des Trennungstagegeldes versagt, mit höherrangigem Recht, insbesondere mit dem Verbot der auch nur faktischen oder mittelbaren Diskriminierung der Frau (vgl. hierzu zusammenfassend Kokott, Zur Gleichstellung von Mann und Frau - Deutsches Verfassungsrecht und Europäisches Gemeinschaftsrecht, NJW 1995, 1049, 1054) vereinbar sei, kommt es hier indessen nach Auffassung des erkennenden Senats letztlich nicht an. Denn das von der Klägerin begehrte Trennungstagegeld bleibt allen Berechtigten (beiderlei Geschlechts) versagt, die nicht mit dritten Personen \"in häuslicher Gemeinschaft leben\". Nicht ein bestimmter Familienstand, sondern eine - freilich auf abschließend aufgezählte Personengruppen beschränkte - häusliche Gemeinschaft, in der der (männliche oder weibliche, verheiratete oder ledige) Berechtigte lebt, ist - gleichrangig neben Beibehaltung der Wohnung und Führung eines getrennten Haushalts - unverzichtbare Voraussetzung für den Anspruch auf das höchste Trennungstagegeld. Dies wird bestätigt durch die Überlegung, daß die Klägerin (bei ansonsten unveränderter Führung eines Ein-Personen-Haushalts) auch dann kein höheres Trennungsgeld hätte beanspruchen können, wenn sie im maßgeblichen Zeitraum verheiratet gewesen wäre; denn einem verheirateten Berechtigten steht der Höchstsatz nicht schon wegen seines Familienstandes, sondern nur unter der weitergehenden Voraussetzung zu, daß er \"in häuslicher Gemeinschaft lebt\" (vgl. Meyer-Fricke, Umzugskosten, § 3 TGV, RN 86 ff., 94). Die Klägerin hat aber im Antragszeitraum nicht mit einer Person i. S. des § 5 Abs. 1 Satz 2 Nr. 1 bis 3 HTGV in häuslicher Gemeinschaft gelebt. Angesichts dessen erübrigt sich eine abschließende Erörterung der Frage, ob die im hessischen Recht (ebenso wie im Trennungsgeldrecht des Bundes) vorgenommene Beschränkung des für ein Zusammenleben in häuslicher Gemeinschaft - trennungsgeldrechtlich - in Betracht kommenden Personenkreises unter anderem auf Ehegatten entsprechend der von der Klägerin vertretenen Auffassung gerade im Hinblick auf den - wie sie meint - erheblich größeren Anteil von Frauen unter den nicht verheirateten Berechtigten gegen das Verbot der mittelbaren Diskriminierung wegen des Geschlechts im Entgeltsbereich verstößt (Art. 119 Abs. 1 EWG-Vertrag, Richtlinie des Rates vom 10. Februar 1975 zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über die Anwendung des Grundsatzes des gleichen Entgelts für Männer und Frauen (75/117/EWG), vgl. hierzu Colneric, Gleichberechtigung von Mann und Frau im Europäischen Gemeinschaftsrecht, BB 1988, 968 ff., 971, sowie das Urteil des Bundesarbeitsgerichts vom 26. Mai 1993 - 5 AZR 184/92 -, BAGE 73, 166, 170 ff. = BB 1993, 2451 ff., mit zahlreichen Nachweisen).\n\nRandnummer24\n\nAllerdings mag auch, was die Klägerin zwar nicht ausdrücklich vorträgt, was jedoch in tatsächlicher Hinsicht zutreffen könnte, eine erheblich größere Zahl von trennungsgeldberechtigten Frauen nicht in einer häuslichen Gemeinschaft im Sinne des § 5 Abs. 1 Satz 2 Nr. 1 bis 3 HTGV leben, als dies bei männlichen Berechtigten der Fall ist. Insoweit stellt sich die Frage, ob die zum Nachteil der Klägerin angewendete Vorschrift gegen das Verbot der mittelbaren Diskriminierung der Frau verstößt, unter einem anderen Aspekt, als ihn die Klägerin mit ihrer Forderung, Ledige und Verheiratete müßten trennungsgeldrechtlich gleichbehandelt werden (vgl. hierzu schon Herbst, Die lautlose Diskriminierung der Frau im Beamtenrecht, DÖV 1974, 547, 550 f.), hervorhebt. Für die hier zu treffende Entscheidung kommt es demzufolge darauf an, ob der Verordnungsgeber bei der Höhe des Trennungstagegeldes zwischen Berechtigten differenzieren darf, die (mit bestimmten Personen, insbesondere mit Ehegatten) in häuslicher Gemeinschaft leben und solchen, die dies - wie im Antragszeitraum die Klägerin - nicht tun. Diese Frage bejaht der erkennende Senat aus folgenden Gründen:\n\nRandnummer25\n\nNach Art. 119 Abs. 1 EWG-Vertrag hat jeder Mitgliedstaat den Grundsatz des gleichen Entgelts für Männer und Frauen bei gleicher Arbeit anzuwenden und in der Folge beizubehalten; nach Abs. 2 dieser unmittelbar anwendbaren Vorschrift (BAG a. a. O. S. 170), die auch für öffentlich-rechtliche Dienstverhältnisse gilt (Urteil des Europäischen Gerichtshofs vom 21. Mai 1989 - Rs 248/83 -, NJW 1985, 2076, 2078 , sowie VG Stuttgart PersR 1993, 575 f. mit Anmerk. Klar) sind unter \"Entgelt\" neben den üblichen Grund- oder Mindestlöhnen und -gehältern alle sonstigen Vergütungen zu verstehen, die der Arbeitgeber aufgrund des Dienstverhältnisses dem Arbeitnehmer mittelbar oder unmittelbar oder in Sachleistungen zahlt. Hierzu gehört auch das hier streitige Trennungstagegeld.\n\nRandnummer26\n\nArt. 119 EWG-Vertrag erfaßt nach ständiger Rechtsprechung des Europäischen Gerichtshofs nicht nur die unmittelbare, sondern auch die mittelbare Diskriminierung wegen des Geschlechts; eine solche liegt vor, wenn eine Regel zwar unterschiedslos auf Männer und Frauen anzuwenden ist, die Benachteiligung aber erheblich mehr Frauen als Männer (oder umgekehrt) betrifft und nicht durch objektive Faktoren gerechtfertigt ist, die nichts mit einer Diskriminierung aufgrund des Geschlechts zu tun haben. Es ist Sache des für die Beurteilung des Sachverhalts allein zuständigen nationalen Gerichts festzustellen, ob und inwieweit eine mittelbar diskriminierende Regelung durch derartige objektive Gründe gerechtfertigt ist. Bei dieser Prüfung sind die nationalen Gerichte in der Wahl ihrer Maßstäbe jedoch nicht frei, sondern an die Vorgaben gebunden, die sich nach der Rechtsprechung des Europäischen Gerichtshofs aus dem Gemeinschaftsrecht ergeben. So ist zur Rechtfertigung der von einer Rechtsnorm vorgesehenen Ungleichbehandlung zunächst erforderlich, daß mit dieser Ungleichbehandlung ein sachlicher, nicht auf das Geschlecht bezogener Zweck verfolgt wird; dabei genügt freilich nicht jeder sachliche Grund, sondern nur ein Zweck, der einem objektiven Betrachter hinreichend gewichtig erscheinen muß; hinzukommen muß, daß die Ungleichbehandlung zur Erreichung des rechtfertigenden Ziels auch erforderlich und geeignet ist (BAG, a. a. O. S. 171 ff. mit Hinweisen auf die Rechtsprechung des Europäischen Gerichtshofs).\n\nRandnummer27\n\nNichts anderes ergibt sich aus dem nationalen Verfassungsrecht. Art. 3 Abs. 2 und 3 GG verbietet ebenfalls die mittelbare Diskriminierung von Frauen. Insoweit gelten in der Sache dieselben Voraussetzungen, wie sie der Europäische Gerichtshof im Hinblick auf Art. 119 EWG-Vertrag aufstellt; danach liegt eine nach Art. 3 Abs. 2 und 3 GG verbotene Diskriminierung jedenfalls dann nicht vor, wenn die Ungleichbehandlung durch objektive Faktoren gerechtfertigt ist, die nichts mit einer Diskriminierung aufgrund des Geschlechts zu tun haben (BAG, a. a. O. S. 176). Der über das Diskriminierungsverbot des Art. 3 Abs. 3 GG hinausreichende Regelungsgehalt des Art. 3 Abs. 2 GG besteht dabei darin, daß er ein Gleichberechtigungsgebot aufstellt und dieses auch auf die gesellschaftliche Wirklichkeit erstreckt. Der Satz \"Männer und Frauen sind gleichberechtigt\" will nicht nur Rechtsnormen beseitigen, die Vor- oder Nachteile an Geschlechtsmerkmale anknüpfen, sondern für die Zukunft die Gleichberechtigung der Geschlechter durchsetzen. Er zielt auf die Angleichung der Lebensverhältnisse. Überkommene Rollenverteilungen, die zu einer höheren Belastung oder sonstigen Nachteilen für Frauen führen, dürfen durch staatliche Maßnahmen nicht verfestigt werden. Faktische Nachteile, die typischerweise Frauen treffen, dürfen wegen des Gleichberechtigungsgebotes des Art. 3 Abs. 2 GG durch begünstigende Regelungen angeglichen werden (BVerfGE 85, 191, 207, mit Rechtsprechungsnachweisen).\n\nRandnummer28\n\nNach diesen Grundsätzen erweist sich die den Absätzen 1 und 2 des § 5 HTGV zugrundeliegende Differenzierung als gerechtfertigt. Ein objektiver, die Ungleichbehandlung rechtfertigender Grund ist nämlich auch dann gegeben, wenn die \"Gleichbehandlung\", hier also die Gewährung des Höchstsatzes des Trennungstagegeldes auch an nicht in häuslicher Gemeinschaft mit anderen Personen lebende Trennungsgeldberechtigte, zu einer Veränderung des Leistungszwecks, d. h. der Art der Leistung, führen würde. So liegt es hier:\n\nRandnummer29\n\nTrennungstagegeld in Höhe des Mindestsatzes steht nach Ablauf der in § 4 Abs. 1 und 2 HTGV bezeichneten Frist denjenigen versetzten oder abgeordneten Bediensteten zu, die nicht täglich zum Wohnort zurückkehren und denen die tägliche Rückkehr nicht zuzumuten oder aus dienstlichen Gründen nicht gestattet ist (§ 5 Abs. 3 HTGV). Ein (etwa eineinhalbfach) höherer Tagessatz wird den Berechtigten gewährt, die als Hauptmieter oder Eigentümer einer Wohnung einen Hausstand im Sinne des § 7 Abs. 3 des Hessischen Umzugskostengesetzes haben (Abs. 2). Ein abermals etwa eineinhalbfach höherer Tagessatz steht gemäß Abs. 1 schließlich den in häuslicher Gemeinschaft mit bestimmten Personen lebenden Berechtigten zu, die die Wohnung beibehalten und einen getrennten Haushalt führen. Aus dieser Systematik folgt, daß der Verordnungsgeber den Anspruchsberechtigten Trennungstagegeld in bewußt (wenn auch pauschal) abgestufter Höhe entsprechend den Vorgaben der Ermächtigungsgrundlage im Falle des § 5 Abs. 1 HTGV zum Ausgleich der ihnen durch die getrennte Haushaltsführung, im Falle des Abs. 2 zum Ausgleich der ihnen durch das Beibehalten der Wohnung am bisherigen Wohnort entstandenen notwendigen Auslagen, und zwar jeweils unter Berücksichtigung der häuslichen Ersparnis, gewährt (§ 15 des Hessischen Umzugskostengesetzes), im übrigen nur für die ihnen durch eine Abordnung ohne Zusage der Umzugskostenvergütung entstehenden notwendigen Auslagen (§ 23 des Hessischen Reisekostengesetzes).\n\nRandnummer30\n\nDie vom Verordnungsgeber aufgenommene gesetzliche Zweckbestimmung der gegenüber dem Mindestsatz nach Abs. 3 erhöhten Trennungstagegeldsätze schließt es aus, einem Berechtigten den Höchstsatz zu gewähren, der zwar - wie die seinerzeit in Oldenburg wohnende Klägerin während der Dauer der Vertretung einer F Professur - nach einer Versetzung oder Abordnung seine Wohnung beibehält, der jedoch mangels einer bis dahin bestehenden häuslichen Gemeinschaft keinen \"getrennten\" Haushalt führt. Die von der Klägerin gleichwohl geforderte \"Gleichbehandlung\", nämlich Zahlung des höchsten Trennungstagegeldes ohne die vom Normgeber insoweit vorausgesetzte getrennte Haushaltsführung des in einer häuslichen Gemeinschaft lebenden Berechtigten, würde somit zu einer Veränderung des gesetzlichen Leistungszwecks führen; ein derartiges Ergebnis wird von dem Verbot der auch nur mittelbaren Diskriminierung der Frau im Erwerbsleben nicht umfaßt.\n\nRandnummer31\n\nDer Senat vermag sich in diesem Zusammenhang auch nicht der Auffassung anzuschließen, die dem § 5 Abs. 1 und 2 HTGV zugrundeliegende, ganz überwiegend ledige Frauen benachteiligende Differenzierung sei am einseitigen Rollenbild der Frau als Nur- Hausfrau und am Leitbild des in einer Hausfrauenehe lebenden Beamten orientiert, der als \"Haushaltsvorstand\" finanziell für Frau und Kinder aufzukommen habe (vgl. hierzu Herbst a. a. O., S. 548, mit Hinweisen auf die historische Entwicklung). Vielmehr teilt er die Auffassung des Arbeitsgerichts Frankfurt am Main in dem (nicht veröffentlichten) Urteil vom 22. Oktober 1987 sowie des Bayerischen Verwaltungsgerichtshofs in dem bereits zitierten Urteil vom 26. März 1980, wonach dem versetzten bzw. abgeordneten Trennungsgeldberechtigten (gleich welchen Geschlechts) notwendige (Mehr-) Auslagen entstehen, die erfahrungsgemäß tendenziell höher als im Falle des § 5 Abs. 3 HTGV sind, falls der Anspruchsberechtigte eine als \"Hausstand\" vorhandene Wohnung beibehält (Abs. 2) und nochmals höher, falls er, da er bislang in häuslicher Gemeinschaft lebte, nunmehr einen getrennten Haushalt führen muß (Abs. 1). Für die insoweit - auch bezüglich der konkreten Höhe der Trennungstagegeldsätze nach Abs. 2 und 3 - vorgenommene Differenzierung bestehen hinreichende objektive Rechtfertigungsgründe, die sich in Übereinstimmung mit dem erläuterten Gesetzeszweck sowohl aus Mehraufwendungen am neuen Dienstort als auch aus (verringerter) häuslicher Ersparnis am bisherigen alleinigen Wohnort ergeben. Auf die den Beteiligten bekannten Ausführungen der genannten Gerichte wird, um Wiederholungen zu vermeiden, mit folgenden Ergänzungen verwiesen:\n\nRandnummer32\n\nDie Klägerin meint, einem ledigen (meist weiblichen) Trennungsgeldberechtigten entstünden am neuen Dienstort jedenfalls keine geringeren Aufwendungen als einem verheirateten (meist männlichen) Berechtigten. Abgesehen davon, daß es für den Anspruch auf den Höchstsatz des § 5 Abs. 1 Satz 2 Nr. 1 HTGV nicht ausreicht, verheiratet zu sein, vielmehr - vor allem - getrennte Haushaltsführung vorliegen muß, trifft die Annahme der Klägerin auch in der Sache nicht unbedingt zu. Hierfür genügt beispielsweise der Hinweis darauf, daß einem - weiblichen oder männlichen - Beamten, der mit seinem Ehegatten oder bestimmten anderen Personen in häuslicher Gemeinschaft lebt, zugestanden ist, sich am neuen Dienstort von den in Betracht kommenden Personen besuchen zu lassen, anstatt selbst eine \"Familienheimfahrt\" zu unternehmen (§ 7 Abs. 8 HTGV); deshalb sind auch Mehraufwendungen für eine Unterkunft am neuen Dienstort, die einen derartigen Besuch erst ermöglichen, als notwendig anzuerkennen mit der Folge, daß dies bei der Bemessung des Trennungstagegeldsatzes berücksichtigt werden darf. Im übrigen mag zwar der Verpflegungsaufwand am neuen Dienstort für alle Betroffenen gleich hoch sein; dennoch kommen auf den in häuslicher Gemeinschaft u. a. mit seinem Ehegatten lebenden Trennungsgeldberechtigten durch die Versetzung oder Abordnung Kosten erstmals zu, die er in dieser Höhe bisher wegen des günstigeren gemeinschaftlichen Wirtschaftens nicht hatte. Auch diese (relativen) Mehrkosten dürfen bei der Festsetzung abgestufter Tagessätze Berücksichtigung finden, ohne daß darin ein Verstoß des Verordnungsgebers gegen das Verbot der - mittelbaren - Geschlechterdiskriminierung zu erblicken wäre.\n\nRandnummer33\n\nDie von der Klägerin ebenfalls als durch § 5 HTGV verletzt angesehene Gleichbehandlungsrichtlinie 76/207/EWG betrifft die Gleichbehandlung außerhalb des Grundsatzes der Lohngleichheit. Da jedoch das hier streitige Trennungstagegeld als \"Entgelt\" im Sinne des Art. 119 EWG-Vertrag anzusehen ist, findet sie hier keinen Anwendungsbereich mehr (vgl. BAGE 73, 166, 175).\n\nRandnummer34\n\nNach allem ist die Berufung der Klägerin mit der sich aus § 154 Abs. 2 VwGO ergebenden Kostenfolge zurückzuweisen.\n\nRandnummer35\n\nDie Vollstreckbarkeitserklärung beruht auf § 167 VwGO i. V. m. den §§ 708 Nr. 11 und 711 ZPO.\n\nRandnummer36\n\nGründe für eine Zulassung der Revision nach § 132 VwGO liegen nicht vor."}, {"id": "P23", "query": "Late travel claim", "description": "I forgot to submit my travel expenses from last year. Can I still claim them?", "narrative": "Relevant documents answer this question.", "title": "Internal funding - UNI", "url": "https://www.uni-kassel.de/uni/en/research/research-and-graduate-support/research-support/finding-funding/internal-funding.html", "text": "Internal funding\n\nThe Central Research Fund (ZFF)\n\nThe ZFF offers researchers at all career levels at the University of School of Art and Design financial support in preparing a third-party funding application and promotes cooperation between the Faculties and the School of Art and Design.\n\nZFF funding lines\n\nGoalsThe funding line Coop encourages interdisciplinary collaboration between the faculties and the Kunsthochschule (School for Art and Design).\nFocusThis funding line targets projects with prospects for a long-term collaboration. Open access is recommended for publications.\nTarget GroupAll researchers at the University of Kassel who are planning an interdisciplinary project in collaboration with the Kunsthochschule are eligible to apply. At least one PI must be a member of the Kunsthochschule.\nScopeMaximum funding is 15,000 € for the funding line per year, which can be used for material and travel costs as well as hiring student assistants. The maximum funding duration is one year.\nSubmissionThe proposal is submitted via Converis.\nDeadline1 November — in case of remaining funds, the second annual application deadline is 1 May\nSelection criteria\n  • Scientific quality of the proposal\n  • Active support of early career researchers\n  • Contribution of the research project to strengthening the main research foci of the University of Kassel\n  • Contribution to promoting new research topics\n  • Potential to establish a long-term interdisciplinary cooperation\n\n \n\nGoalThe funding line Project is intended to support researchers in preparing a proposal for individual third-party funding.\nFocusThis funding line targets projects with chances of submitting a promising individual third-party funding proposals. Open access is recommended for publications.\nTarget GroupAll researchers of the University of Kassel incl. Kunsthochschule who have completed their doctorate and are at the beginning of their career in Kassel, i.e. (i) postdocs within the first 6 years after their PhD, and (ii) professors newly appointed at U Kassel in the first five years after taking up their post.\nScopeMaximum funding is 12,000 € per proposal, which can be used for material and travel costs as well as hiring student assistants. The maximum funding duration is one year\nSubmissionThe proposal is submitted via Converis.\nDeadline1 February / 1 May /  1 November\nSelection criteria\n  • Scientific quality of the proposal\n  • Potential to acquire third-party funds in order to ensure longer-term funding\n  • Promotion of young researchers\n  • Contribution of the research  project to strengthening the main research foci of the University of Kassel\n  • Contribution to promoting new research topics\n\n \n\nGoalThe funding line Individually Qualified supports applicants who are preparing promising proposals for individual excellence-oriented junior researcher programmes (such as DFG-Emmy Noether, ERC SG).\nFocusThis funding line targets projects with chances to submit a promising proposal for the above-mentioned programmes. Open access is recommended for publications.\nTarget GroupEarly career researchers (R2+R3) of U Kassel incl. Kunsthochschule who aim to locate their third-party funded project at the University of Kassel or Kunsthochschule are eligible to apply.\nScopeMaximum funding is 60,000 €, and it can be used for personnel, material and travel costs as well as student assistants. The funding duration is one year.\nSubmissionThe proposal is submitted via Converis.\nDeadline15 May / 15 Oct\nSelection criteria\n  • Scientific quality of the proposal\n  • Potential to acquire third-party funds in order to ensure long-term funding\n  • Active support of young researchers\n  • Contribution of the research project to strengthening the main research foci of the University of Kassel\n  • Contribution to promoting new research topics\nGoalThe funding line Cluster supports collaborative projects that advance the thematic focus in line with the University of Kassel's development plan and thus contribute to the medium-term excellence capability.\nFocusThis funding line targets projects, which aim at applying for a large collaborative project (SFB/GRK/TRR) and supports them during preparation of the draft proposal (Skizze). Open access is recommended for publications, if any.\nTarget GroupAll professors of the University of Kassel incl. Kunsthochschule, who're within the first ten years of assuming their first professorship, can apply when aiming for a collaborative research project with the University of Kassel or Kunsthochschule as lead institution. Postdocs can be co-applicants; consortia are strongly encouraged to involve early-career researchers in the proposal.\nScopeMaximum funding is 90,000 € per year and can be used for personnel, student assistants, travel and material costs. Project duration is max. 18 months.\nSubmissionThe proposal is submitted via Converis.\nDeadline15 May / 15 October\nSelection criteria\n  • Scientific quality of the proposal\n  • Potential to acquire third-party funds in order to ensure long-term funding\n  • Active support of young researchers\n  • Contribution of the research project to strengthening the main research foci of the University of Kassel\n  • Contribution to promoting new research topics\nGoalThe funding line Focus supports collaborative initiatives during the draft proposal stage, focussing on increasing coherence and cohesion.\nFocusThe aim of this funding line is to promote cohesion of the consortium via a suitable format such as colloquia, workshops, coaching sessions etc. together with the Research Support office. Involving an external coach can be supported with an additional 2,000 €. Open access is recommended for publications, if any.\nTarget GroupProfessors of the University of Kassel or Kunsthochschule intending to write a collaborative research proposal are eligible for the funding.\nScopeMaximum funding is 5,000 € (plus an additional 2,000 € for an external coach, if applicable) for material and travel costs.\nSubmissionThe proposal is submitted via the Research Support office with reference to existing work.\nDeadlineA submission is possible at any time.\nSelection criteria\n  • Scientific quality of the proposal\n  • Potential to acquire third-party funds in order to ensure a permanent funding\n  • Active support of young researchers\n  • Contribution of the research project to strengthening the main research foci of the University of Kassel\n  • Contribution to promoting new research topics\n\nApplication via Converis\n\nTo the ZFF application via Converis\n\nApplication via Converis: Forward\n\nContact us\n\nFAQs\n\nFrequently asked questions with answers about the ZFF\n\nFAQs: Forward\n\nZFF documents\n\nFurther links:\n\nGo link of this page: https://www.uni-kassel.de/go/zff-en"}, {"id": "P24", "query": "Familienheimfahrt Abordnung", "description": "Werden Heimfahrten zur Familie während einer Abordnung erstattet?", "narrative": "Relevant sind Vorschriften zu Reisebeihilfen für Familienheimfahrten.", "title": "4 K 561/21 | Hessisches Finanzgericht 4. Senat | 17.01.2025 | Urteil", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/LARE250000443", "text": "Orientierungssatz\n\nOb ein (unbefristet tätiger) Berufssoldat einer Diensstelle der Bundeswehr dauerhaft zugeordnet ist und dort eine erste Tätigkeitsstätte begründet, richtet sich u.a. danach, ob ihm nach der einschlägigen Verfügung der Bundeswehr ein fest eingerichteter Dienstposten ohne zeitliche Befristung zugewiesen wurde.\nDie Angabe der voraussichtlichen Verwendungsdauer in einer solchen Verfügung stellt nach der Rechtsprechung des BFH keine Befristung in diesem Sinne dar.\n\nVerfahrensgang ausblendenVerfahrensgang\n\nnachgehend BFH München, VI B 5/25, Nichtzulassungsbeschwerde anhängig\n\nTenor\n\nDie Klage wird abgewiesen.\n\nDer Kläger hat die Kosten des Verfahrens zu tragen.\n\nTatbestand\n\nDie Beteiligten streiten darüber, ob der Beklagte –das Finanzamt– bei der Einkommensteuerveranlagung 20xx und 20xx vom Kläger geltend gemachte Aufwendungen einerseits für Fahrtkosten und andererseits für eine doppelte Haushaltsführung oder Übernachtungskosten im Rahmen einer Auswärtstätigkeit zu Recht bei dessen Einkünften aus nichtselbstständiger Arbeit nicht zum Werbungskostenabzug zugelassen hat. Dem liegt folgender Sachverhalt zugrunde:\n\n1. a. Der seit 20xx getrenntlebende und in 20xx geschiedene Kläger war ab dem 1. Januar 20xx Soldat auf Zeit bei der Bundeswehr. In den Jahren 20xx bis 20xx schlug er die Offizierslaufbahn ein und absolvierte vom 20. August 20xx bis 2. Juli 20xx die Offiziersausbildung verbunden mit einem entsprechenden Studium.\n\nAufgrund Versetzungsverfügung vom 15. April 20xx wurde er mit Wirkung vom 6. Juli 20xx und einer voraussichtlichen Verwendungsdauer bis 30. Juni 20xx von seinem bisherigen Dienstort in … zu dem Ausbildungszentrum … der Bundeswehr nach … versetzt. Als neuer Dienstposten wurde dem Kläger ein Dienstposten zur besonderen Verwendung … zugewiesen.\n\nMit Wirkung vom 17. Februar 20xx wurde der Kläger sodann zum Berufssoldaten ernannt und zum 1. Mai 20xx zum Leutnant befördert. Parallel dazu wurde ihm mit Verfügung zum Dienstpostenwechsel vom 27. April 20xx ein anderer Dienstposten mit der Bewertung … bei gleichzeitiger Verlängerung der voraussichtlichen Verwendungsdauer bis 30. April 20xx an dem bisherigen Dienstort in … zugewiesen. Dabei wurde er auch einer anderen Teileinheit zugeordnet und war fortan in einem Technischen Zug (TechnZg) als Zugführer Streitkräfte (ZgFhr SK) und Instandsetzungsoffizier Landsysteme (InStOffz LdSys) tätig.\n\nMit Verfügung vom 19. März 20xx wurde der Kläger für einen Zeitraum von zehn Tagen an einen Lehrgang betreffend Umweltschutz nach ... abkommandiert.\n\nMit der 1. Korrektur vom 8. November 20xx zur Versetzungsverfügung vom 4. Juli 20xx (die dem Gericht nicht vorliegt) wurde der Kläger aus dienstlichen Gründen (bei gleichbleibendem Dienstort …) versetzt. Ausweislich der Verfügung war ihm bereits zuvor, bei gleicher Laufbahn und gleichbleibender Verwendung als Zugführer Streitkräfte / Instandsetzungsoffizier Landsysteme in einem Technischen Zug, ein neuer Dienstposten … zugewiesen worden und wurde er, ob bereits im Zuge der Ausgangsverfügung vom 4. Juli 20xx oder erst später, dann auch zum Oberleutnant …befördert.\n\nb. Bis einschließlich 20xx wohnte der Kläger nach seinen Angaben am damaligen Familienwohnsitz in …. Am 3. Juli 20xx meldet er sich mit seinem Hauptwohnsitz zum 1. Juli 20xx nach …, …, an. Unter dieser Anschrift befindet sich ein (zumindest im Streitzeitraum) im Eigentum seiner Eltern befindliches Reihenendhaus, welches ausweislich der vorgelegten Pläne aus einer einzigen abgeschlossenen Wohnung besteht, die sich über zwei Stockwerke nebst Dach- und Kellergeschoss erstreckt. Die Entfernung von … nach … beträgt rund xxx km. Darüber hinaus mietete der Kläger zum 1. Juli 20xx in …, welches x km von … entfernt liegt, eine ca. 70 qm große Einliegerwohnung bestehend aus zwei Zimmern, Küche, Bad/WC und Terrasse für eine monatliche Bruttomiete von xxx €.\n\n2. Für den Veranlagungszeitraum 20xx machte der Kläger im Rahmen einer beruflichen Auswärtstätigkeit Aufwendungen in Höhe von x.xxx € (xxx Fahrten von … nach …; xx km x 2 = xxx km) und für 20xx in Höhe von x.xxx € (xxx Fahrten von der Wohnung in … nach …; x km x 2 = xx km) geltend. Darüber hinaus machte er ferner Aufwendungen für eine beruflich veranlasste doppelte Haushaltsführung bzw. für Übernachtungskosten bei einer Auswärtstätigkeit geltend und zwar in Höhe von x.xxx € (für 20xx) und in Höhe von x.xxx € (für 20xx). Im Einzelnen handelte es sich dabei in 20xx um Fahrtkosten (erste Fahrt) zur Tätigkeitsstätte in Höhe von xxx € (xxx km x 0,30 €), um Aufwendungen für 24 Familienheimfahrten in Höhe von x.xxx € (xxx km x 0,30 €) sowie um Unterkunftskosten der Zweitwohnung in … in Höhe von x.xxx €. In 20xx setzten sich die geltend gemachten Aufwendungen zusammen aus Fahrtkosten (erste Fahrt) zur Tätigkeitsstätte in Höhe von xxx € (xxx km x 0,30 €), um Aufwendungen für 42 Familienheimfahrten in Höhe von x.xxx € (xxx km x 0,30 €) sowie um Unterkunftskosten der Zweitwohnung in … in Höhe von x.xxx €.\n\nIn den am 25. November 20xx zur Post gegebenen Einkommensteuerbescheiden für 20xx und 20xx ließ das Finanzamt die geltend gemachten Aufwendungen in weiten Teilen nicht zum Werbungskostenabzug zu, sondern berücksichtigte lediglich die Fahrten nach … im Rahmen der Entfernungspauschale und erläuterte dies entsprechend.\n\nDen vom Kläger daraufhin am 30. Dezember 20xx eingelegten Einspruch wies das Finanzamt mit Einspruchsentscheidung vom 22. März 20xx als unbegründet zurück.\n\n3. Mit seiner am 23. April 20xx erhobenen Klage verfolgt der Kläger sein Begehren weiter.\n\nDer Kläger meint, dass es sich bei der Tätigkeit an der Dienststätte in … um eine Auswärtstätigkeit handeln würde. Aufgrund der Versetzungsverfügung vom 15. April 20xx sei er für einen Zeitraum von unter drei Jahren nach … versetzt worden. Da dieser Zeitraum nicht über 48 Monate hinausgehe, sei er auswärts tätig. Gleiches gelte für die Verfügung vom 27. April 20xx; auch danach werde der Prognosezeitraum von 48 Monaten nicht überschritten und verbleibe es somit bei einer Auswärtstätigkeit.\n\nAufgrund der Trennung habe der Kläger seinen Lebensmittelpunkt ab dem 1. Juli 20xx nach … verlegt. Es sei so, dass er sich das Haus mit seinen Eltern teile. Seine Eltern würden das gesamte Erdgeschoss und die Hälfte des Obergeschosses nutzen. Er selbst habe die andere Hälfte des Obergeschosses in Klammern Gästezimmer) sowie das komplette Dachgeschoss bewohnt. Nach einem vom Kläger vorgelegten Plan sei im Dachgeschoss ein kleines Bad mit WC und Dusche sowie eine Küchenzeile eingebaut worden. An den Kosten der Lebensführung beteilige er sich dergestalt, dass er einen monatlichen Beitrag i.H.v. xxx € (in der Regel in bar) für anfallende Verbrauchs-/ Nebenkosten zahle. Ferner habe er alle Kosten für Umbaumaßnahmen und die Anschaffung von Möbeln ausschließlich selbst getragen. In diesem Zusammenhang legte er acht Belege über diverse einzelne Einrichtungsgegenstände, u.a., von denen jedoch nur ein Beleg (betreffend den Kauf einer Duschrinne zum Preis von xx,xx €) aus 20xx und vier weitere Belege (betreffend Käufe von 10 LED Einbaustrahlern für xx €, einer Geberit Sigma Spülung für xx €, diverser Badezimmermöbel und Einbauartikel für x.xxx,xx € sowie einer Matratze für xxx €) aus 20xx stammten (die übrigen, betreffend weitere Einbauartikel für das Bad, z.B. eine Duschbrause, Brausestange, Duschabtrennung, dagegen aus 20xx).\n\nIn beiden Streitjahren sei er im angegebenen Umfang im Rahmen von Familienheimfahrten jeweils immer nach … gefahren; teilweise habe er an den entsprechenden Wochenenden auch die Kinder bei sich gehabt (für die näheren Einzelheiten wird auf die Aufstellung des Klägers auf Bl. 32, 33 sowie 38,39 der Akte verwiesen). Daneben habe er in … regelmäßig auch seinen Bruder sowie zwei Freunde getroffen, wobei er genaue Angaben hierzu nicht mehr machen könne. Aktive Vereinsmitgliedschaften würden in … nicht bestehen und aufgrund der für ihn bestehenden freien Heilfürsorge habe er in … auch keine Ärzte aufgesucht.\n\nDie Fahrten von und nach … habe er jeweils mit einem Pkw (bis 05.12.20xx BMW 530d; danach mit einem BMW 535dX) sowie ab dem 23.03.20xx auch mit einem Motorrad zurückgelegt, wobei er keine genauen Angaben mehr dazu machen könne, wann genau er welches Fahrzeug Benutzt habe.\n\nDa es sich bei der Dienststelle in … nicht um die erste Tätigkeitsstätte handeln würde seien die Fahrten von … und später … sowie von … nach … nach Reisekostengrundsätzen, also für die Hin- und Rückfahrt mit je 0,30 € zum Werbungskostenabzug zuzulassen. Darüber hinaus seien, da die Voraussetzung einer doppelten Haushaltsführung vorliegen würden, die Aufwendungen für die Miete der Wohnung in … ebenfalls anzuerkennen. Hieraus ergebe sich für 20xx ein Werbungskostenabzug in Höhe von x.xxx € (wovon bereits x.xxx € anerkannt wurden) und für 20xx in Höhe von x.xxx € (wovon bislang xxx € anerkannt wurden).\n\nDie Grundsätze des Urteils des BFH vom 22.11.2022 (Az.: VI R 6/21) seien auf den vorliegenden Streitfall nicht anwendbar. Denn einerseits sei dort der Status Berufssoldat bzw. eine höhere Laufbahn angestrebt worden. Und zum anderen könne davon ausgegangen werden, dass die voraussichtliche Verwendungsdauer eine echte Befristung sei.\n\nDer Kläger beantragt,\n\ndie Einkommensteuerbescheide 20xx und 20xx, beide vom 25. November 20xx und in Gestalt der Einspruchsentscheidung vom 22. März 20xx, dahingehend zu ändern, dass für den Veranlagungszeitraum 20xx weitere Werbungskosten in Höhe von x.xxx € und für den Veranlagungszeitraum 20xx weitere Werbungskosten in Höhe von x.xxx € jeweils bei den Einkünften aus nichtselbstständiger Tätigkeit zum Abzug zugelassen werden.\n\nDer Beklagte beantragt,\n\ndie Klage abzuweisen.\n\nZur Begründung verweist er bezüglich der streitigen Aufwendungen für eine doppelte Haushaltsführung auf die Einspruchsentscheidung. Wie bereits im Veranlagungsverfahren habe der Kläger auch im Klageverfahren weder wesentliche Ausführungen gemacht, noch objektiv nachvollziehbare Beweismittel vorgelegt.\n\nAllein die Meldebescheinigung sei kein ausreichendes Indiz für eine Verlagerung des Lebensmittelpunktes. Auch die vagen Angaben zu persönlichen Beziehungen und Treffen könnten nicht der Entscheidungsfindung dienen. Es lasse sich nicht nachvollziehen, ob, inwieweit und ab welchem Zeitpunkt der Kläger bei den Eltern aus eigenem Recht Wohnräume genutzt habe. Für die in bar geleistete Zahlungen habe der Kläger weder eine Bestätigung der Eltern noch entsprechende Abhebungsnachweise vorgelegt. Ebenso seien keine Nachweise über die von ihm (nach seinem Vortrag getragenen) Umbaukosten für Küche und Bad oder für die Kosten für die Anschaffung von Möbeln vorgelegt worden. Die wenigen Rechnungen, die der Kläger vorgelegt habe, seien zudem nicht geeignet, eine wesentliche finanzielle Beteiligung oberhalb der Bagatellgrenzen anzunehmen. Auch die Anzahl und Durchführung der Famili
