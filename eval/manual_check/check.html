-Mail mit Vorname, Nachname, Geburtsdatum, Reiseziel und Reisedatum an arb.vorsorge[at]uni-kassel[dot]de\n\nSie erhalten zeitnah eine Einladung zur Arbeitsmedizinischen Vorsorge per E-Mail und können sich dann im Anschluss direkt mit dem MAS (Tel.: +49 561 701-65 934) zur Terminvereinbarung in Verbindung setzen. Notwendige Schutzimpfungen und andere prophylaktische Maßnahmen (z. B. gegen Malaria) sowie Gesundheitsatteste für Reisen in Infektions- und Epidemiegebiete, die für die Dienstreise zwingend erforderlich sind, werden ebenfalls durch das MAS vorgenommen.\n\nEine Kostenerstattung für selbstverauslagte Impf- bzw. Arztkosten ist nicht möglich.\n\nBitte informieren Sie sich vor jeder Reise, insbesondere ins außereuropäische Ausland, ob Impfungen erforderlich sind oder sonstige medizinische Vorsorgemaßnahmen getroffen werden müssen.\n\nDas europäische Gemeinschaftsrecht sieht vor, dass Beschäftigte, die vom Arbeitgeber befristet ins EUAusland, in die EWR-Staaten sowie in die Schweiz entsendet werden (z. B. auf Dienstreise) eine Entsendebescheinigung (A1-Bescheinigung) mit sich führen müssen. Dies gilt auch für Beamte und Beschäftigte des öffentlichen Dienstes.\n\nEine entsprechende Vorschrift besteht auch für verschiedene Staaten mit denen Deutschland bilaterale Abkommen vereinbart hat (E101-Bescheinigungen): \n\nNach derzeitiger Rechtslage benötigen alle Beschäftigten sowie Beamtinnen und Beamte eine A1/E101-Bescheinigung, sobald sie auf dienstliche Veranlassung grenzüberschreitend innerhalb der EU, des EWR, der Schweiz oder in einem der Staaten, mit denen ein bilaterales Abkommen besteht tätig werden.\nUm das entsprechende Antragsverfahren für alle Beschäftigten sowie Beamtinnen und Beamte der Universität Kassel möglichst reibungslos zu gestalten, wird die Beantragung einer Entsendebescheinigung für die vorstehend genannten Länder im Rahmen des bekannten Dienstreisegenehmigungsprozesses von der Dienstreisesachbearbeitung vorgenommen. Diese stellt wiederum für die Dienstreisenden bei dem zuständigen Sozialversicherungsträger einen Antrag auf Ausstellung der Entsendebescheinigung.\n\nDa der Bearbeitungsprozess bei den Sozialversicherungsträgern von der Universität Kassel nicht beeinflusst werden kann, wird empfohlen, spätestens acht Wochen vor Beginn einer Auslandsdienstreise die Genehmigung der Reise über das bekannte ESS-System mit folgenden zwingend erforderlichen Angaben zu beantragen:\n\n  • Detaillierte Anschrift(en) am Geschäftsort mit Straße, Hausnummer, Postleitzahl und Ort\n\n  • Sozialversicherungsnummer (sofern diese nicht bereits in der Abteilung Personal und Organisation vorliegt)\n\n  • Name und Anschrift der Krankenversicherung\n\nBeamtinnen und Beamte, die häufiger ins Ausland reisen, wird empfohlen, das anliegende Formblatt (Mitteilung der Sozialversicherungsnummer und der Krankenkasse)  auszufüllen und an die Abteilung Personal und Organisation zu senden. Hierdurch besteht die Möglichkeit, die Sozialversicherungsnummer im Vorfeld zu erfassen, so dass es bei der Beantragung von künftigen Dienstreisen zu keinen Verzögerungen kommt.\n\nIm Interesse aller Beschäftigten sowie Beamtinnen und Beamte, die sich auf Dienstreisen begeben müssen, wird darauf hingewiesen, dass die Beantragung solcher Entsendungsbescheinigungen durch die Arbeitgeber gemäß § 106 des vierten Sozialgesetzbuches verpflichtend ist. Es wird daher dringend empfohlen, erst nach Genehmigung der Dienstreise und nach Ausstellung der Bescheinigung durch den Sozialversicherungsträger, die Dienstreise anzutreten. Sollte die Auslandsdienstreise kurzfristig anberaumt werden, so dass der erforderliche Vorlauf nicht eingehalten werden kann, sollte mindestens der Antrag auf Ausstellung einer A1-Bescheinigung in Kopie bzw. das Ersatzschreiben der Reisekostensachbearbeitung mitgeführt werden.\n\nErforderliche Reisedokumente (Visum, Reisepass, etc.) sind rechtzeitig, eigenständig vor Beginn der Dienstreise zu beschaffen. Gegebenenfalls ist für die Abholung der Reisedokumente ein gesonderter Reiseantrag zu stellen.\n\nBei einem Arbeitsaufenthalt im Ausland unter besonderen klimatischen und gesundheitlichen Bedingungen ist eine Untersuchung beim Betriebsärztlichen Dienst \"MAS\" nach dem Grundsatz G35 erforderlich. Bitte vereinbaren Sie einen Termin per Mail unter Angabe des Vornamens, Nachnamens, Geburtsdatums, Reiseziel und Reisedatum unter arb.vorsorge[at]uni-kassel[dot]de.\n\nNotwendige Schutzimpfungen und andere prophylaktische Maßnahmen (z. B. gegen Malaria) sowie Gesundheitsatteste für Reisen in Infektions- und Epidemiegebiete, die für die Dienstreise zwingend erforderlich sind, werden ebenfalls durch das MAS vorgenommen.\n\nFür Strecken, die aus triftigen Gründen mit einem nicht regelmäßig verkehrenden Beförderungsmittel zurückgelegt wurden, werden die notwendigen Kosten erstattet. Die triftigen Gründe müssen bei der Abrechnung der Reisekosten erläutert werden.\n\nFür die Benutzung eines Mietwagens bei Auslandsdienstreisen gilt: Grundsätzlich können in diesen Fällen die Kosten für die Anmietung eines Kraftfahrzeugs der unteren Mittelklasse (z. B. VW Golf) erstattet werden.\n\nLiegt kein triftiger Grund für die Benutzung eines Mietwagens oder Taxis vor, werden höchstens die Kosten erstattet, die beim Benutzen eines regelmäßig verkehrenden Beförderungsmittels (z. B. Bus oder Bahn) entstanden wären. Bitte legen Sie die Vergleichsrechnung, wenn möglich, bei. Die Erstattung nach § 5 Abs. 1 BRKG, d.h. 0,20 € Wegstreckenentschädigung bis maximal 130,00 €.\n\n  • Für die Benutzung des privaten Kraftfahrzeugs oder eines anderen motorbetriebenen Fahrzeugs werden für jeden zurückgelegten Kilometer 0,20 €, höchstens aber 130,00 € erstattet. Dies gilt auch für Fahrten zum Bahnhof oder Flughafen.\n  • Besteht an der Benutzung des privaten Kraftfahrzeugs ein erhebliches dienstliches Interesse (triftige Gründe), beträgt die Wegstreckenentschädigung 0,30 € für jeden zurückgelegten Kilometer.\n  • Eine Mitnahmeentschädigung gibt es bei Auslandsdienstreisen nicht.\n  • Mit der fünften allgemeinen Verwaltungsvorschrift zur Änderung der BRKGVwV vom 01.12.2022 werden die Kosten für Maut, Fähre ausnahmslos erstattet, d.h. auch wenn für die Kfz-Nutzung kein triftiger Grund vorliegt.\n  • Parkgebühren werden bei Vorliegen triftiger Gründe in voller Höhe erstattet. Liegen keine triftigen Gründe vor, werden die Parkgebühren maximal bis zu einem Betrag von 15,00 € pro Tag erstattet.\n\n \n\nOhne Nachweis wird auf Antrag für jede notwendige Übernachtung ein Übernachtungsgeld in Höhe von 50 % des in der ARV ausgewiesenen Betrages für das jeweilige Land, höchstens jedoch 30,00 € je Nacht erstattet.\n\nNachgewiesene Übernachtungskosten werden bis zu einer Höhe des in der ARV ausgewiesenen Betrages für das jeweilige Land erstattet. Darüber hinaus gehende Übernachtungskosten werden nur erstattet, wenn sie unvermeidbar waren. D. h. die Notwendigkeit ist im Einzelfall nachvollziehbar schriftlich bei Antragsstellung zu begründen.\n\nErfolgt keine Erklärung der Notwendigkeit, ist nur der jeweils geltende Satz je Nacht erstattungsfähig!\n\nRechnungen für Übernachtungskosten werden nur erstattet, sofern die Universität Kassel als Adressat angegeben ist. Grundsätzlich finden nur die reinen Übernachtungskosten ohne sonstige Leistungen (z. B. ausgewiesene Verpflegungskosten wie Frühstück) Berücksichtigung.\nUm Rückfragen zu vermeiden und um eine schnellere Bearbeitung der Abrechnung zu ermöglichen, sollten Dienstreisende - sofern erforderlich - ihre Bemühungen, eine preiswerte Unterkunft zu bekommen, im Einzelnen dokumentieren (z. B. Ausdruck eines Onlineportals, Anfragen per E-Mail oder Fax) und diese der Abrechnung beifügen.\n\nDie Kosten für CO2-Kompensationen sind nicht erstattungsfähig. Die Ausgleichszahlungen erfolgen direkt über das Land Hessen, da die Universität Kassel am Ende eines Jahres alle notwendigen Daten an das Hessische Ministerium für Wissenschaft und Kunst übermittelt.\n\nBitte beachten Sie die Regelungen zur Exportkontrolle den Leitfaden zur Informationssicherheit auf Dienstreisen:\n\nhttps://www.uni-kassel.de/uni/forschung/forschungs-und-graduiertenfoerderung/forschungsfoerderung/rahmenbedingungen-guter-forschung/exportkontrolle\n\nhttps://www.uni-kassel.de/hochschulverwaltung/organisation/beauftragte/informationssicherheit/schutzmassnahmen/dienstreise\n\nFür weitere Rückfragen wenden Sie sich bitte an die Exportkontrollbeauftragte der Universität Kassel bzw. an das IT-Servicezentrum der Universität Kassel.\n\nNach oben\n\nInformationen zur Dienstreise mit öffentlichen Verkehrsmitteln\n\nInhaber einer Bahncard Business erhalten beim Einsatz dieser Bahncard Business zusätzlich zu dem jeweiligen Bahncard Rabatt den Firmenkundenrabatt des Landes Hessen.\n\nDie Erstattung der Anschaffungskosten einer BahnCard Business kann unmittelbar nach Anschaffung erfolgen, wenn vor Anschaffung dargelegt wird, wieviele Reisen für das kommende Jahr geplant sind und dass sich die Anschaffungskosten dadurch voraussichtlich amortisieren.\n\nDer Antrag auf Erstattung der Kosten für die Beschaffung einer Bahncard Business ist vor Beschaffung der Bahncard bei der Reisekostensachbearbeitung zur Entscheidung einzureichen. Wurde der Antrag positiv entschieden und die Erstattung der Anschaffungskosten für die Bahncard Business zugesagt, können diese unmittelbar erstattet werden, sobald die Originalrechnung der Bahncard Business zusammen mit dem genehmigten Antrag bei der Reisekostensachbearbeitung eingereicht wird.\n\nBitte beachten Sie, dass nur die Kosten für die Bahncard Business erstattet werden können, die in der Prognoseentscheidung genehmigt wurde.\n\n \n\nDie Erstattung der Anschaffungskosten für eine private BahnCard ist ausschließlich dann möglich, wenn sich die Kosten aufgrund von durchgeführten Dienstreisen vollständig amortisiert haben. Eine Voraberstattung oder die anteilige Erstattung der Anschaffungskosten ist nicht möglich.\n\nDer Antrag auf Erstattung der Anschaffungskosten einer privaten Bahncard ist, zusammen mit der Originalrechnung der Bahncard bei der Reisekostensachbearbeitung einzureichen. Sind auf der Rechnung mehrere Bahncards ausgewiesen (z. B. Partnerbahncard), ist dem Antrag zusätzlich eine Kopie der Bahncard der Antragstellerin/des Antragstellers beizufügen.\n\nSofern Sie im Besitz einer privaten BahnCard sind ist diese zwingend für Dienstreisen einzusetzen.\n\nDienstreisende haben die folgenden Möglichkeiten eine Fahrkarte zu beschaffen:\n\n1. Erwerb eines Fahrscheins an einem Schalter der Deutschen Bahn:\n\nSie benötigen:\n\n  • die Kundennummer der Universität Kassel. Diese erhalten Sie bei Ihrer zuständigen Reisekostensachbearbeitung. Bitte füllen Sie vorher das Formular Verpflichtungserklärung aus. Damit bestätigen Sie, dass Sie die Kundennummer nur für dienstliche Reisen nutzen werden.\n  • oder eine kostenlose BonusCard Business. Die BonusCard Business erhalten Sie nach Bestellung über das Firmenkundenportal.\n\nDie Kombination des Firmenkundenrabattes mit der privaten BahnCard 25 oder 50 ist nicht möglich. Ggf. wird eine Bearbeitungsgebühr erhoben. Der Fahrschein muss vor Ort am Schalter bezahlt werden.\n\n2. Online-Ticket über das Firmenkundenportal der DB\n\nFür alle Bediensteten der Universität Kassel besteht die Möglichkeit, über das Firmenkundenportal Online-Tickets zu buchen.    \n\nRegistrierung im Firmenkundenportal der Deutschen Bahn:\nÜber Ihre zuständige Reisekostensachbearbeitung können Sie im Firmenkundenportal registriert werden. Dazu müssen Sie das Formular Verpflichtungserklärung vollständig ausfüllen. Zwingend muss in der Verpflichtungserklärung Ihre dienstliche E-Mailadresse angegeben werden. Anschließend senden Sie diese Erklärung an die zuständige Reisekostensachbearbeitung.\n\nNachdem Sie von der Abteilung Personal und Organisation im Firmenkundenportal registriert wurden, erhalten Sie eine E-Mail mit einem Link zum Firmenkundenportal. Über diesen Link können Sie Ihre persönlichen Zugangsdaten einrichten. Erfolgt die Anmeldung nicht innerhalb von 60 Tagen nach Erhalt der E-Mail, verfällt der Link. Sobald Sie angemeldet sind, können Sie jederzeit online Fahrkarten buchen.\n\nDie Bezahlung erfolgt mit einer persönlichen Kreditkarte.\n\nDer Firmenkundenrabatt in Höhe von 5 % wird bei Buchungen über das Firmenkundenportal automatisch berücksichtigt. Die Buchung von Sparpreisen ist möglich, unter Umständen kann der Firmenkundenrabatt hier nicht berücksichtigt werden. Eine Kombination des Firmenkundenrabattes mit der privaten BahnCard 25 oder 50 ist nicht möglich.\n\n \n\nNach oben\n\nRechtliches/Versicherungsschutz/Formulare\n\nSollte aus dienstlichen Gründen oder aufgrund von Naturkatastrophen eine Reise nicht angetreten werden können, so ist jede/r Bedienstete dazu verpflichtet, sofort Stornierungen z. B. der Fahr- oder Flugscheine und der Übernachtungsmöglichkeit vorzunehmen. Die Bemühungen sind dabei zu dokumentieren. Entstehen dennoch Kosten, so sind diese erstattungsfähig.\n\nKann eine Reise aus privaten Gründen nicht angetreten werden, sind mit Bekanntwerden dieser Gründe Stornierungsmaßnahmen einzuleiten. Etwaige Kosten können erstattet werden, sofern triftige persönliche Gründe die Reise unmöglich machen. Die Entscheidung der Erstattung und Anerkennung der triftigen Gründe obliegt der Universität Kassel als Arbeitgeberin/Dienstherrin.\n\nBei angeordneten und genehmigten Dienstreisen besteht für das Tarifpersonal Unfallschutz nach dem SGB VII - Gesetzliche Unfallversicherung, für Beamte und Beamtinnen nach §§ 30 ff. Beamtenversorgungsgesetz. Dies gilt auch für Dienstreisen zur Fortbildung.\n\nBei Auslandsdienstreisen erfolgt die Erstattung üblicherweise in Höhe der in Deutschland üblichen Sätze. Die evtl. darüber hinausgehenden Kosten oder die Kosten bei einem Unfall, der sich auf der Reise außerhalb des Dienstgeschäftes ereignet hat oder Behandlungskosten, die aufgrund einer Erkrankung entstehen, sollten unbedingt mit einer Auslandsreisekrankenversicherung abgesichert sein, die Sie privat abschließen müssen. Kosten hierfür (zwischen 10 und 20 Euro pro Jahr bei Reisen bis in der Regel bis 45 Tage) können nicht von der Universität Kassel erstattet werden.\n\nVersicherungsschutz für Bedienstete des Landes Hessen bei Dienstfahrten und bei Unfällen des täglichen Lebens innerhalb und außerhalb der beruflichen Tätigkeit (Rahmenvertrag mit der Gothaer Allgemeine).\n\nReisekostenabrechnungen für Nicht-Bedienstete sind in der Finanzabteilung einzureichen.\n\nDie nachfolgend hinterlegten Formulare sind nur noch in begründeten Ausnahmefällen für die Beantragung und Abrechnung von Dienstreisen zu verwenden!\nFormular Reiseantrag:  Reiseantrag\nFormulare für Inlandsdienstreisen: Reisekostenabrechnung\nFormulare für Auslandsdienstreisen:  Reisekostenabrechnung\n\nNach oben\n\nInformationen rund um Exkursionen\n\n  • „Pflichtexkursionen“ sind Studienfahrten, die gemäß Prüfungs- oder Studienordnungen vorgeschriebenen sind. An Pflichtexkursionen dürfen nur Studierende der Universität Kassel teilnehmen, die in einem Studiengang immatrikuliert sind, dem aufgrund der in den Prüfungs- oder Studienordnungen vorgeschriebenen Veranstaltungen die jeweilige Pflichtexkursion zugeordnet ist.\n  • „Studienexkursionen“ sind Studienfahrten, die für die Ausbildung der Studierenden nützlich, jedoch nicht gemäß Prüfungs- oder Studienordnungen vorgeschrieben sind. An Studienexkursionen dürfen nur Studierende der Universität Kassel teilnehmen.\n  • Als Exkursionen gelten auch die von der Abteilung „Studium und Lehre“ im Rahmen der Betreuung ausländischer Studierender von Tutorinnen und Tutoren geleiteten Veranstaltungen.\n\n„Pflichtexkursionen“ dürfen nur unter der Leitung von Mitgliedern oder Angehörigen der Universität Kassel durchgeführt werden.\n\nMitglieder der Hochschule sind gem. § 32 Abs. 1 HHG Professorinnen und Professoren, Studierende, wissenschaftliches, medizinisches, administratives und technisches Personal sowie die Präsidentin/der Präsident.\n\nAngehörige sind gem. § 32 Abs. 6 HHG alle gastweise, nebenberuflich oder ehrenamtlich an der Hochschule Tätigen sowie die zur Promotion oder Habilitation Zugelassenen und die entpflichteten und im Ruhestand befindlichen Professorinnen und Professoren, soweit sie nicht Mitglieder sind.\n\nDie Leitung von Exkursionen obliegt in der Regel Professorinnen und Professoren. Wissenschaftliche und künstlerische Mitarbeiterinnen und Mitarbeiter sowie Lehrkräfte für besondere Aufgaben können Exkursionen leiten, soweit sie die auf die Exkursion bezogene Lehrveranstaltung durchführen.\n\nDie Leitung von Exkursionen durch Gast- und Vertretungsprofessorinnen und -professoren sowie durch Lehrbeauftragte ist nur in begründeten Ausnahmefällen zulässig, soweit sich der Lehrauftrag auf die Durchführung der Exkursion erstreckt. Studierenden darf die Leitung von Exkursionen nicht übertragen werden.\n\nAls Begleitpersonen gelten neben der Exkursionsleitung nur Mitglieder oder Angehörige der Universität, die aus fachlichen und/oder pädagogischen Gründen zur Durchführung der Exkursion benötigt werden. Zur ordnungsgemäßen wissenschaftlichen Betreuung der Studierenden soll die Zahl der Exkursionsleitenden und Begleitpersonen in einem angemessenen Verhältnis zu der Anzahl der Studierenden stehen. Als angemessen anzusehen ist in der Regel eine Begleitperson für jeweils 15 Studierende.\n\nEine Teilnahme von mehr als einer Begleitperson für je 15 Studierende ist nur zulässig, wenn dies aufgrund von besonderen Gründen dringend oder zwingend erforderlich ist. Diese Gründe und deren Dringlichkeit sind bei dem Antrag auf Genehmigung der Exkursion durch die Exkursionsleitung in einer gesonderten Begründung darzulegen.\n\nDie Exkursionsleitung bereitet den Antrag auf Genehmigung einer Exkursion (nach dem Download ausfüllbar) vor und reicht diesen vollständig ausgefüllt mindestens 14 Tage vor Beginn der Exkursion über das Dekanat bei der Abteilung Personal und Organisation ein.\nFür die Exkursionsleitung und ggf. alle weiteren Beschäftigten, die als Exkursionsleitung an der Exkursion teilnehmen, ist zusätzlich ein Reiseantrag im ESS System zu beantragen.\n\nSofern für die Exkursion ein Abschlag gezahlt werden soll, ist dieser im Antrag auf Genehmigung der Exkursion zu beantragen.\n\nWenn bereits vor Durchführung der Exkursion Rechnungen (Anzahlungen/Teilzahlungen sowie Gesamt- oder Schlussrechnungen) von der Universität direkt z. B. an einen Reiseveranstalter, das Hotel oder das Busunternehmen gezahlt werden sollen, sind die Originalrechnungen jeweils mit einer Kopie der Genehmigung sowie der vollständigen Teilnehmerliste der Exkursion direkt bei der Abteilung Finanzen zur Zahlung einzureichen. Die Originalrechnungen sind mit der jeweiligen Kostenstelle/Auftragsnummer zu versehen und durch den Kostenverantwortlichen/die Kostenverantwortliche „sachlich richtig“ zu zeichnen.\n\nStudierende, Tarifbeschäftigte, Exkursionsleiter:innen und Begleitpersonen genießen bei ihrer Teilnahme an Exkursionen den gesetzlichen Unfallversicherungsschutz nach dem Sozialgesetzbuch VII.\n\nBeamten wird im Fall eines Unfalls im Zusammenhang mit Exkursionen Dienstunfallfürsorge nach dem Beamtenversorgungsgesetz gewährt.\n\nFür die Abrechnung von Exkursionskosten stehen zwei Varianten zur Verfügung:\n\n  1. Sollen Rechnungen über Anzahlungen/Teilzahlungen sowie Gesamt- oder Schlussrechnungen von der Universität direkt z. B. an einen Reiseveranstalter, das Hotel oder das Busunternehmen gezahlt werden, müssen diese Rechnungen von der/dem Kostenstellenverantwortlichen sachlich richtig gezeichnet werden und mit der Kostenstelle bzw. dem Auftrag, aus der/dem die Zahlung der Rechnung erfolgen soll, vermerkt sein. In diesem Fall ist jeder Rechnung eine Kopie der Genehmigung und die vollständige Teilnehmerliste der Exkursion beizufügen. Der vollständige Vorgang wird zur Zahlung bei der Abteilung Finanzen eingereicht.\n  2. Hat die Exkursionsleitung selbst Kosten für die Exkursion verauslagt, sind diese spätestens 14 Tage nach Beendigung der Exkursion über das vollständig ausgefüllte Formular Antrag auf Kostenerstattung/Abschlagsabrechnung einer Exkursion zur Erstattung bei der Exkursionssachbearbeitung einzureichen. Dem Abrechnungsformular sind sämtliche Kostenbelege im Original (ggf. mit entsprechenden Zahlungsnachweisen) sowie eine vollständige Teilnehmerliste der Exkursion und das Genehmigungsschreiben beizufügen. Sofern bei der Beantragung der Exkursionsgenehmigung ein Abschlag an die Exkursionsleitung gezahlt wurde, wird dieser im Rahmen der Endabrechnung der verauslagten Kosten verrechnet. Auf die Bestimmungen der Bewirtungskostenrichtlinie der Universität Kassel in der jeweils gültigen Fassung wird hingewiesen. Um eine zügige Abrechnung zu gewährleisten, müssen die Originalbelege in einer übersichtlichen Weise (geheftet bzw. aufgeklebt) und fortlaufend nummeriert der Abrechnung beigefügt werden.\nNach oben\n\nKontakt\n\nSusanne Günther\nTel. +49 561 804-2304\n\nFachbereiche 7, 11, Hochschulbezügestelle, Sprachenzentrum, Uniwerkstätten, Universitätsverwaltung, IT-Servicezentrum\n\nAlexandra Kirstein\n\nTel. +49 561 804-2234\n\nFachbereiche 1, 5, 6, 10, INCHER, SCL, CINSaT, UniKasselTransfer, Universitätsbibliothek, ZLB\n\nAngela Schirmer\nTel. +49 561 804-2146\n\nFachbereiche 02, 14, 15, 16, Kunsthochschule, Institute for Sustainability, CESR\n\nJasmin Skrzypczyk\n\nTel. +49 561 804-3796\n____________________________________________\nAusstellung von generellen Dienstreisegenehmigungen, Genehmigung und Abrechnung von Exkursionen"}, {"id": "P06", "query": "Reisekostenerstattung nach HRKG", "description": "Welche Reisekosten werden nach dem Hessischen Reisekostengesetz erstattet?", "narrative": "Relevant ist § 4 HRKG zur Erstattung von Fahrt-, Flug-, Übernachtungs- und sonstigen Reisekosten.", "title": " Inhaltsverzeichnis HRKG | Landesnorm Hessen | Inhaltsverzeichnis | gültig ab: 01.01.2021", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/jlr-NNLHE0000518BNN00000000002", "text": "Hessisches Reisekostengesetz\n(HRKG)\nVom 9. Oktober 2009 1)\n\nInhaltsübersicht\n§ 1Geltungsbereich\n§ 2Dienstreisen\n§ 3Reisen aus besonderem Anlass\n§ 4Reisekostenerstattung\n§ 5Fahrt- und Flugkostenerstattung\n§ 6Wegstrecken- und Mitnahmeentschädigung\n§ 7Tagegeld\n§ 8Übernachtungsgeld\n§ 9Erstattung der Auslagen bei längerem Aufenthalt am Geschäftsort\n§ 10Kürzung des Tagegeldes nach § 7 und § 9 Abs. 1 Satz 1\n§ 11Erstattung von sonstigen Kosten\n§ 12Bemessung der Reisekostenerstattung in besonderen Fällen\n§ 13Erkrankung während einer Dienstreise\n§ 14Verbindung von Dienstreisen und privaten Reisen\n§ 15Aufwandsentschädigung\n§ 16Pauschalerstattung\n§ 17Auslandsdienstreisen\n§ 18Beamtinnen und Beamte der Gemeinden, Gemeindeverbände und sonstigen Körperschaften, Anstalten und Stiftungen des öffentlichen Rechts\n§ 19Trennungsgeld\n§ 20Zuständigkeitsregelungen\n§ 21Übergangsvorschriften\n§ 22Ermächtigungen\n§ 23Inkrafttreten\n\nWeitere Fassungen dieser Norm ausblendenWeitere Fassungen dieser Norm\n\nInhaltsverzeichnis HRKG, vom 09.10.2009, gültig ab 01.01.2010 bis 31.12.2020\n\nFußnoten ausblendenFußnoten\n\n1)\nVerkündet als Artikel 1 des Gesetzes zur Reform des hessischen Reisekostenrechts und zur Verlängerung der Geltungsdauer des Hessischen Personalvertretungsgesetzes vom 9. Oktober 2009 (GVBl. I S. 397)"}, {"id": "P07", "query": "Privat verauslagte Kosten abrechnen", "description": "Wie werden privat verauslagte dienstliche Kosten abgerechnet?", "narrative": "Relevant sind Informationen zur digitalen Abrechnung privat verauslagter Kosten.", "title": "Informationen für Lehrende - HOCHSCHULVERWALTUNG", "url": "https://www.uni-kassel.de/hochschulverwaltung/themen/arbeitsplatz-und-personal/informationen-fuer-lehrende", "text": "Informationen für Lehrende\n\nLehrauftrag\n\nSchritt für Schritt bis zum Vertragsabschluss\n\nLehrauftrag: Mehr Infos\n\nBeauftragsverfahren für Vertretungs- und Gastprofessor:innen sowie Gastdozent:innen /-wissenschaftler:innen\n\nUm den Fachbereichen frühzeitig die für die Semestervorbereitungen erforderliche Planungssicherheit geben zu können, wird für jedes Sommersemester und jedes Wintersemester eine entsprechende Semesterplanung für Vertretungs- und Gastprofessor:innen erstellt und im Präsidium mit entsprechenden zeitlichen Vorlauf abschließend beraten.\n\nDie Anträge der Fachbereiche sind jeweils bis zum 10.05 eines Jahres für das Wintersemester und bis zum 10.11 eines Jahres für das Sommersemester an die Präsidentin zu stellen. Dem Antrag ist eine Begründung beizufügen, aus der ersichtlich wird, ob es sich bei der Beantragung um eine Vertretungs- oder Gastprofessur handelt.\n\nBei einem Antrag zur Vergabe einer Vertretungsprofessur muss beachtet werden, dass die freien – nicht vertretenen – Professor:innenstellen eines Fachbereichs bei der Vergabe der Lehrauftragsmittel Berücksichtigung finden. Hierbei wird ein Betrag von 7.500 € jährlich (pro Semester 3.750 €) je freie Professor:innenstelle zugewiesen.\n\nVertretungsprofessuren dienen zur Wahrnehmung einer vakanten Professor:innenstelle in Forschung, Lehre, Studienberatung und Prüfung. Von einer Vertretungsprofessur kann Gebrauch gemacht werden, wenn die Aufgaben vom vorhandenen Personal oder durch Lehraufträge nicht erfüllt werden können.\n\nDie mit einer Vertretungsprofessur Beauftragten müssen die Einstellungsvoraussetzungen nach § 62 des Hessischen Hochschulgesetzes erfüllen.\n\nDie Beauftragung für die Vertreter:innen einer Professur kann für maximal 4 Semester ausgesprochen werden. Die Beauftragung erfolgt in der Regel für die Vorlesungszeit eines Semesters.\n\nDie übernommene Lehrverpflichtung entspricht der einer Professorin/eines Professors gemäß der jeweils geltenden Lehrverpflichtungsverordnung an Hochschulen des Landes.\n\nDie Gastprofessuren dienen zur Ergänzung des Lehrangebotes. Die Beauftragten müssen die Einstellungsvoraussetzungen nach § 62 des Hessischen Hochschulgesetzes erfüllen. Die Beauftragung erfolgt in der Regel für die Vorlesungszeit eines Semesters.\n\nDie übernommene Lehrverpflichtung entspricht der einer Professorin/des eines Professors gemäß der jeweils geltenden Lehrverpflichtungsverordnung an Hochschulen des Landes.\n\nDas Präsidium stellt für ausländische Gastdozent:innen/-wissenschaftler:innen finanzielle Mittel bereit. Anträge sind an die Abteilung für Entwicklungsplanung, Referat für Internationalisierung und Internationale Kooperationen zu stellen. Nach dortiger Prüfung werden die benannten Personen angeschrieben und an die Universität Kassel eingeladen. Voraussetzung ist eine Einbindung der Gastdozent:innen/-wissenschaftler:innen in die Lehre mit einem Umfang von mindestens 6 Semesterwochenstunden für die Dauer des Aufenthaltes. \n\nAnträge an das ICDD\nAnträge für Gastprofessuren, die zu Lehr- und Forschungsaufenthalten im International Center for Development and Decent Work (ICDD) mit einer Förderung durch den Deutschen Akademischen Austauschdienst (DAAD) an die Universität Kassel eingeladen werden sollen, sind an das ICDD zu richten. Nach entsprechender Prüfung werden die benannten Personen eingeladen. Hierbei ist im Vorfeld zu beachten, dass eine Arbeitsaufnahme an der Universität Kassel erst mit Erteilung eines entsprechenden Visums mit einer Arbeitsgenehmigung als Gastwissenschaftler:in erfolgen kann. Die Visaerteilung ist zwingend vor Einreise nach Deutschland mit einer deutschen Auslandsvertretung abzuklären.\n\nDie Abrechnung von „Gastvorträgen“ darf ausschließlich für Vorträge/Workshops und ähnliche Veranstaltungen von nicht der Universität Kassel angehörenden Wissenschaftler:innen sowie Gastdozent:innen durchgeführt werden.\n\nBeschäftigte der Universität Kassel dürfen keine Honorare für „Gastvorträge“ an der eigenen Universität abrechnen. Zusätzlich zur Lehrverpflichtung oder dem bestehenden Arbeitsvertrag erbrachte Leistungen einer/eines Beschäftigten der Universität Kassel können allenfalls als vorher beantragte und genehmigte Überstunden bzw. Mehrarbeit über das Entgeltkonto der/des Bediensteten ausgezahlt werden.\n\nFür die Erstattung von Ausgaben \"universitätsfremder\" Personen muss das folgende Formular ausgefüllt werden.\n\n  1. Das Honorar sollte die Gesamtsumme aller anfallenden Kosten beinhalten (keine einzelnen Belege). Bei Kosten über 300,00 € müssen alle Originalbelege angefügt werden.\n  2. Das Formular wird von der kostenstellenbevollmächtigten Stelle (Fachgebietsleitung oder Dekanat) unterschrieben. Senden Sie das Formular vorzugsweise direkt an rechnung[at]uni-kassel[dot]de\n    Wenn das Formular digital an EVER übermittelt wird, ist keine Unterschrift notwendig. In Ausnahmefällen können Sie die Unterlagen per Hauspost an die Personalabteilung senden. Bitte beachten: pro Email nur eine PDF-Rechnung, die als solche benannt werden muss, andere Formate sind unzulässig. \n    Weitere Infos https://www.uni-kassel.de/hochschulverwaltung/files/Themen/Finanzen/EVER/Info_Kreditoren.pdf\n  3. Die Kostenerstattung geht über eine Kostenstelle (Landesmittel) oder über eine Auftragsnummer (Drittmittel). Sollte die Finanzierung aus Drittmitteln erfolgen, muss dies vorher mit der Drittmittelgebenden Stelle abgeklärt werden, ggf. muss ein Einladungsschreiben von der Universität Kassel vorliegen.\n\nSollte der Fall eintreten, dass das Fachgebiet für den Gast ein Hotelzimmer reserviert hat, dann gibt es 2 Möglichkeiten:\n\n  1. Der Gast geht in Vorkasse (zahlt die Hotelrechnung) und reicht die Originalrechnung samt Quittung beim Fachgebiet ein. Dort muss ein Erstattungsformular ausgefüllt werden, unterschrieben von der Kostenstellenleitung.\n  2. Das Hotel sendet die Rechnung direkt an das Fachgebiet. Dann muss die Rechnung mit Kostenstelle und sachlich richtig Unterschrift der Kostenstellenleitung zusammen mit dem Gastvortragsformular an die Abteilung Personal und Organisation weitergeleitet werden.\n\nAbrechnung von Lehre und Forschung\n\nIn­­­for­­ma­­ti­o­­nen für Pro­­­fes­­su­­ren und Ju­­ni­or­­pro­­fes­­su­­ren\n\nInterne Dokumente (nur mit Uni-Account abrufbar)\n\nAnsprechpersonen in der Abteilung Personal und Organisation\n\nDienstliche oder personelle Angelegenheiten der Professor:innen\n\nBitte wenden Sie sich bei Fragen an Ihre zuständige Sachbearbeitung. Hierzu nutzen Sie bitte die Kontaktadresse aus dem Schriftverkehr.\n\nVertretungs- und Gastprofessuren\n\nDennis Reinold\nTel.: +49 561 804-1965\n\nLehraufträge\nFB 1, 2, 5, 6, 7, 14, 15, 16, Allg. Hochschulsport, Int. Studienzentrum, RSS, SCL, ZfL, Abt. II, UKT\n\nMelani Brnabic-Schäfer\nTel.: +49 561 804-7460\n\nDominika Musick\nTel.: +49 561 804-7054\n\nLehraufträge\nFB 10, FB 11, KHS\nGastvorträge\n\nSarah Khod\nTel.: +49 561 804-2183"}, {"id": "P08", "query": "Single-source procurement justification", "description": "How must a purchase from the only suitable supplier be justified?", "narrative": "Relevant documents explain the written justification required when only one supplier can provide a service.", "title": "UniKasselClient (IT workstation environment) - ITS - Uni Kassel", "url": "https://www.uni-kassel.de/its/en/it-dienste-software/unikasselclient-it-arbeitsplatzumgebung.html", "text": "UniKasselClient (IT workstation environment)\n\nOverview\n\nDirectly to:\n\n1. basic information\n\nField of application\n\nUni Kassel Clients (UKCs) are Windows devices that are procured and managed centrally by the IT Service Center. This hardware receives automated software and security updates and is operated in separate network areas.\n\nWho is it suitable for?\n\nThe UKC is suitable for:\n\n  • University institutions that want to operate their IT workstations in a standardized way and without administrative effort\n  • Employees with workstations in the university environment\n\nResponsibility\n\nThe IT Service Center is responsible for the operation, further development and support of the UniKasselClient.\n\nProcurement\n\nThe \"Request for procurement\" form (to be found above) is sent by e-mail chain to < it-beschaffung[at]uni-kassel[dot]de > via the superior or person responsible for the cost center.\nBilling takes place directly via the specified cost center.\n\n2. brief description\n\nDescription\n\nWith the Uni Kassel Clients (UKCs), devices can be managed centrally, automated software and security updates can be received and an extensive software portfolio can be used. The devices provide an efficient working environment and contribute to data security.\n\nAlternatives\n\nFor institutions with their own IT solutions or special requirements, individual client operation can take place without UKC. However, this requires significantly more personal responsibility for maintenance, security and support.\n\n3. main functions\n\nFunctions\n\n  • Procurement of hardware and peripherals\n    The procurement of UKC workstations is carried out by the IT Service Center. Further information can be found under Procurement of end devices.\n  • Central software distribution\n    Programs and updates are automatically distributed to all UKC systems.\n  • Standardized Windows operating system\n    The UKC contains a preconfigured Windows image with relevant security settings.\n  • Integrated update and patch management\n    Security updates and new versions are installed regularly and in a controlled manner.\n  • Support from the IT Service Center\n    UKC systems are actively supported by the IT Service Center, including error analysis and rectification.\n  • User administration via Active Directory\n    Access control and authorizations are managed via the central system.\n\n4th deployment scenario\n\nPractical examples\n\n  • An administrative unit wants to set up new workstations. By installing the UKC, all systems are equipped with identical software and configuration - without any manual effort.\n  • An existing device requires new specialist software. This can be centrally assigned and automatically installed via the UKC.\n\n5. technical requirements\n\nPrerequisites\n\n  • Standard PC hardware (Windows-compatible)\n  • Network connection to the university network via LAN or VPN connection\n  • Devices must be integrated into the Active Directory\n\n6. use and access\n\nAccount and login\n\nAccess is via the UniAccount.\n\n7. support and contact\n\nContact and support times\n\nName, ForenameContact\nUniKasselClient (UKC)\nHardware procurement\n\nEmail \n\nSubmit ticket if support is required (recommended):\n\nOpening hours IT service desk\n\nMon & Thu 8 a.m. - 4 p.m., Tue & Wed 8 a.m. - 3 p.m., Fri 8 a.m. - 1 p.m.\n\nITS chatbot\n\nAlternatively, you can use our ITS chatbot to get support with questions or problems relating to our IT services.\n\nAccess is only possible from the university network or via a VPN connection.\n\nITS chatbot: Forward\n\n8. instructions and further links\n\nDocumentation/Tutorial\n\nTraining\n\nNo training courses are currently offered.\n\n9. special notes (data protection, terms of use)\n\nData protection and security\n\nAll UKC systems receive regular security updates. The configuration follows the university's information security recommendations. Access is via authenticated accounts in the Active Directory.\n\nLegal notices and license information\n\nAll software components used are subject to the University's license conditions. The use of the UKC is intended exclusively for official purposes within the university.\n\nStatus: March 2025\n\nGo-Link of this page: https://www.uni-kassel.de/go/ukc"}, {"id": "P09", "query": "Fire safety regulations", "description": "How should I behave in case of fire on campus?", "narrative": "Relevant documents contain fire safety rules and evacuation instructions.", "title": "Security and Safety on Campus - HOCHSCHULVERWALTUNG", "url": "https://www.uni-kassel.de/hochschulverwaltung/en/topics/construction-and-facilities-management/security-and-safety-on-campus.html", "text": "Security and Safety on Campus\n\nEmergency numbers\n\nPlease save the following important emergency numbers on your mobile phone:\n\nEmergencies on campus:\n+49 561 804-2222\n\nCampus security\n+49 561 804-2040\n\nFor all other types of matters (Service Desk):\n+49 561 804-7777\n\nHouse law and criminal matters\n+49 561 804-3242\n\nService Desk ITS\n+49 561 804-5678\n\nThe University of Kassel takes precautions to ensure a safe and secure campus environment for all students, faculty and staff.\n\nHowever, the university is open to the public and strangers can easily enter the campus – as anywhere in the world, people can become a victim of a criminal offence. In order for students and staff to feel safe and secure on campus, we have gathered the following information regarding campus security.\n\nOverview\n\nProtection against sexualized discrimination and violence\n\nSe­cur­ity staff mem­bers\n\nSe­cur­ity staff mem­bers\n\nOur staff and the staff members of our external security provider work as hard as they can to make the campuses of the University of Kassel as safe as possible. Internal and external security personnel are in charge of campus security 24 hours a day, 7 days a week, 365 days a year, in order to improve security on campus by conducting foot and vehicle patrols or simply by maintaining a presence.\n\nIn the event of an emergency, the security guards are available 24/7 at 2222 (on-campus emergency number).\n\nPlease also contact the security staff members if you feel uncomfortable in a potentially dangerous situation that negatively affects your personal feeling of safety. If you feel unsafe at any time on campus, especially after dark or in the winter months, also dial the above mentioned number to get an escort to another location on campus or be walked to your car.\n\nPlease dial 7777 or write a ticket to the Service Desk to report any unsafe conditions, defective lamps or missing streetlamps in dark areas or if you have any security-related questions or improvements to propose.\n\nIf you have any questions regarding general security on university premises, the security options for office equipment, security issues in connection with events, after key losses or detected break-ins and thefts, please contact the Infrastructural Facility Management department.\n\nOwn safety precautions\n\nWhich safety precautions should I take?\n\nPlease avoid walking alone on campus after dark and try to always walk with at least one other person or in groups. Avoid secluded and dimly-lit areas and stay on well-lit, regular traveled walks and pathways. Stay away from shrubbery, bushes and dark alleyways. If you have no one to walk with, call the security guard at 7777 or 2040 to escort you to your vehicle, for example.\n\nAlways lock your office door when you leave, even if it is for a short time.\n\nSecure valuables in a locked compartment.\n\nAddress strangers (for example in the hallways) politely and ask if you can help them (“Entschuldigung, kann ich Ihnen helfen?”)\n\nNever leave the doors to the hallways or the connecting doors open.\n\nIf your office is on the ground floor, please take appropriate measures to keep people from looking into your office (use curtains or blinds).\n\nPlease get acquainted with the university’s safety and security regulations (fire safety regulations, emergency phone locations on campus, etc.)\n\nTo top\n\nAlarming situations\n\nWhat to do if I witness a criminal offence or any sort of alarming situation?\nIf you feel threatened, witness a dangerous or alarming incident or if you find yourself in a violent or potentially risky situation on campus, contact the campus security personnel at 2222. Security guards are available 24 hours a day, 7 days per week.\n\nOf course, you can also dial the emergency number 110 to directly contact the police. In this case, please also inform the security guards’ office at 2222 about the incident afterwards.\n\nThe emergency phones that are mounted on green poles are also located throughout the central campus at Holländischer Platz. Please don’t hesitate to use them!\n\nIn case of theft-related offences, criminal damage to university property or damage to your personal property, please directly contact the Info Point or the office of campus security at Holländischer Platz (phone: 2040).\n\nTo top\n\nEmergency phones\n\nCampusplan / Emergency phones\ncampus at Holländischer Platz / Emergency phones\n\nEmergency phones are located on the central campus at Holländischer Platz and directly connect to campus security staff in case of an emergency. When the emergency button is pushed, the emergency poles blink, which draws more attention on the potential high-risk area. Please click on the link below to see a map of the campus at Holländischer Platz with its seven emergency phones. The red circles indicate our emergency phones, while the blue circles indicate the location of telephones boxes.\n\nDescription of the exact emergency phone locations\n\n  • One emergency pole is located at the end of Georg-Forster-Straße, on the left-hand side in front of the main entrance to the underground garage.\n  • One emergency pole is located between Gießhaus/Faculty 15, Mönchebergstraße 3 (Institute of Materials Engineering) and Faculty 14, Mönchebergstraße 7 (at the back) and the rear entrance of Gießhaus (caretaking services).\n  • Another emergency pole is located at the back of the library (cobbled path) close to the rear entrance of the underground garage und the ramp to the library.\n  • On the opposite side an emergency pole is located at the back of the building in Kurt-Wolters-Straße 3 close to (on the opposite side of) the labs and the truck access route.\n  • A further emergency pole is located in Nora-Platiel-Straße 5 (passage to Arnold Bode-Straße, Faculty of Social Sciences).\n  • One emergency is located in the backyard in Nora-Platiel-Straße 1 (near the passage to Henschelstraße).\nTo top\n\nCase of theft-related offences\n\nIn case of theft-related offences, criminal damage to university property or damage to your personal property, please contact the Infratechnical Services Department (IGM).\n\nPlease use the Form \"Diebstahlmeldung\" incase of theft-related offences.\n\nOutside of office hours please dial 7777 or write a ticket to the Service Desk. In the event of an emergency on campus, contact the campus security personnel at 2222.\n\nIn case of an emergency or if you witness a dangerous or alarming situation, dial the emergency number 110.\n\nInfratechnical Services Department\n\nMichaela Bierkandt\n\nPhone +49 561 804-3242\nFax +49 561 804-3333\n\nInfratechnical Services Department\n\nFrank Oschkinis\n\nPhone +49 561 804-2266\nFax +49 561 804-3333\n\nTheft-related offences\n\nCampus security (Infopoint at campus Holländischer Platz)\n\nHenschelstraße 2 / Infopoint\nPhone 49561804-2040\nEmergeny call +49 561 804-2222\n\nTo top\n\nGo-Link: www.uni-kassel.de/go/sicherheit"}, {"id": "P10", "query": "Local transport at destination", "description": "Are local bus and metro tickets at the destination reimbursed on a business trip?", "narrative": "Relevant documents describe reimbursement of local transport costs during business trips.", "title": "Erasmus+ personal mobility for teaching purposes (STA) - UNI", "url": "https://www.uni-kassel.de/uni/en/international/going-abroad/research-and-teaching-abroad/erasmus-personal-mobility-for-teaching-purposes-sta", "text": "Erasmus+ personal mobility for teaching purposes (STA)\n\nErasmus+ enables employees at the University of Kassel to spend time teaching at European partner universities. The University of Kassel has bilateral agreements with a number of European partner universities as part of the personal mobility for teaching purposes scheme.\n\nYou also have the opportunity to complete a period of teaching abroad at a selected international partner university as part of the Erasmus+ worldwide scheme.\n\nYou can find general information about the Erasmus+ programme here.\n\n  • Ongoing professional and personal development for lecturers\n  • To promote cooperation between the University of Kassel and its European partner universities \n  • Offering students, who cannot take part in any mobility programme, the opportunity to continue their international studies through the expert knowledge of lecturers from European partner universities (\"internationalisation at home\")\n  • Enhancing the content of the teaching materials and the specialist exchange and strengthening the cooperation with international colleagues\n  • Developing joint study programmes and exchanging teaching materials and methods\n\nPeople eligible for funding\n\n  • Professors and lecturers with a contractual relationship with the University of Kassel\n  • Part-time teaching staff with service contracts\n  • Emeritus professors and retired teaching staff\n  • Research assistants\n  • Personnel from foreign companies and organisations (can be invited to German universities for teaching purposes)\n\nLength of time and scope of teaching\n\n  • The teaching periods must involve at least 8 teaching hours per week or stay or 4 hours + 4 hours curriculum development\n  • The minimum duration is 2 days\n  • and the maximum possible period for financial support is 5 working days.\n  • Exceptions are possible and should be discussed with the Erasmus coordinator.\n\nAgreement with the host institution\n\n  • Bilateral agreement with the host institution which involves an agreement covering the planned teaching period is obligatory.\n  • Bilateral agreements may be concluded at short notice. Please contact the Erasmus coordinator at the International Office regarding this.\n\nReceiving funding more than once\n\n  • It is possible to receive funding more than once.\n\nThe calculations for your financial compensation do not take place according to the Hesse Travel Expenses Act, but using the EU’s allowances, which are dictated by the different costs of living in the destination countries.\n\nThe following set daily rates apply to four country groups.\n\nFunding is only available for days when activities have taken place that are related to your mobility scheme. The definitive evidence is provided by a certificate issued by the host institution/company at the end of your stay with the starting and finishing dates, including the number of classes taught. \n\nTravel expenses can be added to these daily rates, depending on the actual distance between your starting and finishing point; they can be determined in a standard fashion across Europe using a calculation tool.\n\nThe following amounts are repaid, depending on your stay and the distance involved:\n\nDistance for a single journey according to the distance calculatorAmount (average costs) per person involved\n(= return trip)\t\tGreen Travel*\n10 - 99 KMEUR 28EUR 56\n100 - 499 KM  EUR 211EUR 285\n500 - 1.999 KM  EUR 309EUR 417\n2.000 - 2.999 KM  EUR 395EUR 535\n3.000 - 3.999 KM  EUR 580EUR 785\n4.000 - 7.999 KM  EUR 1.188EUR 1.188\n8.000 KM und mehr  EUR 1.735EUR 1.735\n\n \n\n \n\n \n\n \n\n \n\n \n\n*Green travel: \"Green travel\" or \"environmentally friendly travel\" refers to travel \"where low-emission means of transport are used for the majority of the journey, such as bus, train, bicycle or carpooling\". Participants to whom this applies will receive the higher travel allowance (see table above) and possibly up to 4 additional travel days (depending on the distance to the host institution). If you travel \"green\", you can indicate this in the online application and declare it on your honor (proof of travel does not have to be submitted but must be kept and submitted in the event of a random sample).\n\n \n\nInterrail Pass\nErasmus scholarship holders have the opportunity to purchase a discounted Interrail Pass. This is valid for 6 months and can be used for the outward and return journey, as well as trips in the host country and neighboring countries. Information and tickets are available here.\n\nThere are the following 2 variants:\n\nFour-day pass\n. Adult (28+) Pass 1st class - 321 euros\n. Adult (28+) Pass 2nd class - 265 euros\n\nSix-day pass\n. Adult (28+) Pass 1st class - 455 euros\n. Adult (28+) Pass 2nd class - 376 euros\n\n \n\nReal cost applications for additional financial support for employees with fewer opportunities\n\nUniversity employees who are planning to go abroad with a child/children, or do have a degree of disability of at least 20 or a chronic illness (resulting in additional financial needs abroad) can apply for additional financial support (confirmation of funding under the Erasmus program must be given).\n\nIn addition, if you have already been selected for mobility, you have the option of applying for and undertaking a preparatory trip in advance in order to familiarize yourself with the local conditions.\n\nPlease note that applications must be submitted at least 2 months before the start of your stay. Therefore, please contact us as early as possible!#\n \n\nExceptional costs for expensive travel\nIf the travel allowance according to the distance category does not cover at least 70% of the actual travel costs, participants can be reimbursed for 80% of the actual costs of their travel.\n\nThe application must be justified by the applicant and approved by the national agency.\n\nApplication and selection procedure\n\nStep 1: Establishing contact with the host institution\nEach participant must make contact with the host institution of their choice on their own initiative and discuss the planned visit. Registration for any funding through Erasmus+ can only take place after written acceptance has been received from the institution receiving you. You may enquire about the availability of funds at the International Office at the University of Kassel before making contact with the host institution.\n\nStep 2: Registering \nCompleting the online application form.\n\nStep 3: The International Offices contacts you\nThe participant will receive a binding response from the International Office by e-mail. This e-mail also contains all the necessary documents and information about the ongoing procedure.\n\nStep 4: Submitting the necessary documents \nThree documents have to be submitted prior to any period of mobility: the grant agreement, learning agreement and an application to make a business trip.\n\nImportant: All employees and civil servants, according to current case law, require an A1 / E101 certificate as soon as they operate on a cross-border basis within the EU, the EEA, Switzerland or in one of the countries with which a bilateral agreement has been established. More information can be found here. Questions are answered by the Human Resources Department (Abteilung Personal und Organisation).\n\nStep 5: Disbursement of the financial subsidies\nAs soon as all the documents have been received, the financial subsidy is transferred to the account of the person receiving the funding in a lump sum.\n\nConfirmation of the length of time spent abroad\nEach person receiving funding must have the length of time spent abroad confirmed by a so-called letter of confirmation; this is completed by the host institution.\n\nWriting a report\nFinally, each person receiving funding will receive an e-mail from the European Commission with a request to complete a questionnaire (EU survey).\n\nAccounts for travel on official university business \nNo claim for travel expenses has to be handed in.\n\nFor further information and questions, please contact:\n\nCharlotte Schaetzky  -  Your contact for staff mobility for teaching purposes (STA)"}, {"id": "P11", "query": "Documents for Erasmus staff mobility", "description": "Which documents are required for funded staff mobility abroad?", "narrative": "Relevant documents list the business trip and funding documents required for Erasmus staff mobility.", "title": "Claudia Jacobi (Front Office for Historical Musicology) - FB01 - Uni Kassel", "url": "https://www.uni-kassel.de/fb01/en/departments/department-of-music/sections/historical-musicology/front-office.html", "text": "Claudia Jacobi\n\nFront Office for Historical Musicology\n\nImage: Sonja Rode/Lichtfang.net\nJacobi, Claudia\nTelephone\n+49 561 804-4146\nEmail\nLocation\nUniversity of Kassel | Department of Music\nMönchebergstraße 1\nD-34125 Kassel\n\nThe front office of Historical Musicology is your point of contact for all organisational and administrative questions relating to teaching and research in our division.\n\nTo arrange an appointment, please use the contact details provided for our team, including a few key points about your request so that your enquiry can be dealt with efficiently.\n\nImage: Adobe Stock\n\nReport on Intensive Language Study in Valencia | Erasmus+ Staff Mobility\n\nIn October 2025, Claudia Jacobi – office manager at the Division of Historical Musicology – completed a one-week intensive language program in Valencia, Spain. Her further training was funded as part of the Erasmus+ Staff Mobility Program, and the University's International Office provided practical support in organising her stay abroad.\n\nIn an informative report, Claudia Jacobi reflects upon her experience in Valencia and provides practical insights for all employees of the University of Kassel who are likewise interested in such international experiences and further training opportunities.\n\nReport on Intensive Language Study in Valencia | Erasmus+ Staff Mobility: Read on\nImage: iStock\n\nAnnouncement for the Summer of 2026\n\nProf. Dr. Carolin Krahn will be on sabbatical during the summer semester of 2026. The departmental office will remain open as usual during this time.\n\nDr. Emilia Pelliccia will offer various courses in Historical Musicology during the summer term. She is also the contact person for mobility programs at the Department of Music and regularly hosts the digital information event \"Move it! Consultation Hours for International Students\" on studying, internships and research stays abroad.\n\nStudents should please note that there will be no consultation hours with the department chair in April and May 2026. In urgent matters during the summer semester, please first reach out to Claudia Jacobi by email with a brief description of your concern. You will receive a reply at our earliest convenience."}, {"id": "P12", "query": "BahnCard Erstattung Beamte Hessen", "description": "Werden die Kosten einer BahnCard für häufige Dienstreisen erstattet?", "narrative": "Relevant sind Vorschriften zur Erstattung von Fahrpreisermäßigungen.", "title": " Inhaltsverzeichnis HRKG | Landesnorm Hessen | Inhaltsverzeichnis | gültig ab: 01.01.2021", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/jlr-NNLHE0000518BNN00000000002", "text": "Hessisches Reisekostengesetz\n(HRKG)\nVom 9. Oktober 2009 1)\n\nInhaltsübersicht\n§ 1Geltungsbereich\n§ 2Dienstreisen\n§ 3Reisen aus besonderem Anlass\n§ 4Reisekostenerstattung\n§ 5Fahrt- und Flugkostenerstattung\n§ 6Wegstrecken- und Mitnahmeentschädigung\n§ 7Tagegeld\n§ 8Übernachtungsgeld\n§ 9Erstattung der Auslagen bei längerem Aufenthalt am Geschäftsort\n§ 10Kürzung des Tagegeldes nach § 7 und § 9 Abs. 1 Satz 1\n§ 11Erstattung von sonstigen Kosten\n§ 12Bemessung der Reisekostenerstattung in besonderen Fällen\n§ 13Erkrankung während einer Dienstreise\n§ 14Verbindung von Dienstreisen und privaten Reisen\n§ 15Aufwandsentschädigung\n§ 16Pauschalerstattung\n§ 17Auslandsdienstreisen\n§ 18Beamtinnen und Beamte der Gemeinden, Gemeindeverbände und sonstigen Körperschaften, Anstalten und Stiftungen des öffentlichen Rechts\n§ 19Trennungsgeld\n§ 20Zuständigkeitsregelungen\n§ 21Übergangsvorschriften\n§ 22Ermächtigungen\n§ 23Inkrafttreten\n\nWeitere Fassungen dieser Norm ausblendenWeitere Fassungen dieser Norm\n\nInhaltsverzeichnis HRKG, vom 09.10.2009, gültig ab 01.01.2010 bis 31.12.2020\n\nFußnoten ausblendenFußnoten\n\n1)\nVerkündet als Artikel 1 des Gesetzes zur Reform des hessischen Reisekostenrechts und zur Verlängerung der Geltungsdauer des Hessischen Personalvertretungsgesetzes vom 9. Oktober 2009 (GVBl. I S. 397)"}, {"id": "P13", "query": "Mit dem eigenen Auto zur Tagung", "description": "Ich möchte mit meinem privaten Auto zu einer Tagung fahren. Was bekomme ich pro Kilometer?", "narrative": "Relevant sind Regelungen zur Entschädigung für die Nutzung privater Fahrzeuge.", "title": "Kontakt/Anfahrt - MASCHINENBAU - Uni Kassel", "url": "https://www.uni-kassel.de/maschinenbau/institute/analyse-und-regelung-technischer-systeme/mess-und-regelungstechnik/kontakt/anfahrt.html", "text": "Kontakt/Anfahrt\n\nSekretariat\n\nRaum 1515a\nGebäude Ingenieurswissenschaften III\nMönchebergstr. 7\n34125 Kassel\n\nfon:\n\n+49 561 804 2758\n\nE-Mail:\n\noffice (at) mrt.uni-kassel.de\n\n \n\n \n\nBürozeiten\n\nMontag9:00 - 12:00 Uhr\nMittwoch9:00 - 12:00 Uhr\nDonnerstag9:00 - 12:00 Uhr\n\n \n\nAnschrift\n\nUniversität Kassel\nFachbereich 15 - Maschinenbau\nFachgebiet Mess- und Regelungstechnik\nMönchebergstr. 7\n\n34109 Kassel\n\nUniversität Kassel\nFachgebiet Mess- und Regelungstechnik\nRaum 1515a\nMönchebergstr. 7\n\n34125 Kassel\n\nAnfahrt\n\nBitte geben Sie in Ihr Navigationsgerät die Adresse \"Mönchebergstraße 10\" ein, da sie sonst zum falschen Eingang am blauen Tor gelotst werden.\n\nAn der Autobahn­ausfahrt Kassel-Nord verlassen Sie die Au­tobahn A7. Orien­tieren Sie sich bitte auf dem Auto­bahnzubringer Richtung Kassel-Stadtmitte (ca. 2 km, Über­querung von zwei beampelten Kreuzun­gen). Sie erreichen eine große Kreuzung, an der sich eine BMW-Nieder­lassung befindet. Hier bie­gen Sie vor der Kreuzung rechts in die Scharnhorststr. ein. Sie passieren eine Ampel und fahren auf einer Brücke über die Fulda. Unmittelbar nach der Brücke biegen Sie links ab. Benutzen Sie bitte dabei die rechte Fahrspur. Nach etwa 500 m er­reichen Sie die Weserstraße – er­kennbar an den Straßenbahn­schie­nen – die sie überqueren. Nach etwa 100 m bie­gen Sie in die erste Straße rechts (Mönchebergstr.) ein. Bitte lassen Sie sich nicht von dem Verbotsschild irritieren, es gilt erst nach dem Gebäude Nr. 7. Gebühren­pflichtige Parkplätze gibt es in der Mönchebergstraße und vor der Enterprise-Autovermietung. Die Adresse \"Mönchbergstraße 10\" ist eine Kirche auf der rechten Straßenseite, die sich direkt gegenüber von Eingang 7 in in unser Gebäude befindet.\n\nDas Büro von Herrn Prof. Kroll (R. 1515) befindet sich auf der linken Seite des Flurs, ca. 25 m vom Eingang Mönchebergstr. Nr. 7 entfernt. \n\nAnkunft Kassel-Wilhemshöhe (neuer ICE-Bahnhof)\n\nWenn Sie in Kassel-Wilhelmshöhe aussteigen, finden Sie vor dem Bahnhofsgebäude einen Taxistand und eine Straßenbahnhaltestelle.\n\nWenn Sie sich für die Straßenbahn entscheiden, haben Sie an der Haltestelle Bahnhof-Wilhelmshöhe mehrere Möglichkeiten ohne Umsteigen direkt zu uns zu fahren:\n\n  • Linie 1: Richtung \"Holländische Straße\" bis \"Holländischer Platz/Universität\" (Fahrzeit ca. 17 min)\n  • Linie 3 oder 7: Richtung \"Ihringshäuser Straße\" bis \"Katzensprung/Universität\" (Fahrzeit ca. 18 - 21 min)\n\nAnkunft Kassel-Hauptbahnhof (Kulturbahnhof)\n\nWenn Sie am Hauptbahnhof aussteigen, empfehlen wir, mit dem Taxi zu uns zu kommen.\n\nWenn Sie lieber mit der Straßenbahn fahren wollen, finden Sie vor dem Bahnhof den Zugang zu einer unterirdischen Straßenbahnhaltestelle.\n\n  • Linie 7: Richtung \"Ihringshäuser Straße\" bis \"Katzensprung\" (Fahrzeit ca. 7 min)\n\nFahrplanauskunft der Deutsche Bahn AG\n\nFahrplanauskunft des Nordhessische VerkehrsVerbunds\n\nDie nächstgelegenen Flughäfen sind: Kassel-CaldenFrankfurtHannover und Paderborn. Von Kassel-Calden aus gelangen Sie mit dem Taxi oder der Buslinie 130 in die Kasseler Innenstadt. Den genauen Fahrplan erhalten Sie auf der Webseite der Kasseler Verkehrsgesellschaft. Von Frankfurt, Hannover und Paderborn aus bestehen Zugverbindungen nach Kassel-Wilhelmshöhe.\n\nWenn Sie das Gebäude durch den Eingang Nr. 7 betreten haben, befinden Sie sich in der 1. Etage.\n\nGehen Sie ca. 25 m den Gang geradeaus weiter. Sie finden hier unser Sekretariat auf der linken Seite (Raum 1515a).\n\nIn jedem Treppenhaus befindet sich neben dem Fahrstuhl ein Raumplan.\n\nGebäude Ingenieurswissenschaften III\n\nMönchebergstr. 7\n\nDas Fachgebiet Mess- und Regelungstechnik befindet sich im Gebäude Ingenieurswissenschaften III am Standort Holländischer Platz (HoPla) der Universität Kassel, in der Mönchebergstraße 7 (Mö7).\n\nDas Gebäude ist mit grau-beigen Platten verkleidet und fällt durch seine orangefarbenen Fenster auf. Rechts ca. 50m vom Eingang Nr. 7 befindet sich am Ende des Gebäudes ein großer blauer Torbogen.\n\nAnreisebeschreibung als PDF-Dokument\n\n \n\nKoordinaten für GPS und Navigationssysteme\n09° 30' 31\" Ost und 51° 19' 19\" Nord\n\nBild: Universität Kassel Pressestelle"}, {"id": "P14", "query": "Dienstreise abgesagt Stornokosten", "description": "Meine Dienstreise wurde abgesagt, ich habe aber schon Hotel und Zug gebucht. Wer zahlt die Stornokosten?", "narrative": "Relevant sind Regelungen zur Erstattung von Stornierungskosten bei ausgefallenen Dienstreisen.", "title": "Elek­tro­ni­sche Zeit­er­fas­sung - INTERN - Uni Kassel", "url": "https://www.uni-kassel.de/intern/interne-bereiche-der-abteilungen/personal-und-organisation/arbeitszeitangelegenheiten/elektronische-zeiterfassung", "text": "Elek­tro­ni­sche Zeit­er­fas­sung\n\nDie Informationen zur elektronischen Zeiterfassung betreffen alle Bediensteten der Zentralen Uni­ver­si­täts­ver­wal­tung und der zentralen Einrichtungen IT-Servicezentrum, Universitätsbibliothek Kassel – Lan­des­bibliothek und Murhardsche Bibliothek der Stadt Kassel, UniKasselTransfer und Uniwerkstätten.\n\nVon der Teilnahme ausgeschlossen sind Mitglieder der Fachbereiche, des Präsidiums, vollständig freigestellte Personalratsmitglieder und im Personalratsbüro administrativ tätige Bedienstete, Bedienstete der Fahrbereitschaft, Bedienstete der Werkstätten der Betriebstechnik, Bedienstete der Pförtnerei, außerhalb des Koordinationsbüros tätigen Hausmeisterinnen und Hausmeister, Auszubildende der Uniwerkstätten und Bedienstete der Telefonzentrale.\n\nSeit dem Jahr 2023 nehmen auch einzelne Beschäftigte der Hausmeisterei am Holländischen Platz sowie der Betriebstechnik der Universität Kassel an der elektronischen Zeiterfassung mit Nutzung von Gleitzeiten teil.\n\nFreischaltung der Campuscard für die elektronische Zeiterfassung\n\nDie Nutzung der elektronischen Zeiterfassung erfolgt mittels Campuscard. Voraussetzung für die Campuscard ist ein Uni-Account.\n\nUm die Campuscard für die elektronische Zeiterfassung nutzen zu können, muss diese zuerst initialisiert werden. Hierzu ist es notwendig, dass die Campuscard vor der ersten Nutzung in der Abteilung Personal und Organisation vorgelegt wird.\n\nBitte vorher ankündigen bei:\n\n- Katharina Goldbeck (Raum: 2190, Telefon: 2122, E-Mail: k.goldbeck@uni-kassel.de)\n- Katrin Fensterer (Raum: 2450, Telefon: 3988, E-Mail: katrin.fensterer@uni-kassel.de) Mo, Mi-Fr\n- Daniel Hines (Anbau Raum: 1170, Telefon: 2196, E-Mail: daniel.hines@uni-kassel.de)\n\nWie mel­de ich mich am Sys­tem an?\n\nAnmeldung am Webclient:\nEinloggen mit Ihrer „Benutzer ID“ und Ihrem „Passwort“ für den Uni Account.\n\n1. Wenn man sein Passwort mehrmals falsch eingibt, kommt ein Captcha. Das Captcha muss ausgefüllt und die Benutzer-ID (Uni-Account) und das Passwort richtig eintragen werden.\n2. Gibt man sein Passwort mehr als 5x falsch ein, kann das Entsperren nur von der zuständigen Personalsachbearbeitung erfolgen.\n3. Ob das Passwort noch funktioniert kann man über mail.uni-kassel.de testen. Funktioniert die Anmeldung dort, ist das Passwort nicht gesperrt und funktioniert auch bei Tisoware.\n4. Bei der Anmeldung darf man nach der Eingabe von Benutzer-ID (Uni-Account) und Passwort nur einmal klicken oder nur einmal die Return Taste betätigen. Macht man dies mehrfach schnell hintereinander, kommt die Meldung \"Authentifizierung fehgeschlagen\".\n5. Hat man im IDM sein Passwort geändert, dauert es eine Weile, bis es mit Tisoware synchronisiert wird.\n\nZeit­er­fas­sung - FAQ\n\nKontakt\n\nBitte lesen Sie zunächst die FAQ-Beiträge.\nBei untenstehenden und weiteren Fragen wenden Sie sich bitte direkt an die zuständigen Ansprechpersonen in der Abteilung Personal und Organisation.\n\nWurden Sie einer falschen Gruppe zugeordnet?\nIst eine falsche Sollarbeitszeit eingetragen?\nSind die falschen Arbeitstage hinterlegt?\nStimmt die Eintragung Ihrer/Ihres Vorgesetzten nicht?\n\nDann schreiben Sie bitte eine E-Mail an:\n\nNach oben\n\nElektronische Zeiterfassung in tisoware® - Mobile Arbeit und Korrekturbuchungen\n\nAnleitungen\n\nWorkflows\n\nUrlaub\n\nIhre im vorherigen Kalenderjahr entstandenen und noch bestehenden Erholungsurlaubsansprüche verfallen grundsätzlich, wenn Sie Ihren Urlaub nicht bis zum 30. September des laufenden Jahres antreten. Falls Sie teilzeitbeschäftigt sind und ihr regulärer Arbeitstag im September vor dem 30. September stattfindet, muss der Resturlaub aus dem vorherigen Kalenderjahr an diesem letzten Arbeitstag im September angetreten werden.\n\nKlicken Sie auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Urlaubsantrag“. Die Beantragung von Urlaub kann von Ihnen persönlich nur im Voraus erfolgen. Zuerst muss der Urlaubszeitraum mit Hilfe des Kalendersymbols oder durch überschreiben des Datums angegeben werden. Für einen Urlaubsantrag ist es zwingend notwendig eine Vertretung anzugeben, den Sie unter „Name“ durch eintippen der ersten Buchstaben des Nachnamens auswählen können. Das „Info-Feld“ können Sie mit weiteren Kurzinformationen, die für Ihre Vertretung oder für Ihre Vorgesetzten von Nutzen sein können, füllen (z. B. 1 Tag Überschneidung, Vorname Nachname ist informiert und im Haus). Nun klicken Sie auf das Diskettensymbol, um Ihren Workflow zu starten. Dieser wird zuerst an Ihre Vertretung, anschließend an Ihre Vorgesetzten zur Zustimmung weitergeleitet. Im Falle einer Ablehnung muss ein Grund angegeben werden.\n\nBei kurzfristiger Beantragung am selben Tag kann das jeweils zuständige Sekretariat einen Workflow für Ihren Urlaub starten. Ein nachträglicher Eintrag ist nur durch die Personalsachbearbeitungen der Abteilung Personal und Organisation möglich, hier besteht keine Möglichkeit zur Eigenkorrektur.\n\nBitte beachten Sie:\n\n  • Es gibt keine halben Urlaubstage.\n  • Eine stundenweise Anwesenheit ist während eines genehmigten Urlaubstages nicht gestattet.\n  • Anleitung \"Antrag auf Erholungsurlaub\"\n\nFalls Sie in zwei Vertretungen haben, klicken Sie in diesem Fall auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Urlaubsantrag“. Geben Sie bei Vertretung eine Vertretung ein und geben im Infofeld an, dass die andere Vertretung informiert und im Haus ist.\n\nFalls Sie in zwei Gruppen/Teams tätig sind, sind Ihre beiden Gruppen-/Teamleitungen in der Regel von der Abteilung Personal und Organisation hinterlegt worden. Daher klicken Sie in diesem Fall auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Urlaubsantrag 2 Vorgesetzte“.\n\nFalls Sie in einer Gruppe/einem Team tätig sind, klicken Sie auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Urlaubsantrag ohne Vertretung“. In diesem Fall entfällt der Schritt „Vertretung auswählen“. Das Infofeld muss für die Vorgesetzten mit Informationen zur Vertretung gefüllt werden (z. B. Vertretung wurde im Team abgestimmt).\n\nDer Behinderten- bzw. Schwerbehindertenurlaub wird automatisch nach der jeweiligen Fälligkeit abgetragen. Es muss kein Hinweis von der Antragstellerin/dem Antragsteller erfolgen, von welchem Kontingent der Urlaub abgetragen werden soll.\n\nKlicken Sie auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Bildungsurlaub Tarifbesch.“. Die Beantragung von Bildungsurlaub kann von Ihnen persönlich nur im Voraus erfolgen. Der gesamte Zeitraum des Bildungsurlaubs (in der Regel 5 Tage) ist in den Feldern „Von Datum“ und \"Bis Datum\" anzugeben. Im Feld „Info“ sind die Veranstaltung sowie die Dauer der Veranstaltung anzugeben. Bitte wählen Sie eine Vertretung aus, der Sie in Ihrer Abwesenheit vertritt.  Die dem Antrag beizufügenden Unterlagen können dem Workflow beigefügt werden. Nach erfolgter Prüfung durch die Abteilung Personal und Organisation wird der Workflow genehmigt und Sie erhalten ein Genehmigungsschreiben.\n\nBuchungen\n\nEin Dienstgang ist ein Gang oder eine Fahrt, welche*r innerhalb des Dienstortes vorgenommen wird, um ein Dienstgeschäft außerhalb der Dienststelle zu erledigen. Der Dienstgang ist durch Betätigen der gelben Taste „Dienstgang“ am Zeiterfassungsgerät anzuzeigen. Ein Dienstgang wird durch Betätigen der „Kommen-Taste“ beendet. Wird der Dienst direkt im Anschluss beendet, ist darüber hinaus die „Gehen-Taste“ zu betätigen.\n\nAlle Zeiterfassungsbuchungen („Kommen“, „Gehen“ sowie „Dienstgang“) können auch an anderen Uni-Standorten erfolgen, soweit ein Zeiterfassungsgerät vorhanden ist. Die Liste der Zeiterfassungsgeräte finden Sie in der Anlage der Dienstvereinbarung zur gleitenden Arbeitszeit.\n\nFalls Sie Ihr Passwort vergessen haben, es nicht mehr funktioniert oder abgelaufen ist, wenden Sie sich bitte an die Mitarbeiter*innen des IT-Servicezentrum (ITS). Nur hier können eine Zurücksetzung des alten Passworts und eine Zustellung eines neuen Passwortes erfolgen. Die standardmäßige Aktualisierung Ihres Passwortes erfolgt im halbjährlichen Rhythmus. Bitte vergeben Sie ein Passwort, das nicht mehr als 14 Zeichen und keine der folgenden Zeichen: [-] [;] [_])hat.\n\n  • Service-Nummer: Tel.: +49 561 804-5678\n    Montag und Donnerstag von 8:00 bis 16:00 Uhr\n    Dienstag und Mittwoch von 9:00 bis 15:00 Uhr\n    Freitag von 9:00 bis 13:00 Uhr\n  • Ticketsystem\n\nFalls Sie beim Kommen, Gehen oder beim Dienstgangende das Stempeln vergessen haben, produziert das System am Folgetag eine Fehlermeldung. \n\nFalls Sie gar nicht stempeln konnten, produziert das System am Folgetag eine Fehlermeldung.\n\nAnleitung \"Alle Buchungen fehlen\"\n\nGleitzeit / Tauschtag Teilzeit\n\nKlicken Sie auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Gleitzeitantrag“. Die Beantragung eines Gleittages kann von Ihnen persönlich nur im Voraus erfolgen. Zuerst muss der Zeitraum mit Hilfe des Kalendersymbols oder durch überschreiben des Datums (gem. Dienstvereinbarung bis zu 3 Gleittage im Monat und insgesamt 24 Gleittage pro Jahr) gewählt werden. Für einen Gleitzeitantrag ist es zwingend notwendig eine Vertretung anzugeben, die Sie unter „Name“ durch eintippen der ersten Buchstaben des Nachnamens auswählen können. Das „Info-Feld“ können Sie mit weiteren Kurzinformationen, die Ihrer Vertretung oder Ihrer Vorgesetzten von Nutzen sein können, füllen (z. B. 1 Tag Überschneidung, Vorname Nachname ist informiert und im Haus). Nun klicken Sie auf das Diskettensymbol, um Ihren Workflow zu starten. Dieser wird zuerst an Ihre Vertretung, anschließend an Ihre Vorgesetzten zur Zustimmung weitergeleitet. Im Falle einer Ablehnung muss ein Grund angegeben werden.\n\nBei kurzfristiger Beantragung am selben Tag kann das jeweils zuständige Sekretariat einen Workflow für Ihren Gleittag starten. Ein nachträglicher Eintrag ist nur durch die Personalsachbearbeitung der Abteilung Personal und Organisation möglich, hier besteht keine Möglichkeit zur Eigenkorrektur.\n\nIm Folgenden erhalten Sie die Anleitung, um einen halben Gleittag zu beantragen (vormittags oder nachmittags)\n\nFalls Sie in zwei Vertretungen haben, klicken Sie in diesem Fall auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Gleitzeitantrag“. Geben Sie bei Vertretung die eine Vertretung ein und im Infofeld an, dass die andere Vertretung informiert und in diesem Zeitraum im Dienst ist.\n\nFalls Sie in einer Gruppen/einem Team tätig sind, klicken Sie in diesem Fall auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Gleitzeitantrag o. Vertret.“. In diesem Fall entfällt der Schritt „Vertretung auswählen“. Das Infofeld muss für die Vorgesetzten mit Informationen zur Vertretung gefüllt werden (z. B. Vertretung wurde im Team abgestimmt).\n\nFalls an einem Tag, an dem Sie als Teilzeitbeschäftigte:r regulär keinen Dienst haben, eine dienst­liche Notwendigkeit für eine Anwesenheit besteht, kann von Ihnen pro Monat ein Tausch­tag per Workflow be­an­tragt werden.\n\nDer Tauschtag muss beantragt und genehmigt werden, bevor Sie zum Dienst erscheinen, da nur so der Unfallversicherungsschutz gewährleistet werden kann.\n\nBeispiel:\n\nSie arbeiten regulär dienstags und donnerstags. An einem Montag findet jedoch eine Pro­jekt­­sitzung statt, an der Sie teilnehmen müssen.\n\nSie beantragen für den Dienstag einen Tauschtag, wählen für den Dienstag eine:n Vertreter:in aus und schreiben ins Infofeld, dass Sie dafür am Montag (mit Datum) an der Pro­jekt­sitzung teilnehmen.\n\nFalls Sie an dem Montag erkranken sollten, müssen Sie für den Dienstag entweder eine Krankmeldung vorlegen oder zum Dienst erscheinen, da kein Tausch statt­ge­fun­den hat. D. h. grundsätzlich kann ein Tauschtag erst dann angetreten wer­den, wenn die Zeiten an einem anderen Tag bereits eingearbeitet wurden.\n\nDienstreise\n\nKlicken Sie auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Dienstreise“. Die Beantragung einer Dienstreise kann von Ihnen persönlich nur im Voraus erfolgen. Zuerst muss der Zeitraum mit Hilfe des Kalendersymbols oder durch überschreiben des Datums gewählt werden. Für eine Dienstreise ist es zwingend eine Vertretung anzugeben, die Sie unter „Name“ durch eintippen der ersten Buchstaben des Nachnamens auswählen können. Das „Info-Feld“ muss beinhalten, um welche Dienstreise es sich handelt. Nun klicken Sie auf das Diskettensymbol, um Ihren Workflow zu starten. Dieser wird zuerst an Ihre Vertretung, anschließend an Ihre Vorgesetzten zur Zustimmung weitergeleitet. Im Falle einer Ablehnung muss ein Grund angegeben werden.\n\nBei kurzfristiger Beantragung am selben Tag kann das jeweils zuständige Sekretariat einen Workflow für Ihre Dienstreise starten. Ein nachträglicher Eintrag ist nur durch die Administratoren der Abteilung Personal und Organisation möglich, hier besteht keine Möglichkeit zur Eigenkorrektur.\n\nDer „Antrag auf Genehmigung einer Dienstreise“ für die versicherungsrechtliche Seite und zur Abrechnung von evtl. anfallenden Reisekosten ist parallel in Fiori zu stellen.\n\nWeitere Informationen zum Reisekostenrecht erhalten Sie von den Sachbearbeitungen der Gruppe III B der Abteilung Personal und Organisation.\n\nWollen Sie das Datum ihrer Dienstreise ändern oder gänzlich stornieren, müssen Sie zunächst den gestellten Workflow-Antrag stornieren. Anschließend beantragen Sie die Dienstreise unter dem neuen Datum neu. Eine Stornierung und Änderung ist nur für in der Zukunft liegende Dienstreisen möglich.\n\nFalls Sie in einer Gruppe/einem Team tätig sind, klicken Sie in diesem Fall auf „Workflow“ „Neuer Vorgang“ und mit einem Klick auf „Dienstreise ohne Vertr.“. In diesem Fall entfällt der Schritt „Vertretung auswählen“. Das „Info-Feld“ muss beinhalten, um welche Dienstreise es sich handelt und wie die Vertretung gehandhabt wird (z. B. Vertretung wurde im Team abgestimmt).\n\nHalbtägige Dienstreisen sind nicht im Vorfeld zu beantragen, die formale Genehmigung Ihres genehmigten Papierantrages des Dienstreisemanagementteams liegt Ihnen ja bereits vor.\n\nDa Ihnen für den Tag Minuten oder Stunden bis zu Ihrer persönlichen täglichen Sollarbeitszeit fehlen, produziert das System am Folgetag eine Fehlermeldung. Sie können direkt auf die Ziffer in der Startmaske klicken und werden daraufhin zum relevanten Tag weitergeleitet. Klicken Sie bitte auf das Stiftsymbol, Sie werden in eine Maske weitergeleitet. Dort klicken Sie bitte auf die jeweilige Buchungszeile, in der eine Buchung fehlt. Bitte wählen Sie unten \"Anwesenheit\" aus und bei „gew“ (gewertet) die entsprechende Zeit ein. Dieser Nachtrag muss im Infofeld mit einem Korrekturgrund versehen werden, damit die Vorgesetzten wissen, aus welchem Grund die Buchung fehlt/Buchungen fehlen, z. B. \"Halbe Dienstreise vormittags nach Gießen\". Mit einem Klick auf das Diskettensymbol wird der Datensatz gespeichert und an Ihren nächsten Vorgesetzten zur Genehmigung weiter geschickt.\n\n  • Grundsatz: Für jeden Reisetag (inklusive An- und Abreise) wird die an diesem Tag geltende Sollzeit berücksichtigt. Wenn die Dienstzeit vor Ort inkl. der Fahrtzeit nicht ausreicht, um die Sollzeit zu erreichen, wird diese trotzdem für den Tag angerechnet. Der Tag wird mit plus/minus Null berechnet.\n  • Dauert die Arbeit vor Ort länger als die Sollarbeitszeit, wird diese tatsächliche Zeit angerechnet (nicht nur die Sollzeit).\n  • Praktische Umsetzung im Zeiterfassungssystem: Im Zeiterfassungssystem wird anfangs nur die reguläre Sollzeit erfasst. Wer zusätzliche Stunden vor Ort geleistet hat, muss sich bei der Abteilung Personal und Organisation unter zeiterfassung[at]uni-kassel[dot]de per E-Mail melden – diese bucht die zusätzlichen Zeiten manuell nach.\n  • Gehen Teilzeitbeschäftigte an einem ihrer freien Arbeitstage auf Dienstreise, gilt die Sollarbeitszeit analog zu den regulären Arbeitstagen. Die o. g. Regelungen gelten entsprechend.\n\nKrankheit\n\nWerden Sie im Laufe des Tages krank, melden Sie sich bitte in dem für Sie zuständigen Sekretariat ab bzw. dort, wo es in Ihrem Bereich organisatorisch geregelt ist. Setzen Sie beim Verlassen des Standortes eine reguläre Gehen-Buchung ab. Falls Sie am nächsten Tag wieder kommen, hat das System einen Fehler produziert, den Sie korrigieren müssen. Hierzu starten Sie „Workflow“ „Neuer Vorgang“ „Korrektur“ und wählen den entsprechenden Tag aus. Hier klicken Sie bitte auf den roten Strich und wählen bei „Lohnart“ mit dem grauen Pfeil „Anwesenheit“ aus. Im Anschluss geben Sie bei „gew“ (gewertet) die Zeit so ein, dass für diesen Tag weder ein Plus, noch ein Minus entsteht. Diese Korrektur muss im Infofeld mit „Krank nach Hause“ versehen werden, damit die Vorgesetzten wissen, aus welchem Grund die Korrektur nötig ist. Mit einem Klick auf das Diskettensymbol wird der Datensatz gespeichert und an Ihre Vorgesetzten zur Genehmigung weiter geschickt.\n\nAlle Bediensteten haben bereits am ersten Tag einer Dienst- bzw. Arbeitsunfähigkeit die Verpflichtung, ihre Organisationseinheit, in der sie tätig sind, über eine auf Krankheit beruhende Dienst- bzw. Arbeitsunfähigkeit inkl. der voraussichtlichen Dauer und der Mitteilung, ob ein Attest vorliegt, zu informieren.\n\nUnter Berücksichtigung der Erfordernisse des Dienstbetriebes (z. B. terminierte Lehrveranstaltungen, Besprechungen, Dienstpläne) sollte die Krankmeldung durch die/den Bediensteten so früh wie möglich - spätestens bis zum regelmäßigen Dienstbeginn - erfolgen, damit entsprechende Dispositionen getroffen werden können.\n\nVom Bereich wird ein Workflow „Krank“ für Sie gestartet, der Ihren Vorgesetzten sowie Ihre persönliche Personalsachbearbeitung zur Kenntnis per E-Mail zugeht.\n\nBei Wiederaufnahme des Dienstes müssen Sie sich per Formular bei Ihrer zuständigen Personalsachbearbeitung sowie Ihrer \"Organisationseinheit\" unverzüglich am ersten Arbeitstag nach Ende des Zeitraums der Erkrankung wieder gesund melden. Dasselbe gilt, wenn Sich Ihrer Erkrankung ein Urlaubstag anschließt. Das Formular finden Sie unter: www.uni-kassel.de/go/krank-gesund (login erforderlich)\n\nEine Arbeitsunfähigkeitsbescheinigung ist ab dem 4. Kalendertag erforderlich. Unter Kalendertagen versteht man die Tage Montag bis Sonntag. Bedienstete, die keine eAU erhalten, senden die Arbeitsunfähigkeitsbescheinigungen per E-Mail oder im Original an ihre zuständige Personalsachbearbeitung in der Abteilung Personal und Organisation.\n\nEine nachträgliche Buchung von ganztägigen Krankheitstagen erfolgt ausschließlich durch die Abteilung Personal und Organisation.\n\nBei einer Erkrankung während des Urlaubs hat die/der Bedienstete dies unverzüglich ihrer/seiner Organisationseinheit, in der sie/er tätig ist, anzuzeigen und von de
