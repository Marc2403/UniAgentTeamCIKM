<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relevanz-Check</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --muted: #5d6470; --line: #d9d6cc;
    --accent: #2f5d8a; --accent-ink: #ffffff; --chosen: #2f5d8a; --warn: #a3452c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 120px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0; }
  .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 2px; }
  .label:first-child { margin-top: 0; }
  .query { font-size: 18px; font-weight: 600; }
  .doc-title { font-size: 16px; font-weight: 600; }
  .url { color: var(--muted); word-break: break-all; font-size: 13px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 10px; max-height: 60vh; overflow-y: auto; padding-right: 6px; }
  .more { margin-top: 10px; }
  .grades { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .grade { text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 10px 12px; cursor: pointer; font: inherit; }
  .grade b { display: block; font-size: 18px; }
  .grade[aria-pressed="true"] { background: var(--chosen); border-color: var(--chosen); color: var(--accent-ink); }
  textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; }
  nav .inner { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  button.nav, button.export, .more { border: 1px solid var(--accent); background: var(--card); color: var(--accent); border-radius: 6px; padding: 8px 14px; cursor: pointer; font: inherit; }
  button.export { background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .4; cursor: default; }
  .status { color: var(--muted); font-size: 13px; }
  .missing { color: var(--warn); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Relevanz-Check</h1>
    <span class="progress" id="progress"></span>
  </header>
  <div class="bar"><div id="bar"></div></div>

  <section class="card">
    <div class="label">Suchanfrage</div>
    <div class="query" id="query"></div>
    <div class="label">Beschreibung</div>
    <div id="description"></div>
    <div class="label">Hinweis (Narrative)</div>
    <div id="narrative"></div>
  </section>

  <section class="card">
    <div class="label">Dokument</div>
    <div class="doc-title" id="title"></div>
    <div class="url" id="url"></div>
    <div class="text" id="text"></div>
    <button class="more" id="more" type="button"></button>
  </section>

  <section class="card">
    <div class="label">Deine Note</div>
    <div class="grades" id="grades"></div>
    <div class="label">Kommentar (optional)</div>
    <textarea id="comment" placeholder="z. B. warum diese Note"></textarea>
    <div class="hint">Tastatur: 0–3 vergibt die Note, ← / → blättert (nicht während du im Kommentarfeld schreibst).</div>
  </section>
</main>

<nav>
  <div class="inner">
    <div>
      <button class="nav" id="prev" type="button">← Zurück</button>
      <button class="nav" id="next" type="button">Weiter →</button>
    </div>
    <span class="status" id="status"></span>
    <button class="export" id="export" type="button">Ergebnisse exportieren</button>
  </div>
</nav>

const PAIRS = [{"id": "P01", "query": "Schadensersatz zu Unrecht erstattete Bewirtungskosten", "description": "Haftet ein Amtsträger für zu Unrecht erstattete Reise- und Bewirtungskosten?", "narrative": "Relevant ist der Beschluss des Hessischen Verwaltungsgerichtshofs zum Schadensersatzanspruch.", "title": "312 C 183/08 | AG Darmstadt Einzelrichter | 04.09.2009 | Urteil", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/LARE210001133", "text": "Leitsatz\n\nEin Freistellungsanspruch des Versicherungsnehmers gegenüber seiner Haftpflichtversicherung besteht nur in dem Umfang, in dem er selbst gegenüber dem Geschädigten zum Schadensersatz verpflichtet ist. Der Geschädigte hat gegenüber dem Versicherungsnehmer keinen Schadensersatzanspruch bezüglich der Kosten der Datenrettung bzw. Datenneueingabe, wenn er es unterlassen hat, die auf dem Notebook vorhandenen Daten auf anderen Datenträgern außerhalb des Notebooks zu sichern.\n\nTenor\n\n1. Die Beklagte wird verurteilt, den Kläger aus der Vermögensschaden-Haftpflichtversicherung Nr. H xxxx von Schadensersatzansprüchen des Herrn H. C. wegen der Beschädigung eines Notebook „Sony VGN-A 217 M“ in Höhe weiterer 58,52 EUR freizustellen.\n\n2. Im Übrigen wird die Klage abgewiesen.\n\n3. Der Kläger hat 98%, die Beklagte 2% der Kosten des Rechtsstreits zu tragen.\n\n4. Das Urteil ist vorläufig vollstreckbar. Die Parteien dürfen die Vollstreckung gegen Sicherheitsleistung in Höhe von 110% des vollstreckbaren Betrags abwenden, wenn nicht die andere Partei vor der Vollstreckung Sicherheit in Höhe von 110% des jeweils zu vollstreckenden Betrags leistet.\n\n5. Der Streitwert wird auf 2.742,63 EUR festgesetzt.\n\nTatbestand\n\nDie Beklagte ist die private Haftpflichtversicherung des Klägers. Am 04.06.2007 beschädigte der Kläger im Haus seiner Eltern das Notebook seines Vaters H. C. irreparabel, indem er aus Unachtsamkeit ein Glas Wasser umstieß. Das beschädigte Notebook Sony Vaio VGN-A 217 M war vom Zeugen C. am 25.10.2004 zu einem Preis von 1.899,00 EUR angeschafft worden.\n\nDer Kläger kaufte seinem Vater am 06.06.2007 ein neues Notebook für 1.199,00 EUR. Das Notebook Sony Vaio VGN-A 217 M wurde durch ein Nachfolgemodell ersetzt und war im Handel nicht mehr erhältlich.\n\nDer Kläger beauftragte Herrn Dipl.-Ing. M. R., sämtliche Programme des zerstörten Notebooks auf das neue Notebook zu installieren bzw. die Daten neu einzugeben. Der Zeuge R. berechnete hierfür gemäß Rechnung vom 01.08.2007 Arbeitskosten in Höhe von 79,00 EUR/Stunde und Fahrtkosten in Höhe von 30,00 EUR/Stunde, insgesamt 2.233,63 EUR.\n\nDie Beklagte erstattete dem Kläger per Scheck am 05.09.2007 690,00 EUR bezüglich des beschädigten Notebooks und leistete keine Zahlungen auf die Rechnung des Zeugen R..\n\nDer Kläger behauptet, der Zeitwert des am 25.10.2004 zu einem Preis von 1.899,00 EUR gekauften Notebooks Sony VGN-A 217 M habe zum Zeitpunkt der Beschädigung am 04.06.2007 mindestens 1.199,00 EUR betragen.\n\nDer Kläger behauptet weiter, die Datenrettung sei nicht mehr möglich gewesen, weshalb der Zeuge R. die ursprünglich auf dem Notebook vorhandenen Daten neu eingegeben habe. Die abgerechneten Arbeitsstunden und Fahrtkosten seien tatsächlich angefallen, angemessen und ortsüblich. Der Kläger habe die Rechnung des Zeugen R. am 08.08.2007 in bar bezahlt.\n\nDas Notebook werde nur ab und zu genutzt für die Erstellung von Nebenkostenabrechnungen für die etwa 40 Miet- und Gewerbeeinheiten des Klägers in P-stadt und Überwachung der Zahlungseingänge, für die monatliche Umsatzsteuervoranmeldung, für Wertpapiergeschäfte des Zeugen C. selbst und für die Verwaltung aufgrund seiner Mitgliedschaft in diversen Vereinen. Der Datenumfang habe etwa 20 GB betragen. Es habe keinen Grund gegeben, den Computer vor einem „Crash“ zu sichern. Die Daten seien rechnerintern geschützt gewesen.\n\nDer Kläger beantragt,\n\ndie Beklagte zu verurteilen, dem Kläger 2.742,63 EUR zu zahlen nebst Zinsen hieraus in Höhe von 5%-Punkten über dem Basiszinssatz seit Rechtshängigkeit,\n\nhilfsweise, die Beklagte zu verurteilen, den Kläger aus der Vermögensschaden-Haftpflichtversicherung Nr. H xxx von Schadensersatzansprüchen des Herrn H. C. wegen der Beschädigung eines Notebook „Sony VGN-A 217 M“ freizustellen.\n\nDie Beklagte beantragt,\n\ndie Klage abzuweisen.\n\nDie Beklagte behauptet, das Modell Sony Vaio VGN-A 217 M sei im Handel nicht mehr erhältlich und durch das Modell Sony Vaio VGN-AP 41 E ersetzt worden, welches für etwa 1.118,00 EUR erworben werden könne. Unter Berücksichtigung des Alters des beschädigten Notebooks zum Schadenszeitpunkt, der Wiederbeschaffungskosten und der technischen Weiterentwicklung ergebe sich für das beschädigte Gerät ein Zeitwert in Höhe von 690,00 EUR.\n\nDie Vergeblichkeit der Datenrettung hätte in maximal einer halben Stunde festgestellt werden können. Die Dateneingabe sei mit maximal 10,00 EUR pro Stunde zu vergüten und hätte von jedem Schüler durchgeführt werden können.\n\nDie Klageschrift ist der Beklagten am 27.05.2008 zugestellt worden.\n\nDas Gericht hat Beweis erhoben durch Einholung eines schriftlichen Sachverständigengutachtens. Wegen des Ergebnisses der Beweisaufnahme wird auf das Gutachten des Sachverständigen Dipl.-Ing. M. G. vom 11.03.2008 verwiesen.\n\nHinsichtlich des Parteivorbringens im Übrigen und der unerledigten Beweisangebote wird auf die gewechselten Schriftsätze Bezug genommen.\n\nEntscheidungsgründe\n\nDie zulässige Klage ist teilweise begründet.\n\nDer Kläger hat gegenüber der Beklagten einen Anspruch auf Freistellung in Höhe weiterer 58,52 EUR aus § 100 VVG (§ 149 VVG a.F.) i.V.m. dem Versicherungsvertrag.\n\nDie Beklagte ist verpflichtet, den Kläger von der Inanspruchnahme durch seinen Vater aus dem Schadensereignis vom 04.06.2007 freizustellen. Zwischen den Parteien besteht ein Privathaftpflichtversicherungsvertrag. Der Kläger hat unstreitig das Notebook seines Vaters durch Unachtsamkeit beschädigt.\n\nDas zerstörte Notebook hatte einen Zeitwert von 748,52 EUR. Dies steht nach dem Ergebnis der Beweisaufnahme fest. Auf das gerichtlich eingeholte Gutachten des Sachverständigen Dipl.-Ing. G. wird Bezug genommen. Die Beklagte zahlte vorprozessual an den Kläger bereits 690,00 EUR. Hinsichtlich der Differenz von 58,52 EUR besteht der Freistellungsanspruch weiterhin.\n\nIm Übrigen war die Klage abzuweisen.\n\nHinsichtlich der Kosten für die Datenrettung bzw. Datenneueingabe von 2.233,63 EUR hat der Kläger keinen Freistellungsanspruch. Der Freistellungsanspruch besteht nur in dem Umfang, in dem der Versicherungsnehmer gegenüber dem Geschädigten zum Schadensersatz verpflichtet ist. Der Vater des Klägers hat wegen überwiegendem Mitverschulden gemäß § 254 BGB gegenüber dem Kläger keinen Anspruch auf Schadensersatz bezüglich der Kosten von 2.233,63 EUR, weil er es unterlassen hat, die auf dem Notebook vorhandenen Daten auf anderen Datenträgern außerhalb des Notebooks zu sichern.\n\nDer Kläger hat gegenüber der Beklagten keinen Zahlungsanspruch. Der Hauptantrag war daher im Übrigen abzuweisen. Der Anspruch auf Versicherungsschutz wandelt sich nur dann in einen Zahlungsanspruch um, wenn der Versicherungsnehmer den Geschädigten befugtermaßen befriedigt hat. Dies ist vorliegend nicht der Fall. Der Kläger war nicht zum Anerkenntnis berechtigt, da die Beklagte einem Anerkenntnis nicht zugestimmt hat. Der Kläger hat ohne vorherige Absprache mit der Beklagten Schadensersatz geleistet. Dies führt nicht zu einem Zahlungsanspruch gegenüber der Beklagten.\n\nMangels Hauptforderung besteht auch kein Zinsanspruch.\n\nDie Kostenentscheidung folgt aus § 92 Abs. 1 Satz 1 ZPO.\n\nDie Entscheidung über die vorläufige Vollstreckbarkeit beruht auf § 708 Nr. 11, § 711 ZPO.\n\nDer Streitwert war nach § 48 Abs. 1 Satz 1 GKG festzusetzen."}, {"id": "P02", "query": "Deadline travel expense claim", "description": "By when must travel expenses be claimed after a trip?", "narrative": "Relevant documents state the deadline for submitting a travel expense claim.", "title": "Further training abroad for staff members - UNI", "url": "https://www.uni-kassel.de/uni/en/international/going-abroad/further-training-abroad-for-staff-members.html", "text": "Further training abroad for staff members\n\nThis page contains automatically translated content.\n\nErasmus+ enables all employees of the University of Kassel to undertake further education and training abroad. On this page you will find important information on the requirements and funding for these so-called staff mobilities for further education and training (STT) as well as a checklist for planning and carrying out your stay. General information about the Erasmus+ program can be found here.\n\nPlease note our new application deadline of at least 10 weeks prior to the start of the stay.\n\n  • All employees who are in an employment relationship (regular employment contract; teaching assignment) with the University of Kassel are eligible for funding\n  • The stay takes place as part of a business trip; educational vacations are excluded from Erasmus+ funding\n  • Funding may be granted again no earlier than 24 months after the last funded mobility period\n  • Planned stay takes place in an Erasmus+ program country\n  • In principle, all measures that meet the program requirements are eligible for funding\n  • Language courses (all levels; starting with A1),\n    IF the target language (usually English) is part of professional communication in the workplace \n    AND the course comprises at least 20 hours per week \n    AND the target language is spoken as a first language in the host country\n  • Staff training weeks with an activity and/or internationalization focus\n  • Workshops related to work and/or internationalization\n  • Work shadowing/job shadowing\n  • Participation in curriculum development (faculty members)\n  • Funding duration\n    2-5 days (however, the stay can be longer)\n\n \n\n  • Composition\n    The funding consists of a lump sum for the stay and a lump sum for travel expenses:\n     \n\n    • Lump sum for stay\n\n      Destination countryFunding amount per day\n      Austria, Belgium, Denmark, Finland, France, Germany, Iceland, Ireland, Italy, Liechtenstein, Luxembourg, Netherlands, Norway, Sweden180 EUR/day\n      Estonia, Greece, Latvia, Malta, Portugal, Slovakia, Slovenia, Spain, Czech Republic, Cyprus160 EUR/day\n      Bulgaria, Croatia, Lithuania, North Macedonia, Poland, Romania, Serbia, Turkey, Hungary140 EUR/day\n\n       \n\n    • Travel allowance\n\n      Single distance according to distance calculator*Amount (unit costs) per participant\n      (= round trip)      \t\tGreen Travel**\n      10 - 99 km28 EUR56 EUR\n      100 - 499 km211 EUR285 EUR\n      500 - 1,999 km309 EUR417 EUR\n      2,000 - 2,999 km395 EUR535 EUR\n      3,000 - 3,999 km580 EUR785 EUR\n      4,000 - 7,999 km1,188 EUR1,188 EUR\n      8,000 km and more1,735 EUR1,735 EUR\n\n      * Distance is calculated using the Distance Calculator calculated\n      ** \"Green Travel\" travel allowance for arrival and departure by sustainable means of transport (bus, train, carpool, bicycle) plus additional travel days\n\n \n\n  • Interrail Pass\n    • Participants have the opportunity to purchase a discounted Interrail Pass\n\n    • Can be used for the outward and return journey, as well as trips in the host country and neighboring countries\n\n       \n\n  • Any course or participation fees incurred are not funded separately, but can be paid from the lump sums\n  • Participants with additional financial requirements due to\n    • Taking along child(ren)\n    • Chronic illnesses\n    • GdB of at least 20\n  • Applications must be submitted at least 3 months before the start of the trip\n  • It is best to contact us in good time!\n\nChecklist for your stay\n\n  1. 1.Informing\n\n    • Find out for yourself about\n      - Language courses abroad (see Eligible measures)\n      - Staff Weeks\n      - Offers from partner universities\n    • Contact the desired institution\n    • Clarify participation in the program with your supervisor\n\n  2. 2.Application\n\n    • Consideration of the application deadline of at least 10 weeks before the start of the mobility\n    • Application form via e-mail to erasmus[at]uni-kassel[dot]de\n      In this form, you clearly state the professional added value for your work at the University of Kassel aswell as your personal added value AND show the consent of your supervisor to participate in the requested staff mobility confirmed by signature\n\n    The Erasmus+ team will respond to the funding application within approximately two weeks\n\n  3. 3.Before the stay\n\n    • Online registration of the stay\n      (link in the funding confirmation)\n    • Documents to be submitted for funding\n      - Mobility Agreement\n      (template will be sent by the Erasmus+ team)\n      - Grant Agreement\n      (template will be sent by the Erasmus+ team)\n      - PDF of the approved business trip application\n      (application in FIORI Business Trip Management)\n\n    As soon as all documents have been submitted, the grant will be transferred to your salary account\n\n  4. 4.After the stay\n\n    • Letter of Confirmation to confirm the duration of your stay at the host institution\n      (template will be sent automatically by e-mail)\n    • EU-Survey\n      (invitation to participate will be sent automatically by e-mail)\n    • Business trip statement\n      (Erasmus+ funding is settled as a lump sum, however, a business trip statement must still be created as a \"0-cost\" statement)\n\nFor further information and questions, please contact:\n\nCharlotte Schaetzky  -  Your contact for staff mobility for training and further education purposes (STT)\n\nTo top"}, {"id": "P03", "query": "Sustainable business trips", "description": "Which sustainability principles apply to university business trips?", "narrative": "Relevant documents describe the university's principles for climate-friendly business travel.", "title": "Erasmus+ personal mobility for teaching purposes (STA) - UNI", "url": "https://www.uni-kassel.de/uni/en/international/going-abroad/research-and-teaching-abroad/erasmus-personal-mobility-for-teaching-purposes-sta.html", "text": "Erasmus+ personal mobility for teaching purposes (STA)\n\nErasmus+ enables employees at the University of Kassel to spend time teaching at European partner universities. The University of Kassel has bilateral agreements with a number of European partner universities as part of the personal mobility for teaching purposes scheme.\n\nYou also have the opportunity to complete a period of teaching abroad at a selected international partner university as part of the Erasmus+ worldwide scheme.\n\nYou can find general information about the Erasmus+ programme here.\n\n  • Ongoing professional and personal development for lecturers\n  • To promote cooperation between the University of Kassel and its European partner universities \n  • Offering students, who cannot take part in any mobility programme, the opportunity to continue their international studies through the expert knowledge of lecturers from European partner universities (\"internationalisation at home\")\n  • Enhancing the content of the teaching materials and the specialist exchange and strengthening the cooperation with international colleagues\n  • Developing joint study programmes and exchanging teaching materials and methods\n\nPeople eligible for funding\n\n  • Professors and lecturers with a contractual relationship with the University of Kassel\n  • Part-time teaching staff with service contracts\n  • Emeritus professors and retired teaching staff\n  • Research assistants\n  • Personnel from foreign companies and organisations (can be invited to German universities for teaching purposes)\n\nLength of time and scope of teaching\n\n  • The teaching periods must involve at least 8 teaching hours per week or stay or 4 hours + 4 hours curriculum development\n  • The minimum duration is 2 days\n  • and the maximum possible period for financial support is 5 working days.\n  • Exceptions are possible and should be discussed with the Erasmus coordinator.\n\nAgreement with the host institution\n\n  • Bilateral agreement with the host institution which involves an agreement covering the planned teaching period is obligatory.\n  • Bilateral agreements may be concluded at short notice. Please contact the Erasmus coordinator at the International Office regarding this.\n\nReceiving funding more than once\n\n  • It is possible to receive funding more than once.\n\nThe calculations for your financial compensation do not take place according to the Hesse Travel Expenses Act, but using the EU’s allowances, which are dictated by the different costs of living in the destination countries.\n\nThe following set daily rates apply to four country groups.\n\nFunding is only available for days when activities have taken place that are related to your mobility scheme. The definitive evidence is provided by a certificate issued by the host institution/company at the end of your stay with the starting and finishing dates, including the number of classes taught. \n\nTravel expenses can be added to these daily rates, depending on the actual distance between your starting and finishing point; they can be determined in a standard fashion across Europe using a calculation tool.\n\nThe following amounts are repaid, depending on your stay and the distance involved:\n\nDistance for a single journey according to the distance calculatorAmount (average costs) per person involved\n(= return trip)\t\tGreen Travel*\n10 - 99 KMEUR 28EUR 56\n100 - 499 KM  EUR 211EUR 285\n500 - 1.999 KM  EUR 309EUR 417\n2.000 - 2.999 KM  EUR 395EUR 535\n3.000 - 3.999 KM  EUR 580EUR 785\n4.000 - 7.999 KM  EUR 1.188EUR 1.188\n8.000 KM und mehr  EUR 1.735EUR 1.735\n\n \n\n \n\n \n\n \n\n \n\n \n\n*Green travel: \"Green travel\" or \"environmentally friendly travel\" refers to travel \"where low-emission means of transport are used for the majority of the journey, such as bus, train, bicycle or carpooling\". Participants to whom this applies will receive the higher travel allowance (see table above) and possibly up to 4 additional travel days (depending on the distance to the host institution). If you travel \"green\", you can indicate this in the online application and declare it on your honor (proof of travel does not have to be submitted but must be kept and submitted in the event of a random sample).\n\n \n\nInterrail Pass\nErasmus scholarship holders have the opportunity to purchase a discounted Interrail Pass. This is valid for 6 months and can be used for the outward and return journey, as well as trips in the host country and neighboring countries. Information and tickets are available here.\n\nThere are the following 2 variants:\n\nFour-day pass\n. Adult (28+) Pass 1st class - 321 euros\n. Adult (28+) Pass 2nd class - 265 euros\n\nSix-day pass\n. Adult (28+) Pass 1st class - 455 euros\n. Adult (28+) Pass 2nd class - 376 euros\n\n \n\nReal cost applications for additional financial support for employees with fewer opportunities\n\nUniversity employees who are planning to go abroad with a child/children, or do have a degree of disability of at least 20 or a chronic illness (resulting in additional financial needs abroad) can apply for additional financial support (confirmation of funding under the Erasmus program must be given).\n\nIn addition, if you have already been selected for mobility, you have the option of applying for and undertaking a preparatory trip in advance in order to familiarize yourself with the local conditions.\n\nPlease note that applications must be submitted at least 2 months before the start of your stay. Therefore, please contact us as early as possible!#\n \n\nExceptional costs for expensive travel\nIf the travel allowance according to the distance category does not cover at least 70% of the actual travel costs, participants can be reimbursed for 80% of the actual costs of their travel.\n\nThe application must be justified by the applicant and approved by the national agency.\n\nApplication and selection procedure\n\nStep 1: Establishing contact with the host institution\nEach participant must make contact with the host institution of their choice on their own initiative and discuss the planned visit. Registration for any funding through Erasmus+ can only take place after written acceptance has been received from the institution receiving you. You may enquire about the availability of funds at the International Office at the University of Kassel before making contact with the host institution.\n\nStep 2: Registering \nCompleting the online application form.\n\nStep 3: The International Offices contacts you\nThe participant will receive a binding response from the International Office by e-mail. This e-mail also contains all the necessary documents and information about the ongoing procedure.\n\nStep 4: Submitting the necessary documents \nThree documents have to be submitted prior to any period of mobility: the grant agreement, learning agreement and an application to make a business trip.\n\nImportant: All employees and civil servants, according to current case law, require an A1 / E101 certificate as soon as they operate on a cross-border basis within the EU, the EEA, Switzerland or in one of the countries with which a bilateral agreement has been established. More information can be found here. Questions are answered by the Human Resources Department (Abteilung Personal und Organisation).\n\nStep 5: Disbursement of the financial subsidies\nAs soon as all the documents have been received, the financial subsidy is transferred to the account of the person receiving the funding in a lump sum.\n\nConfirmation of the length of time spent abroad\nEach person receiving funding must have the length of time spent abroad confirmed by a so-called letter of confirmation; this is completed by the host institution.\n\nWriting a report\nFinally, each person receiving funding will receive an e-mail from the European Commission with a request to complete a questionnaire (EU survey).\n\nAccounts for travel on official university business \nNo claim for travel expenses has to be handed in.\n\nFor further information and questions, please contact:\n\nCharlotte Schaetzky  -  Your contact for staff mobility for teaching purposes (STA)"}, {"id": "P04", "query": "Softwarelizenz selbst kaufen", "description": "Darf ich eine Softwarelizenz selbst im Internet kaufen und mir später erstatten lassen?", "narrative": "Relevant sind Vorgaben zur Beschaffung von Software außerhalb von Campus- und Rahmenverträgen.", "title": "FAQ – häufig gestellte Fragen - FORSCHUNG - Uni Kassel", "url": "https://www.uni-kassel.de/forschung/forschungsdatenmanagement/faq", "text": "FAQ – häufig gestellte Fragen\n\nInhalt\n\nInformationsquellen zum Forschungsdatenmanagement\n\nSie haben Interesse an aktuellen Informationen zum FDM in Kassel, zu Veranstaltungen, Diensten, Beschlüssen etc.? Wir haben ein paar hilfreiche Informationsquellen für Sie:\n\nEinführung und Hintergründe\n\nForschungsdaten sind alle Daten, die im Laufe eines wissenschaftlichen Prozesses erzeugt, bearbeitet oder genutzt werden oder dessen Ergebnis sind. Forschungsdaten können je nach Wissenschaftsdisziplin in unterschiedlichen Formaten vorliegen.\n\nForschungsdatenmanagement ist der Prozess, in dem die Erzeugung, Verwaltung und Sicherung dieser Daten beschrieben bzw. geplant wird. Es umfasst alle Bereiche der Datenverwaltung, insbesondere die Planung der Datenerhebung, die Erzeugung und Aufbereitung der Daten, die Datenintegrität, ihre Dokumentation und nachhaltige Aufbewahrung sowie die Zugänglichmachung der Daten. Entwickelt und dokumentiert wird dieser Prozess mit Hilfe eines Datenmanagementplans, der Teil eines jeden Forschungsvorhabens ist bzw. sein sollte.\n\nDer Datenmanagementplan ist ein „lebendes Dokument“, das zunächst das zentrale Planungswerkzeug für das Datenmanagement im Forschungsprojekt darstellt und sich im Projektverlauf zum Projektdokumentationswerkzeug entwickelt.\n\nEin gutes Forschungsdatenmanagement (FDM) ist die Grundlage für vertrauenswürdige, transparente und nachhaltige Forschung. Es unterstützt Forschende dabei, ihre Ergebnisse langfristig nachvollziehbar, sicher und nachnutzbar zu machen.\n\nFDM hilft dabei, …\n\n  • Datenverlust zu vermeiden: Durch regelmäßige Backups, redundante Speicherorte und die Nutzung geeigneter Dateiformate bleibt Ihre Arbeit langfristig gesichert.\n  • Missbrauch und Fehlinterpretationen zu verhindern: Eine strukturierte Dokumentation und klare Zugriffsregeln gewährleisten Datenintegrität und Verantwortlichkeit.\n  • Nachvollziehbarkeit und Nachnutzung zu ermöglichen: Gute Dokumentation und aussagekräftige Metadaten stellen sicher, dass auch andere Forschende Ihre Daten korrekt verstehen und weiterverwenden können.\n\nEin systematisches FDM beginnt bereits in der Planungsphase eines Projekts. Wer frühzeitig festlegt, wie Daten erhoben, beschrieben, gespeichert und geteilt werden, profitiert von effizienteren Arbeitsprozessen, besserer Auffindbarkeit und höheren Chancen auf Anschlussforschung.\n\nDarüber hinaus ist FDM heute oft verpflichtend: Forschungsförderer, Hochschulen und Fachzeitschriften verlangen zunehmend Datenmanagementpläne oder Nachweise zur Datenverfügbarkeit. Prüfen Sie daher die spezifischen Anforderungen Ihres Fachs, Ihrer Institution oder Ihres Drittmittelgeber, Informationen finden Sie u.a. hier: \n\nForschungsdaten-Leitlinie der Uni Kassel\n\nDFG-Kodex: Leitlinien zur Sicherung guter wissenschaftlicher Praxis (Stand: September 2024 / korrigierte Version 1.2)\n\n \n\nStruktur, Formate und Dokumentation\n\nIm Arbeitsprozess entstehen oft nicht nur eine Vielzahl von Datensätzen, sondern durch verschiedene Modifizierungsstufen auch jeweilige Versionen. Mit Blick auf ein effizientes Arbeiten, koordinierte kollaborative Arbeitsprozesse, die langfristige Nachvollziehbarkeit und ggf. interne oder externe Nachnutzbarkeit empfiehlt sich die Festlegung spezifischer Konventionen zur Benennung und Versionierung von Datensätzen. Gegebenenfalls kann es sinnvoll sein, zusätzlich Ordnerstrukturen nach Prozessierungsgrad zu definieren. Die Konventionen sollten wiederum dokumentiert werden.\n\nNamenskonventionen können abhängig von den Spezifika der Forschungsbereiche und Daten sehr unterschiedlich aussehen. Sie sollten widerspiegeln, um welche Art der Datendateien (Originaldaten / Rohdaten, bereinigte Dateien, Analysedateien) bzw. welche Dateiform (Arbeitsdatei, Ergebnisdatei etc.) es sich handelt. Diese Differenzierung kann auch über Versionierungskonventionen geschehen. Wichtig sind Einheitlichkeit, Eindeutigkeit und Aussagekraft .\n\nBeispiele für sprechende Dateibenennungen sind etwa:\n\n  • [Sediment]_[Probe]_[Instrument]_[YYYYMMDD].dat\n  • [Experiment]_[Reagens]_[Instrument]_[YYYYMMDD].csv\n  • [Experiment]_[Versuchsaufbau]_[Versuchsperson]_[YYYYMMDD].sav\n  • [Beobachtung]_[Ort]_[YYYYMMDD].mp4\n  • [Interviewpartner]_[Interviewer] ]_[YYYYMMDD].mp3\n\nUm die Kompatibilität zwischen verschiedenen Betriebssystemen zu gewährleisten, sollte auf Sonderzeichen (außer Unter- und Bindestriche) sowie auf Umlaute verzichtet werden.\n\nIn den verschiedenen Modifikationsstadien (z.B. Originaldaten, bereinigte Daten, analysefähige Daten) sollten schreibgeschützeVersionen erstellt werden. Weitere Bearbeitungen sollten nur in Kopien dieser Master-Dateien vorgenommen werden.\n\nEin bekanntes Konzept der Versionierung , das auf dem DDI-Standard (Data Documentation Initiative) basiert, lautet:\n\nAusgehend von der Version \"v1-0-0\" werden dabei geändert:\n\n1. die erste Stelle, wenn mehrere Fälle, Variablen, Wellen oder Sample hinzugefügt oder gelöscht wurden\n\n2. die zweite Stellen, wenn Daten korrigiert werden, so dass die Analyse beeinflusst wird\n\n3. die dritte Stelle, wenn einfache Überarbeitungen ohne Bedeutungsrelevanz vorgenommen werden\n\nKonventionen sollten immer den fach- bzw. projektspezifischen Bedürfnissen angepasst werden. Stehen Versionen z.B. nicht in linearer Beziehung zueinander, können über spezielle Metadatenschemata (etwa das DataCite Metadata Schema) Beziehungen definiert werden (\"IsDerivedBy\", \"IsSourceOf\")\n\nVersionierung kann auch durch entsprechende Software (z.B. Git) unterstützt werden.\n\nEine Datenpublikation entfaltet ihr volles Potential, wenn die Forschungsdaten in Dateiformaten veröffentlicht werden, die zum einen eine möglichst uneingeschränkte Nachnutzung erlauben und zum anderen möglichst langzeitstabil sind. Aus beiden Gesichtspunkten werden offene, nicht-proprietäre Dateiformate empfohlen: Offene Dateiformate können von verschiedenen Programmen gelesen werden und sind nicht von einer bestimmten Software abhängig, so dass eine Nachnutzung in unterschiedlichen IT-Umgebungen (etwa Betriebssysteme, Softwarelizenzen, gängige Programme) möglich ist.\n\nDiese Übersicht über geeignete Dateiformate empfiehlt in diesem Sinne konkrete Dateiformate für die Datenpublikation.\n\nAnhand von Metadaten werden Ressourcen, in diesem Fall Forschungsdaten, beschrieben, um ihre Auffindbarkeit zu optimieren. Zu den basalen Informationen gehören beispielsweise Titel, Autor/Primärforscher, Institution, Identifier, Ort & Zeitraum, Thema, Rechte, Dateinamen, Formate etc. Da diese Informationen für das Auffinden, das Verständnis und die Nutzung von Daten essentiell sind, sollen standardisierte Metadatenschemata eine möglichst einheitliche und nachvollziehbare Beschreibung sicherstellen.\n\nMetadatenschemata sind Zusammenstellungen von Elementen zur Beschreibung von Daten. Einige Disziplinen verfügen bereits über spezifische Metadatenschemata, wie etwa\n\nVor Beginn der Dokumentation Ihrer Daten, bestenfalls bereits im Rahmen eines Datenmanagementplans, sollten Sie daher prüfen, ob für Ihre Disziplin bereits ein passendes Metadatenschema existiert. Informationen hierzu bietet z.B. das Digital Curation Center (DDC). Sollte kein fachspezifisches Schema zur Verfügung stehen, kann auch ein disziplinunabhängiges, wie etwa Dublin Core, MARC21 oder RADAR. genutzt werden.\n\nMetadatenschemata legen also fest, welche Informationen geliefert werden sollen. Für eine bestmögliche Suche und Nutzung der Daten ist es darüber hinaus wichtig, diese Informationen in einem möglichst einheitlichen Format zu geben. Hierfür stehen eine Reihe disziplinspezifischer und –übergreifender sog. ‚kontrollierter Vokabulare‘, Thesauri, Klassifikationen und Normdaten zur Verfügung, wie etwa:\n\nEinen Überblick über verschiedene Systeme bieten z.B. das Basel Register of Thesauri, Ontologies & Classifications (BARTOC) und Taxonomy Warehouse.\n\nEine Dokumentation geht in der Regel über die Beschreibung der Daten via Metadaten hinaus. Sie stellt eine tiefere (fachwissenschaftliche) Erschließung dar, in deren Rahmen z.B. Entstehungskontext, Variablen, Instrumente, Methoden etc. ausführlich beschrieben werden. In vielen Fällen ist eine solche Beschreibung unerlässlich, um die Daten verstehen, nachprüfen und ggf. nutzen zu können.\n\nEinführungen ins Thema Metadaten bieten z.B. der JISC Guide oder der interaktive Mantra-Kurs der Universität Edinburgh.\n\nDatenpublikation\n\nDie Veröffentlichung Ihrer Daten bietet für das Wissenschaftssystem, aber auch für Sie persönlich Vorteile.\n\nVeröffentlichte Daten stehen zur Nachnutzung in neuen Kontexten, z.B. auch für interdisziplinäre Fragestellungen oder Meta-Analysen zur Verfügung. Hierdurch können nicht nur wissenschaftliche Mehrwerte geschaffen, sondern auch Doppelarbeit vermieden und Kosten gespart werden.\n\nDurch die Vergabe von dauerhaften Identifikatoren sind Ihre Daten für Sie selbst und andere dauerhaft referenzierbar und zitierfähig. Dies ist eine Voraussetzung dafür, dass Datenpublikationen als eigenständige Leistung gewürdigt werden und ins wissenschaftlichen Reputationssystem Eingang finden können. Eine Studie von Piwowar und Vision (2013) zeigt außerdem die höhere Zitationsrate von Publikationen, bei denen die zugrunde liegenden Forschungsdaten veröffentlicht wurden.\n\nNicht zuletzt erfüllt die Veröffentlichung in einigen Fällen schlicht  Anforderungen Dritter. Neben den Anforderungen von Forschungsförderern fordern auch Publikationsdienstleister vermehrt die Bereitstellung derjenigen Forschungsdaten, die einer Publikation zugrunde liegen. Einige Beispiele für solche Vorgaben sind:\n\nDie Veröffentlichung Ihrer Daten kann auf verschiedenen Wegen geschehen:\n\n  • Disziplinspezifische Datenrepositorien und –zentren (↗Wie finde ich ein passendes Repositorium?). Dies stellt in der Regel die beste Lösung dar.\n  • Disziplinübergreifende Repositorien wie Zenodo, Dryad oder figshare. Diese Repositorien bieten meistens eine sogenannte Bitstream-Preservation, d. h. die Dateien werden aufbewahrt, wie sie sind, aber nicht nach archivischen Standards gepflegt (z. B. auf neuere Dateiformate aktualisiert). Disziplinübergreifend steht auch das Repositorium der Universität Kassel zur Verfügung (siehe hierzu \"Daten archivieren und publizieren\").\n  • Datensupplemente von Fachzeitschriften, z. B. bei Nature. Teilweise werden bei einer Veröffentlichung als Supplement die Rechte an den Daten an die Verlage übertragen (je nach Veröffentlichungsvertrag). \n\nIn Datenzeitschriften wie z.B. GigaScience, Earth System Science Data oder Journal of Chemical and Engineering Data (Liste von Data Journals) werden keine Daten selbst, sondern deren Beschreibung– keine Interpretation – veröffentlicht (Dokumentation oder Data-Curation-Profiles). Dies trägt nicht zuletzt der Tatsache Rechnung, dass traditionelle Artikel für die – wichtige und wertvolle – Datenbeschreibung kaum Raum bieten.\n\nEs gibt sowohl fachspezifische bzw. thematische wie auch generische Repositorien. Fachrepositorien und -datenzentren (wie etwa Pangaea für geowissenschaftliche Daten, GenBank, Protein Data Bank) stellen nicht zuletzt mit Blick auf die Sichtbarkeit in der Fachcommunity aber auch hinsichtlich der Konformität zu fachspezifischen Standards häufig die erste Wahl dar. Eine Übersicht über Fachrepositorien bietet die Registry of research data repositories (re3data.org) sowie das Open Access Directory zu Forschungsdaten. Eine gezielte Suche nach Fachrepositorien, die auch eine Datenablage erlauben, bietet der auf re3data basierende Repository Finder.\n\nBei der Entscheidung für ein bestimmtes Repositorium können Ihnen folgende Punkte helfen:\n\n  • Handelt es sich um ein fachlich passendes Repositorium? Ist es etabliert und an spezifische Suchportale angebunden?\n  • Bietet das Repositorium die gewünschten Services (PIDs, Open Access, differenzierte Zugriffsrechte (z. B. Nutzungsverträge), Realisierung von Embargo-Fristen)?\n  • Ist die Nachhaltigkeit des Repositoriums gewährleistet? Gibt es eine Exit-Strategie bzw. eine Übereinkunft zur Erhaltung der Daten bei z. B. Wegfall der Finanzierung?\n  • Wie sind Datenüberlassung und Datennutzung inhaltlich und formal geregelt?\n\nDie Universität Kassel stellt außerdem allen Forschenden, die kein fachspezifisches Repositorium nutzen können oder möchten, ein institutionelles Repositorium (DaKS) zur Verfügung, das sowohl die Funktion der Archivierung als auch der Publikation erfüllt (siehe auch \"Daten archivieren und publizieren\"). Dieses kann auch für studentische Projekte und Abschlussarbeiten genutzt werden\n\nDarüber hinaus stehen fachübergreifende Repositorien für Forschungsdaten wie das EU-geförderte ZENODO, Dryad oder figshare zur Verfügung.\n\nZunächst ist es wichtig, dass die Daten in einem geeigneten Format vorliegen. Einige Repositorien machen hier strengere Vorgaben, andere sprechen lediglich Empfehlungen aus oder sind offen für alle Formate. Umso wichtiger ist es, diesbezügliche Überlegungen bereits im Vorfeld der Forschung anzustellen. Allgemeine Hinweise und spezifische Links zu Formaten finden Sie unter ↗Welche Dateiformate sind sinnvoll?\n\nDamit Daten gefunden und sinnvoll genutzt werden können, müssen sie durch Metadaten genauer dokumentiert sein. Beachten Sie hierzu bitte die detaillierten Hinweise unter ↗Was sind Metadaten, Metadatenschemata und Dokumentationen?\n\nEin Upload in ein Repositorium bedeutet nicht automatisch eine sofortige Veröffentlichung. Unter Umständen können Gründe für eine Embargo-Frist oder eine Teilveröffentlichung sprechen. Gerade in wirtschaftsnahen Forschungsdisziplinen sind Embargos für Forschungsergebnisse üblich. Bedenken Sie deshalb, ob gewichtige Gründe gegen eine sofortige Veröffentlichung sprechen. Siehe hierzu ↗Spricht etwas gegen eine Veröffentlichung?\n\nÜberlegen Sie außerdem, unter welchen Bedingungen Sie Ihre Daten veröffentlichen wollen. Hierzu existieren verschiedene Lizenzmodelle (↗Welche Lizenz soll ich wählen?). \n\nIn vielen Repositorien durchlaufen Ihre Datensätze eine Kuration, bevor sie veröffentlicht bzw. im Repositorium angenommen werden. Dabei werden u. a. die oben genannten Aspekte überprüft und Sie erhalten möglicherweise Verbesserungsvorschläge oder Vorgaben. Einen Überblick über die Kuration in DaKS bietet die Publikation \"Kurationsempfehlungen für HeFDI-Repositorien\". \n\nDas Hochladen Ihrer Daten ist nicht mit dem freien Zugriff gleichzusetzen. Grundsätzlich können Sie Forschungsdaten auch verzögert publizieren oder lediglich die Metadaten zugänglich machen. Im Falle einer tatsächlichen Veröffentlichung können Sie über die Lizenz oder Verträge die Rechte auf Zugriff und Bearbeitung detailliert regeln (↗Kann ich die Nutzung meiner Daten dann überhaupt kontrollieren?). Diese Möglichkeiten können im Wesentlichen beschränkt werden durch:\n\n  • die spezifische Anforderungen und Policies Ihrer Forschungsförderer und/oder Verleger\n  • fehlende/begrenzte Rechte an den Daten\n  • Datenschutzrechtliche Einschränkungen\n  • Einschränkungen auf Seiten des Repositoriums\n\nEs gibt Konstellationen, unter denen eine Veröffentlichung der Daten nicht oder nur unter bestimmten Bedingungen erfolgen sollte. Wichtigste Voraussetzung für eine Veröffentlichung ist, dass Sie über das Recht hierzu verfügen (↗Wer darf über die Weitergabe und Veröffentlichung von Daten entscheiden?Besitze ich das Urheberrecht an meinen Daten?).\n\nZum anderen kann es sich um vertrauliche, personenbezogene Daten handeln, die nur nach Anonymisierung oder mit Einverständnis der Betroffenen veröffentlicht werden dürfen (↗Welche datenschutzrechtlichen Beschränkungen muss ich beachten?).\n\nRechtliche Aspekte\n\nRechtliche Fragen helfen, Missverständnisse und Konflikte zu vermeiden. Wer früh klärt, wie mit den Daten verfahren werden darf, beispielsweise was in welcher Form veröffentlicht werden darf, spart später viel Aufwand. Besondere Aufmerksamkeit kommt hierbei dem Datenschutz zu, die Einhaltung der DSGVO ist unumgänglich.\n\nEs gelten vor allem das Urheberrecht und die Datenschutz-Grundverordnung (DSGVO), jedoch können im Einzelfall viele weitere Gebiete betroffen sein (Patentrecht, das sogenannte Nagoya-Protokoll, Lizenzrechte u.v.m.). Dazu kommen ggf. Regeln aus Hochschul- oder Förderverträgen, sowie Kooperationsverträge. Diese Gesetze und vertraglichen Bestimmungen bestimmen, wer welche Daten nutzen oder weitergeben darf. Bei Unsicherheiten helfen der Forschungsdaten-Service, die Datenschutzbeauftragten oder das juristische Fachpersonal der Universität.\n\nDatenschutz-Grundverordnung (DSGVO)\nJuristisches Fachpersonal der Universität Kassel\n\nPersonenbezogene Daten sind Informationen, die sich auf eine Person beziehen, z. B. Name, Stimme, Adresse sowie ganze Interviews oder Gruppenbeobachtungen. Solche Daten dürfen nur unter Auflagen verarbeitet werden. Es muss eine rechtliche Grundlage bestehen, meist durch eine informierte Einwilligung. Vor der Weitergabe müssen sie in der Regel anonymisiert oder pseudonymisiert werden. Bei sogenannten besonderen kategorien personenbezogener Daten (u.A. ethnische Herkunft, politische Überzegungen, biologische Proben) oder falls vulnerable Gruppen wie Schulkinder betroffen sind, muss auch die Ethikkommission einbezogen werden. Außerdem muss immer ein sogenanntes Verzeichnis der Verarbeitungstätigkeiten erstellt werden, bei dem auch die technische Sicherheit der Daten in den Blick genommen wird. Hierbei unterstützen die Datenschutzbeauftragten der Universität.\n\nDatenschutzbauftragte der Universität Kassel\nEthikkommissionen der Universität Kassel\n\nMögliche Besitzer oder Mitbesitzer der Rechte an den Daten sind die Forschenden, der Arbeitgeber, der Auftraggeber, Forschungsförderer und/oder (privatwirtschaftliche) Vertragspartner. Wer über die Weitergabe oder Veröffentlichung von Forschungsdaten mitentscheiden darf oder gefragt werden muss, bestimmt sich über die Vertragsverhältnisse. Üblicherweise sind Ergebnisse weisungsgebundener Forschung Eigentum des Arbeit- bzw. Geldgebers. Anders verhält es sich bei eigener Forschung, über deren Daten Forschende selbst bestimmen dürfen. Zudem gibt es Ausnahmen, bei denen nicht frei entschieden werden darf, z.B.: personenbezogene Daten, Daten die der Exportkontrolle unterliegen, Geschäftsgeheimnisse oder Standorte von gefährdeten Arten.\n\nForschungsobjekte und vereinzelt auch Forschungsdaten können als Werk im Sinne des Urhebergesetzes geschützt sein. Das können sein Sprachwerke, Computerprogramme, Musikwerke, Pantomimische Werke einschließlich Werke der Tanzkunst, Werke der bildenden Künste einschließlich der Werke der Baukunst und der angewandten Kunst, Lichtbildwerke, Filmwerke und Darstellungen wissenschaftlicher und technischer Art. \n\nIn der Regel fehlt Forschungsdaten aber die notwendige Schöpfungshöhe und sie sind keine Werke. In Betracht kommt aber, dass bestimmte Arten von Forschungsdaten unter ein Leistungsschutzrecht fallen, zum Beispiel Lichtbilder, Laufbilder oder Tonträger.\n\nOft sind die Forschungsdaten eines Forschungsvorhabens aber als Teil eines Datenbankwerks urheberrechtlich geschützt oder fallen unter das Leistungsschutzrecht für Datenbanken.\n\nForschungsdaten, die nicht unter ein Schutzrecht fallen, können in der Regel von jedermann ohne eine Genehmigung oder Zahlungsverpflichtung zu jedem beliebigen Zweck verwendet werden. \n\nWichtig ist, dass dabei trotzdem die Verpflichtung zur Offenlegung der Herkunft und zur korrekten Zitation besteht.\n\nZuerst sei gesagt, dass unabhängig davon, ob Urheber- oder andere Rechte an den Daten überhaupt bestehen, es nach der guten wissenschaftlichen Praxis die Pflicht jeder Person, die Daten anderer nachnutzt ist, die Herkunft der Daten transparent darzulegen und Sie entsprechend zu zitieren.\n\nDarüber hinaus gilt: Sofern Sie ein Urheberecht oder Leistungsschutzrecht über Forschungsdaten besitzen, können Sie verschiedene Aspekte der Nutzung über entsprechende Verträge regulieren, wie etwa Art und Weise der Nutzung, Nutzergruppen und –zeitraum, Zweck etc. Da vertragliche Einzelfallregelungen praktisch sehr aufwendig wären, existieren verschiedene Lösungen der standardisierten Regelungen von Nutzungsrechten. So bietet beispielsweise das Leibniz-Zentrum für Psychologische Information und Dokumentation (ZPID) Standardverträge für die Nutzung der psychologischen Daten und GESIS regelt über Nutzungsverträge die Zugangsbeschränkungen für besonders sensible sozialwissenschaftliche Daten. Wenn Ihre Daten keiner spezifischen Zugriffs- oder Nutzungsbeschränkung unterliegen sollen, bietet sich die Verwendung standardisierter Lizenzen wie Creative Commons oder Open Data Commons an.\n\nDie Veröffentlichung von Daten unter einer bestimmten Lizenz erlaubt eine detaillierte Festlegung der zulässigen Form ihrer Nutzung. Sie schaffen Rechtssicherheit sowohl auf Seiten der bereitstellenden als auch der nutzenden Person. Auch bei dem Verzicht auf jegliche Beschränkungen ist es daher wichtig, diesen zu formulieren.\n\nWenngleich Daten selbst in der Regel nicht dem Urheberrecht unterliegen, spricht doch einiges dafür, sie als potentiell schützenswert zu behandeln, nicht zuletzt um den eigenen Vorstellungen der Weiternutzung Ausdruck zu verleihen. Hierfür bieten sich verschiedene Lizenzmodelle an. Das verbreitetste unter ihnen ist ‚Creative Commons‘ (CC). CC-Lizenzen sind unabhängig vom lizenzierten Inhalt und decken Urheberrechte, Leistungsschutzrechte und in der aktuellen Version – sofern existent – auch Datenbankherstellerrecht ab.\n\nUnabhängig von Ihrer rechtlichen Verbindlichkeit erfüllt die Lizenz CC-BY die Idee von Open Access und Open Science sicherlich am ehesten, wogegen die ‚Weitergabe unter gleichen Bedingungen‘ zu Kompatibilitätsproblemen mit anderen Lizenzen, das Verbot von Bearbeitung zu Einschränkungen bei Nutzung durch z.B. Data-Mining oder auch zu Problemen bei der Langzeitarchivierung führen kann. Das Verbot kommerzieller Nutzung erschwert die Verwendung in kommerziellen Datenbanken und reduziert damit potentiell die Sichtbarkeit Ihrer Forschung (für Details vgl. Paul Klimpel, 2012).\n\nWelche Lizenz Sie auch wählen – Sie sollten eine bewusste und informierte Entscheidung treffen. Hilfreich sind dabei Tools wie der englischsprachige Licensechooser für CC Lizenzen oder der für Software.\nUnabhängig von den Nutzungsbedingungen gelten selbstverständlich die Regeln guter Wissenschaftlicher Praxis, die eine Angabe der Quelle verwendeter Daten fordern.\n\nFinden und Nutzen von Forschungsdaten\n\nNicht zuletzt durch die Vorgaben und Empfehlungen von Förderern, Verlagen und Institutionen zur Zugänglichmachung von Daten stehen zunehmend Forschungsdaten für die Nachnutzung zur Verfügung. Um geeignete Forschungsdaten für den eigenen Forschungsbereich zu finden, bieten oft einschlägige Angebote aus dem eigenen Fachgebiet die erste Anlaufstelle. Dies können institutionelle oder fachliche Repositorien oder auch Datenjournale sein (↗ Wie kann ich Daten veröffentlichen?). Repositorien können Sie – nach Fachgebiet aufgeschlüsselt – über den Repository Finder recherchieren. Eine – längst nicht erschöpfende – Liste von Datenjournalen finden Sie in dem Wiki forschungsdaten.org (↗ Data Journals).\n\nDarüber hinaus besteht auch die Möglichkeit, Daten mit Hilfe generischer Suchdienste über mehrere Repositorien hinweg zu recherchieren. Ein großer Nachteil dieser Suchdienste besteht darin, dass sie die detaillierten Metadatenschemata ihrer Quellen oft nicht adäquat abbilden können. Zudem unterscheiden sich die jeweiligen Metadaten stark dahingehend, was sie identifizieren, also einzelne Daten, Datensets oder –Sammlungen.\n\nZu den bekanntesten Portalen gehören:\n\n  • BASE - Bielefeld Academic Search Engine - Ruft Metadaten von Repositorien und Datenbanken über OAI-PMH ab. Forschungsdaten sind über die Dokumentart „Primärdaten“ zu finden.\n  • B2FIND - Durchsucht Metadaten aus verschiedenen Quellen wie CLARIN oder Global GBIF.\n  • DataCite Metadata Search - Durchsucht Metadaten von Informationsobjekten, u.a. Forschungsdaten (Objekttyp ‚Dataset‘), die bei DataCite mit DOIs registriert sind. Die Metadaten werden z.T. auch von den anderen beiden Diensten (BASE, B2FIND) abgefragt.\n  • OpenAIRE - Enthält frei zugängliche Forschungsergebnisse aus EU-geförderten Projekten.\n  • Google Dataset Search (proprietär!)\n  • gesisDataSearch - Suche von Daten zur Sozial- und Wirtschaftsforschung in Datenrepositorien und Metadatendiensten.\n  • VerbundFDB - Forschungsdaten Bildung  - Suche von Studien, Forschungsdaten und Instrumenten der empirischen Bildungsforschung.\n\nFür die Nachnutzung selbst sind die jeweiligen Rechte (Lizenzen, ggf. Nutzungsverträge) bindend. Sie können u.a. festlegen, wer die Daten zu welchem Zweck und für welche Zeit nutzen darf (↗ Rechtliche Aspekte).\n\nUm Forschungsdaten nachnutzen zu können, ist vor allem die Qualität der Daten entscheidend. Datenqualität im Forschungsdatenmanagement umfasst insbesondere folgende Bereiche:\n\n  • Datenformat (spezielle Speicherformate wissenschaftlicher Daten, wie z.B. Vektorformat, Rasterformat und Eigenschaftsformat, etc.)\n  • Datenvollständigkeit und Datenrichtigkeit\n\nDerzeit ist ein kostenfreier Prototyp des Leibniz Data Managers verfügbar, der hier exemplarisch für ähnliche Tools steht:\n\nLeibniz Data Manager ermöglicht die Visualisierung verschiedener Forschungsdatenformate, wodurch das 'Screening' von Datensätzen auf ihren potentiellen Nutzen möglich wird. Als Visualisierungs- und Management-Tool unterstützt es die Verwaltung und den Zugriff auf heterogene Forschungsdatenpublikationen, und somit die Forscherinnen und Forscher bei der Auswahl relevanter Datensätze für ihre jeweiligen Disziplinen.\n\nUm die (Nach-)Nutzung von eigenen und fremden Forschungsdaten im Sinne der Guten Wissenschaftlichen Praxis adäquat zu dokumentieren, ist eine korrekte Datenzitation unerlässlich.\n\nIm Falle von Fremddaten wird hierdurch außerdem die wissenschaftliche Leistung ihrer ‚Urheber‘ gewürdigt. Wie bei der Zitation von anderen Publikationen können die Konventionen zur Zitation von Daten formal abweichen. Inhaltlich verbindet sie jedoch der Anspruch einer eindeutigen Identifizierbarkeit der Datenquelle. Die FORCE11 Data Citation Synthesis Group hat Empfehlungen zur Datenzitation erarbeitet. Ihnen zufolge umfasst eine vollständige Datenzitation\n\nAutor(en), Jahr, Titel der Forschungsdaten, Datenrepositorium oder Archiv, Version, weltweit Persistenter Identifikator\n\nWeitere optionale Angaben, die im Rahmen einer Zitation sinnvoll sein können, sind Edition, Feature name and Uniform Resource Identifier (URI), Resource type, Publisher, Unique Numeric Fingerprint (UNF) und Location (vgl. Alex Ball & Monica Duke (2015). How to Cite Datasets and Link to Publications).\n\nSofern nicht anderweitig gekennzeichnet sind alle Texte dieser Seite und Ihrer Unterseiten lizenziert unter einer Creative Commons Namensnennung 4.0 International Lizenz."}, {"id": "P05", "query": "Rechnungsempfänger Universität Kassel", "description": "Wann muss die Universität Kassel als Rechnungsempfänger angegeben werden?", "narrative": "Relevant sind Anforderungen an den Rechnungsempfänger bei erstattungsfähigen Ausgaben.", "title": "Dienstreisemanagement - INTERN - Uni Kassel", "url": "https://www.uni-kassel.de/intern/interne-bereiche-der-abteilungen/personal-und-organisation/dienstreisemanagement.html", "text": "Dienstreisemanagement\n\nAktuelle Information\nMit dem Präsidiumsbeschluss 656 vom 21.07.2025 gelten Dienstreisen und Reisen zum Zwecke der Fortbildung im Inland mit einer Dauer von bis sieben Tagen  für Professorinnen und Professoren mit sofortiger Wirkung grundsätzlich qua Amt als genehmigt gem.  § 2 Abs. 1 Satz 2 Hessisches Reisekostengesetz. Bei Inlandsdienstreisen mit gleichartigen Dienstgeschäften an denselben Ort/denselben Bezirk mit einer Dauer von bis zu jeweils sieben Tagen kann durch die Dekaninnen/Dekane/den Rektor, durch die Leitungen der Zentralen Einrichtungen, der Wissenschaftlichen Zentren, der Abteilungen und Stabsstellen eine generelle Dienstreisegenehmigung ausgesprochen worden. Diese Genehmigung darf längstens für die Dauer von einem Jahr ausgesprochen werden.          Antrag auf Erteilung einer Generellen Dienstreisegenehmigung                                           Bitte beachten Sie hierzu auch das Merkblatt zur Erteilung genereller Dienstreisegenehmigungen.                                                                                             \n\nBitte nutzen Sie das Ticketsystem nur bei Fragen zu Dienstreisen, die in den FAQs nicht beantwortet werden konnten.\n\nOffene Sprechstunde\n\n\nJeden Dienstag von 10-11 Uhr\n\nEs ist keine Anmeldung notwendig. Loggen Sie sich bitte in den unten genannten Zoom-Meetingraum ein:\n\nInformationen\n\nFiori\n\nBei Neueinstellungen wird ein Fiori Zugang automatisch angelegt, so dass keine Beantragung mehr nötig ist. Dieser Zugang beinhaltet aber nur die Erstellung von eigenen Dienstreisen und Abrechnungen. Im Falle einer vorgesehenen Reiseassistenz, auch bei schon bestehenden Fiori Zugängen, muss diese ebenfalls über den Fiori Benutzerantrag beantragt werden. Die Einverständnsierklärung für die Reiseassistenz ist ebenfalls mit einzureichen.\n\nDa die meisten Hilfskräfte keine Dienstreisen unternehmen, erhalten diese nicht automatisch eine Berechtigung für die FIORI-App. Anträge auf Genehmigung einer Dienstreise sowie für die Erstattung von Reisekosten stellen Hilfskräfte bitte weiterhin in Papierform und fügen auch Belege in Papierform bei. Sollten Hilfskräfte in Ihrem Bereich regelmäßig bzw. öfter Dienstreisen unternehmen, besteht aber die Möglichkeit, einen FIORI-Zugang zu beantragen.\n\nWichtige Hinweise zu Ihrer Dienstreisegenehmigung\n\nBitte beachten Sie die wichtigen Hinweise zu Ihrer Dienstreisegenehmigung.\n\nWichtige Hinweise zu Ihrer Dienstreisegenehmigung: Mehr lesen\n\nEs wird darauf hingewiesen, dass Dienstreisen in die Russische Föderation, in die Ukraine, nach Belarus, Moldau- die Gebiete im Süden und Osten, die an die Ukraine grenzen, Niger, Iran, Israel, in die Palästinensischen Gebiete und Libanon bis auf Weiteres nicht genehmigt werden.\n\nAllgemeines zur Dienstreise\n\n  • Grundsatz: Für jeden Reisetag (inklusive An- und Abreise) wird die an diesem Tag geltende Sollzeit berücksichtigt. Wenn die Dienstzeit vor Ort inkl. der Fahrtzeit nicht ausreicht, um die Sollzeit zu erreichen, wird diese trotzdem für den Tag angerechnet. Der Tag wird mit also plus/minus Null berechnet.\n  • Dauert die Arbeit vor Ort länger als die Sollarbeitszeit, wird diese tatsächliche Zeit angerechnet (also nicht nur die Sollzeit).\n  • Praktische Umsetzung im Zeiterfassungssystem: Im Zeiterfassungssystem wird anfangs nur die reguläre Sollzeit erfasst. Wer zusätzliche Stunden vor Ort geleistet hat, muss sich bei der Abteilung Personal und Organisation unter zeiterfassung[at]uni-kassel[dot]de per E-Mail melden – diese bucht die zusätzlichen Zeiten manuell nach.\n  • Gehen Teilzeitbeschäftigte an einem ihrer freien Arbeitstage auf Dienstreise, gilt die Sollarbeitszeit analog den regulären Arbeitstagen. Die o. g. Regelungen gelten entsprechend.\n\nBitte fügen Sie jedem Dienstreiseantrag ein Einladungsschreiben, Programm etc. bei bzw. laden dieses im Fiori hoch.\n\nAlle Anträge sind vollständig auszufüllen. Dem Reiseantrag sind grundsätzlich alle Unterlagen (Programme, Einladungen) als Anlage beizufügen, aus denen das dienstliche Interesse sowie Ort und Dauer der Abwesenheit hervorgeht. Sollten Felder in den Anträgen für einige der Dienstreiseangaben nicht ausreichen, kann auch ein separates, formloses Schreiben mit einer kurzen Erläuterung beigelegt werden. Dies trägt zur schnelleren Bearbeitung des Antrages bei und vermeidet Missverständnisse und Rückfragen.\n\nReisen am Dienstort müssen in der Regel nicht genehmigt werden. Jedoch sollte die/der jeweilige Vorgesetze immer über Ihre Abwesenheit informiert werden, um Unfallversicherungsansprüche zu wahren.\n\nFahrten zwischen den Standorten der Universität Kassel sind generell genehmigt - Präsidiumsbeschluss 882.\n\n \n\nReisen zur Fortbildung sind Reisen, die Bedienstete nach Abschluss ihrer Ausbildung zur beruflichen Weiterbildung oder zur Erweiterung ihrer beruflichen Kenntnisse, Fähigkeiten und Erfahrungen, zur Anpassung an geänderte dienstliche Anforderungen oder zur Vorbereitung auf die Wahrnehmung neuer oder anderer Aufgaben unternehmen.\n\nKonferenzen und Tagungen die online durchgeführt werden, sind keine Dienstreisen im Sinne des Reisekostengesetzes. Daher ist in diesem Fall weder ein Dienstreiseantrag noch eine Reisekostenabrechnung im Fiori zu stellen. Die Teilnahmegebühren für Online Konferenzen / Tagungen sind über das Formular \"Privat Verauslagte Kosten\" bei der Finanzabteilung geltend zu machen.\n\nGrundsätzlich können Dienstreisen mit privaten Reisen verbunden werden. Hierfür gelten besondere Regelungen für die Kostenerstattung.\n\nDauert der Privataufenthalt weniger als oder genau 5 Arbeitstage, so wird die Reisekostenvergütung so festgesetzt, als habe nur die Dienstreise stattgefunden.\n\nFlugreisen\n\nBei Flugreisen ist dem Dienstreiseantrag ein Preisvergleich beizufügen. Daraus sollte hervorgehen, wie hoch die Kosten für einen Flug gewesen wären, wenn die Rückreise direkt nach Beendigung des Dienstgeschäftes angetreten würde.\n\nFür die Tage des Privataufenthaltes muss Erholungsurlaub oder Gleittage in Anspruch genommen werden, die entsprechend der arbeitsvertraglichen Vereinbarungen rechtzeitig auf dem Dienstweg zu beantragen sind. Ein (Dienst-)Unfallschutz besteht für die Zeit des Privataufenthaltes nicht.\n\nSollten Sie während des privaten Teils der Reise krank werden und sollen die Urlaubstage im Nachhinein wieder gutgeschrieben werden, so ist trotzdem § 14 Abs. 1 Satz 3 HRKG bzw. § 13 Abs. 1 Satz 3 BRKG anzuwenden.\n\nUm Missverständnisse zu vermeiden, bitten wir Sie in Ihrem und auch im Interesse der Universität Kassel, sich in der Planungsphase mit der zuständigen Reisekostensachbearbeitung in Verbindung zu setzen.\n\nGrundsätzlich können Dienstreisen mit privaten Reisen verbunden werden. Hierfür gelten besondere Regelungen für die Kostenerstattung.\n\nDauert der Privataufenthalt mehr als 5 Arbeitstage, wird der Reise ein überwiegend privater Hintergrund zuerkannt. Unerheblich ist hierbei, ob zuerst die Dienstreise oder die private Reise geplant war.\n\nIn diesem Fall dürfen nur die zusätzlichen Fahrtauslagen erstattet werden, die zur Ausübung des Dienstgeschäftes notwendig sind. Tage- und Übernachtungsgeld sowie sonstige Kosten (Nebenkosten) werden nur für die Dauer des Dienstgeschäftes und die Reisetage gewährt.\n\nUm Missverständnisse zu vermeiden, bitten wir Sie in Ihrem und auch im Interesse der Universität Kassel, sich in der Planungsphase mit der zuständigen Reisekostensachbearbeitung in Verbindung zu setzen.\n\nNach oben\n\nIn­for­ma­tio­nen rund um die Kos­ten\n\nReisekosten können nur für Dienstreisen und Reisen zur Fortbildung im dienstlichen Interesse erstattet werden, wenn diese vorher angeordnet oder genehmigt sind. Liegt keine Genehmigung vor, ist keine Abrechnung möglich!\n\nDas Reisekostenrecht beruht auf dem Erstattungsprinzip. Aus diesem Grund müssen entstehende Kosten von Ihnen verauslagt und mit der Reisekostenabrechnung gegenüber dem Arbeitgeber geltend gemacht werden.\n\nErstattungsfähig sind nur dienstlich veranlasste und zur Durchführung des Dienstgeschäfts notwendige Kosten.\n\nSofern die Kostenerstattung für eine Dienstreise nicht von dritter Seite erfolgt, kann auf Antrag ein Abschlag bis zur Höhe von 80% der zu erwartenden Reisekosten gezahlt werden. Dieser Abschlag wird allerdings nur dann angewiesen, wenn ein Betrag von 150 € überschritten wird. Die Beantragung kann bereits mit dem Genehmigungsverfahren erfolgen.\n\nDie Bearbeitungszeit für Abschlagszahlungen liegt bei ca. 10 Arbeitstagen. In dieser Zeit werden eventuelle Rückfragen geklärt und der Zahlvorgang durchgeführt. Abschlagszahlungen sind innerhalb von vier Wochen nach dem Ende der Dienstreise durch Vorlage der Reisekostenabrechnung abzurechnen. Andernfalls sind die Abschläge zurückzuzahlen.\n\nReisekostenerstattungen sind  innerhalb einer Frist von sechs Monaten nach Beendigung der Dienstreise zu beantragen. Maßgeblich ist das Eingangsdatum in der Reisekostensachbearbeitung.  Ausnahmen hiervon sind nicht zulässig.\n\nFür Reisekostenabrechnungen, die nach Ablauf dieser Frist eingereicht werden, kann keine Reisekostenerstattung mehr gewährt werden (Ausschlussfrist nach § 4 Abs. 5 HRKG / § 3 Abs. 1 BRKG).\n\nReisekostenerstattungen beantragen Sie über das ESS-System mit einer Reiseabrechnung.\n\nSämtliche Reisekostenanträge müssen, bevor die Abrechnung erfolgen kann, durch die entsprechende vorgesetzte Stelle sachlich-richtig-gezeichnet werden. Andernfalls kann keine Abrechnung erfolgen.\n\nBitte nutzen Sie das nachfolgende Formular (nach dem Abspeichern ausfüllbar) zur Umbuchung von Reisekosten auf eine andere Kostenstelle/einen anderen Auftrag.\n\nDas Formular muss vollständig ausgefüllt und unterschrieben per Hauspost an die Reisekostensachbearbeitung geschickt werden.\n\nAuf die Erstattung von Reisekosten kann ganz oder teilweise rechtswirksam verzichtet werden. Eine Reisekostenabrechnung ist damit ausgeschlossen.\n\nArt und Höhe der erstattungsfähigen Kosten richten sich nach dem Hessischen Reisekostengesetz (HRKG) in Verbindung mit den Verwaltungsvorschriften. Für Auslandsdienstreisen findet die Auslandsreisekostenverordnung (ARV) in Verbindung mit dem Bundesreisekostengesetz (BRKG) Anwendung.\n\nSämtliche entstandenen Reisekosten sind bei der Abrechnung durch entsprechende Belege nachzuweisen. Anfallende Nebenkosten (z. B. Taxi- und Telefonkosten etc.) können nur erstattet werden, sofern sie dienstlich notwendig und in der Reisekostenabrechnung entsprechend begründet werden.\n\nBelege sind ausschließlich im PDF Format in Fiori hochzuladen!\n\nFür die Anerkennung der Notwendigkeit von entstandenen Kosten wird ein strenger Maßstab angelegt.  Der oberste Grundsatz ist Sparsamkeit und Wirtschaftlichkeit. Im eigenen Interesse ist deshalb bereits bei der Planung einer Reise auf die Hinweise zur Abrechnung einer Dienstreise zu achten.\n\nDie auf den Rechnungen ausgewiesenen Verpflegungskosten für Mittag- uns Abendverpflegung werden im Rahmen von Reisekosten nur dann erstattet, wenn es sich nachweislich um eine notwendige Pauschale handelt (Tagungspauschale etc.). Ggf. sind der Reisekostenabrechnung entsprechende Nachweise beizufügen. In allen übrigen Fällen sind die Verpflegungskosten über das Tagegeld abgegolten.\n\nOhne Nachweis wird auf Antrag für jede notwendige Übernachtung ein pauschales Übernachtungsgeld von 20,00 € pro Nacht erstattet.\n\nNachgewiesene Übernachtungskosten sind bis zu einer Höhe von 80,00 € je Nacht erstattungsfähig. Darüber hinaus gehende Übernachtungskosten werden nur erstattet, wenn sie unvermeidbar waren. D. h. die Notwendigkeit ist im Einzelfall nachvollziehbar schriftlich bei Antragsstellung zu begründen.\n\nErfolgt keine Erklärung der Notwendigkeit, sind höchstens 80,00 € je Nacht erstattungsfähig!\n\nRechnungen für Übernachtungskosten werden nur erstattet, sofern die Universität Kassel als Adressat angegeben ist. Wenn die Übernachtungskosten die Kosten des Frühstücks einschließen, werden die Kosten für das Frühstück im Rahmen der Hotelkostenerstattung vollumfänglich erstattet. Von dem zustehenden Tagegeld werden für das erhaltene Frühstück 20% des Tagegeldes für einen vollen Kalendertag der Abwesenheit vom Dienst- bzw. Wohnort einbehalten.\nUm Rückfragen zu vermeiden und um eine schnellere Bearbeitung der Abrechnung zu ermöglichen, sollten Dienstreisende - sofern erforderlich - ihre Bemühungen, eine preiswerte Unterkunft zu bekommen, im Einzelnen dokumentieren (z. B. Ausdruck eines Onlineportals, Anfragen per E-Mail oder Fax) und diese der Abrechnung beifügen.\n\n \n\nOhne Nachweis wird auf Antrag für jede notwendige Übernachtung ein Übernachtungsgeld in Höhe von 50 % des in der ARV ausgewiesenen Betrages für das jeweilige Land, höchstens jedoch 30,00 € je Nacht erstattet.\n\nNachgewiesene Übernachtungskosten werden bis zu einer Höhe des in der ARV ausgewiesenen Betrages für das jeweilige Land erstattet. Darüber hinaus gehende Übernachtungskosten werden nur erstattet, wenn sie unvermeidbar waren. D. h. die Notwendigkeit ist im Einzelfall nachvollziehbar schriftlich bei Antragsstellung zu begründen.\n\nErfolgt keine Erklärung der Notwendigkeit, ist nur der jeweils geltende Satz je Nacht erstattungsfähig!\n\nRechnungen für Übernachtungskosten werden nur erstattet, sofern die Universität Kassel als Adressat angegeben ist. Grundsätzlich finden nur die reinen Übernachtungskosten ohne sonstige Leistungen (z. B. ausgewiesene Verpflegungskosten wie Frühstück) Berücksichtigung.\nUm Rückfragen zu vermeiden und um eine schnellere Bearbeitung der Abrechnung zu ermöglichen, sollten Dienstreisende - sofern erforderlich - ihre Bemühungen, eine preiswerte Unterkunft zu bekommen, im Einzelnen dokumentieren (z. B. Ausdruck eines Onlineportals, Anfragen per E-Mail oder Fax) und diese der Abrechnung beifügen.\n\nSollten Ihnen im Zusammenhang mit einer dienstlich veranlassten Reise Leistungen von einer anderen Stelle angeboten werden, bitten wir Sie um besondere Aufmerksamkeit!\n\nMit einer \"anderen Stelle\" ist jede natürliche oder juristische Person neben Ihnen und der Universität Kassel als Ihrer Arbeitgeberin/Dienstherrin gemeint. Als Leistungen von dritter Seite gelten nicht Drittmittel, die von der Universität Kassel verwaltet werden.\n\nAls Bedienstete des Landes Hessen ist es Ihnen gemäß den Verwaltungsvorschriften zur Korruptionsbekämpfung in der Landesverwaltung untersagt, folgende Leistungen anzunehmen:\n\n  • Bargeld\n  • Überlassung von Gegenständen (z.B. Kraftfahrzeugen, Geräten oder Maschinen zum Gebrauch) ohne oder zu einem geringeren als dem üblichen Entgelt,\n  • Gewährung von Leistungen (z.B. Überlassung von Fahrkarten, Eintrittskarten, Gutscheinen, Flugtickets, Unterkunft, usw.) ohne oder zu einem geringeren als dem üblichen Entgelt,\n  • Gewährung besonderer Vergünstigungen bei Privatgeschäften (z.B. zinslose oder zinsgünstige Darlehen, verbilligter Einkauf).\n\nIm Einzelfall kann die Zustimmung zur Annahme durch die erteilt werden. Um die Zustimmung zu erlangen, sind Sie verpflichtet, die für die Entscheidung maßgeblichen Umstände vollständig vor Antritt der Reise mitzuteilen.\n\nDie erhaltenen Leistungen von dritter Seite werden nach § 4 Abs. 3 HRKG bzw. § 3 Abs. 2 BRKG auf die zustehende Reisekostenerstattung angerechnet. Aus diesem Grund ist bei einer Reisekostenabrechnung anzugeben, welche Leistungen Sie erhalten haben.\n\nZu unterscheiden von diesen Leistungen sind Honorare.\n\nEin Honorar ist die Vergütung für eine (Dienst-)Leistung. Wird Ihnen im Rahmen einer Dienstreise ein Honorar (z.B. für einen Vortrag) gezahlt, deutet dies auf eine Nebentätigkeit und damit auf eine privat veranlasste Reise hin. Eine Dienstreisegenehmigung und nachfolgende Reisekostenabrechnung aus Landes- oder Drittmitteln der Universität Kassel ist dann grundsätzlich nicht möglich! Bitte setzen Sie sich mit der/dem zuständigen Sachbearbeiter/in in Verbindung.\n\nFür die Beantratung der Reisekosten Nichtbediensteter ist das folgende Formular zu verwenden.\n\nDas Formblatt ist vollständig ausgefüllt, rechnerisch- und sachlich-richtig-gezeichnet und unterschrieben direkt an die Finanzabteilung (Finanzbuchhaltung) zu schicken.\n\nEine Liste von Hotels finden Sie unter folgendem Link:\n\nHotelvereinbarungen (uni-kassel.de)\n\nNach einer Prüfung durch den Hessischen Landesrechnungshof ist es uns untersagt, Kosten, die für mehrere Personen verauslagt wurden, nur an die verauslagende Person zu erstatten. Sofern Sie den Betrag überweisen, müssten Sie sich die jeweiligen Anteile von den Kolleginnen direkt erstatten lassen. Die Kolleginnen müssen ihren Anteil selber zur Erstattung anfordern, unter Vorlage einer von Ihnen ausgestellten Quittung oder Kontoauszug bei bargeldloser Zahlung.\n\nNach oben\n\nIn­for­ma­tio­nen rund um Dienst­rei­sen im In­land\n\nFür Bedienstete der Universität Kassel besteht die Möglichkeit sich ein Fahrzeug aus dem Fuhrpark der Universität Kassel zu leihen. Da nur eine geringe Anzahl von Fahrzeugen zur Verfügung steht und die Nachfrage nach diesen sehr groß ist, empfiehlt es sich, unverzüglich nach Bekanntwerden des Dienstgeschäftes bei der zuständigen Stelle (Fahrbereitschaft) anzufragen.\n\nEs besteht eine Haftpflichtversicherung über die Selbstversicherung des Landes Hessen. Selbst verursachte Schäden am Fahrzeug werden der Kostenstelle des ausleihenden Bereichs belastet.\n\nEine Alternative hierzu bietet das Anmieten eines Mietfahrzeuges. Nähere Informationen erhalten Sie ebenfalls über die Fahrbereitschaft.\n\n  • Für die Benutzung eines privaten Kraftfahrzeugs wird als Wegstreckenentschädigung ein Betrag von 0,21 € je zurückgelegtem Kilometer erstattet. Beim Vorliegen triftiger Gründe für die Kfz-Nutzung und vorheriger Genehmigung werden 0,35 € für jeden zurückgelegten Kilometer erstattet.\n  • Eine Wegstreckenentschädigung gibt es auch für die Benutzung eines privaten zweirädrigen Kraftfahrzeuges (Motorrad, Mofa, usw.). Ohne triftigen Grund werden 0,15 €, mit triftigem Grund 0,18 € je Kilometer erstattet.\n  • Für die Benutzung eines Fahrrades werden 0,06 € je Kilometer erstattet.\n  • Für die Mitnahme von Dienstreisenden wird eine Mitnahmeentschädigung in Höhe von 0,02 € je Kilometer gewährt.\n  • Parkgebühren werden nur erstattet, wenn die Benutzung des privaten Kraftfahrzeugs aus triftigen Gründen vor Antritt der Dienstreise genehmigt wurde.\n\nFür Strecken, die aus triftigen Gründen mit einem nicht regelmäßig verkehrenden Beförderungsmittel zurückgelegt wurden, werden die notwendigen Kosten erstattet. Die triftigen Gründe müssen bei der Abrechnung der Reisekosten erläutert werden.\n\nLiegt kein triftiger Grund für die Benutzung eines Mietwagens oder Taxis vor, werden höchstens die Kosten erstattet, die beim Benutzen eines regelmäßig verkehrenden Beförderungsmittels (z. B. Bus oder Bahn) entstanden wären. Bitte legen Sie die Vergleichsrechnung, wenn möglich, bei. Die Erstattung nach § 5 Abs. 1 BRKG, d.h. 0,20 € Wegstreckenentschädigung bis maximal 130,00 €.\n\nFlugkosten kommen im Inland grundsätzlich nur in Betracht, wenn bei Benutzung eines anderen regelmäßig verkehrenden Beförderungsmittels höhere Kosten entstehen oder besondere dienstliche Gründe (wesentliche Einsparung von Arbeitszeit) vorliegen. Diese sind in einer Anlage zur Genehmigung der Dienstreise darzulegen.\n\nErstattungsfähig ist ausschließlich die Economy Class.\n\nOhne Nachweis wird auf Antrag für jede notwendige Übernachtung ein pauschales Übernachtungsgeld von 20,00 € pro Nacht erstattet.\n\nNachgewiesene Übernachtungskosten sind bis zu einer Höhe von 80,00 € je Nacht erstattungsfähig. Darüber hinaus gehende Übernachtungskosten werden nur erstattet, wenn sie unvermeidbar waren. D. h. die Notwendigkeit ist im Einzelfall nachvollziehbar schriftlich bei Antragsstellung zu begründen.\n\nErfolgt keine Erklärung der Notwendigkeit, sind höchstens 80,00 € je Nacht erstattungsfähig!\n\nRechnungen für Übernachtungskosten werden nur erstattet, sofern die Universität Kassel als Adressat angegeben ist. Wenn die Übernachtungskosten die Kosten des Frühstücks einschließen, werden die Kosten für das Frühstück im Rahmen der Hotelkostenerstattung vollumfänglich erstattet. Von dem zustehenden Tagegeld werden für das erhaltene Frühstück 20% des Tagegeldes für einen vollen Kalendertag der Abwesenheit vom Dienst- bzw. Wohnort einbehalten.\nUm Rückfragen zu vermeiden und um eine schnellere Bearbeitung der Abrechnung zu ermöglichen, sollten Dienstreisende - sofern erforderlich - ihre Bemühungen, eine preiswerte Unterkunft zu bekommen, im Einzelnen dokumentieren ( z. B. Ausdruck eines Onlineportals, Anfragen per E-Mail oder Fax) und diese der Abrechnung beifügen.\n\nAuszubildende erhalten bei Dienstreisen eine Entschädigung in entsprechender Anwendung der Reisekostenbestimmungen, die für die Beschäftigten des Ausbildenden gelten.\n\nBei Teilnahme an überbetrieblichen Ausbildungsmaßnahmen außerhalb der politischen Gemeindegrenze der Ausbildungsstätte und dem Besuch einer auswärtigen Berufsschule im Blockunterricht gilt:\n\n  • Die entstandenen notwendigen Fahrtkosten bis zur Höhe der Kosten der Fahrkarte der jeweils niedrigsten Klasse des billigsten regelmäßig verkehrenden Beförderungsmittels (im Bahnverkehr ohne Zuschläge) werden erstattet. Die Möglichkeiten von Fahrpreisermäßigungen, z. B. Schülerfahrkarten, Monatsfahrkarten, Landesticket) sind auszunutzen.\n  • Bei einer Entfernung von mehr als 300 km können im Bahnverkehr Zuschläge bzw. besondere Fahrpreise (z. B. für den ICE) erstattet werden.\n  • Die nachgewiesenen notwendigen Kosten einer Unterkunft am auswärtigen Ort werden, soweit nicht eine unentgeltliche Unterkunft zur Verfügung steht, erstattet.\n  • Als Verpflegungsmehraufwand wird für volle Kalendertage der Anwesenheit am auswärtigen Ausbildungsort ein Verpflegungszuschuss in Höhe der nach der Sozialgesetzentgeltverordnung maßgebenden Sachbezugswert für Frühstück, Mittagessen und Abendessen gewährt (bei unentgeltlicher Verpflegung wird der jeweilige Sachbezugswert einbehalten).\n\nFür Familienheimfahrten können einmal pro Monat die Fahrtkosten von der Ausbildungsstätte oder dem Ort der auswärtigen Berufsschule zum Wohnort des Erziehungsberechtigen (bzw. Ehe- oder Lebenspartner:innen) und zurückerstattet werden, wenn eine tägliche Rückkehr nicht möglich und zumutbar ist (Richtwert: mehr als 100 km).\n\nErstattungsfähig sind die notwendigen Fahrtkosten bis zur Höhe der Kosten der Fahrkarte der jeweils niedrigsten Klasse des billigsten regelmäßig verkehrenden Beförderungsmittels (im Bahnverkehr ohne Zuschläge). Die Möglichkeiten von Fahrpreisermäßigungen, z. B. Schülerfahrkarten, Monatsfahrkarten, BahnCard, Landesticket) sind auszunutzen.\n\nBei einer Entfernung von mehr als 300 km können im Bahnverkehr Zuschläge bzw. besondere Fahrpreise (z. B. für den ICE) erstattet werden.\n\nAnträge müssen über die/den jeweilige:n Ausbilder:in auf dem Dienstweg gestellt werden.\n\nNach oben\n\nIn­for­ma­tio­nen rund um Dienst­rei­sen ins Aus­land\n\nEs wird dringend empfohlen, vor Beginn der Dienstreise eine private Auslandskrankenversicherung abzuschließen, da durch die Universität Kassel lediglich ein Unfallversicherungsschutz besteht. Die Kosten für eine Auslandskrankenversicherung (zwischen 10 und 20 Euro pro Jahr bei Reisen in der Regel bis 45 Tage) können jedoch nicht durch die Universität Kassel erstattet werden.\n\nBei einem Arbeitsaufenthalt im Ausland unter besonderen klimatischen und gesundheitlichen Bedingungen ist eine Untersuchung beim Betriebsärztlichen Dienst \"MAS\" nach dem Grundsatz G35 erforderlich. Zur Abklärung der Notwendigkeit schreiben Sie bitte eine E
