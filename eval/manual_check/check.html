enheimfahrten habe der Kläger nicht konkretisiert; allein die handschriftlichen Eintragungen auf dem Kalender seien nicht ausreichend. Ebenso lasse sich auch die Behauptung, regelmäßig beide Kinder, im Alter von … und … Jahren, in 20xx an zehn Wochenenden und in 20xx an 23 Wochenenden mitgenommen zu haben, nur schwer nachvollziehen.\n\nMit Blick auf die begehrten Reisekosten mein das Finanzamt, dass die Übernahme in das Dienstverhältnis eines Berufssoldaten bereits zum 1. Mai 20xx der Annahme von Reisekosten zumindest ab diesem Zeitpunkt entgegenstehe. Denn bei unbefristet eingestellten Soldaten führe eine Versetzung mit einer – entweder ausdrücklich ausgesprochenen oder prognostisch ermittelten – voraussichtlichen zeitlichen Verwendung von mehr als 48 Monaten zu einer dauerhaften Zuordnung zur neuen Dienststelle, mit der Folge, dass dort eine erste Tätigkeitsstätte begründet werde. Aus der Verfügung zum Dienstpostenwechsel vom 27. April 20xx gehe zwar eine voraussichtliche Verwendungsdauer an der Dienststelle in … bis zum 30. April 20xx hervor. Allerdings werde prognostisch bereits auf die Verlängerung der voraussichtlichen Verwendungsdauer hingewiesen. Es sei anzunehmen, dass entscheidend für die Verlängerung der Verwendung die Übernahme in das Dienstverhältnis des Berufssoldaten gewesen sei. Wann diese Voraussetzung zur Verlängerung gegeben sei und letztlich zum Verbleib des Klägers in der Dienststelle in … geführt habe, habe der Kläger nicht dargelegt.\n\nMit Beschluss des 4. Senats des Hessischen Finanzgerichts vom 16. Mai 2024 ist der Rechtsstreit dem Einzelrichter zur Entscheidung übertragen worden.\n\nDie Beteiligten haben sich jeweils mit einer Entscheidung ohne mündliche Verhandlung einverstanden erklärt.\n\nEntscheidungsgründe\n\n1. Der – nach ordnungsgemäßer Übertragung – zuständige Einzelrichter konnte aufgrund des insoweit erteilten Einverständnisses der Beteiligten über den Rechtsstreit ohne mündliche Verhandlung entscheiden, § 90 Abs. 2 der Finanzgerichtsordnung –FGO–.\n\n2. Die zulässige Klage ist nicht begründet. Die angegriffenen Einkommensteuerbescheide sind rechtmäßig und verletzen den Kläger nicht in seinen Rechten, § 100 Abs. 1 Satz 1 FGO.\n\na. Zu Recht hat das Finanzamt den vom Kläger begehrten weitergehenden Werbungskostenabzug für Reisekosten gemäß § 9 Abs. 1 Satz 3 Nr. 4a EStG (über die Entfernungspauschale hinaus) abgelehnt. Denn bei der Dienststätte in … handelte es sich im Streitzeitraum um die erste Tätigkeitsstätte des Klägers.\n\nWerbungskosten sind (auch) Aufwendungen des Arbeitnehmers für die Wege zwischen Wohnung und erster Tätigkeitsstätte (§ 9 Abs. 1 Satz 3 Nr. 4 EStG) sowie Aufwendungen für beruflich veranlasste Fahrten, die nicht Fahrten zwischen Wohnung und erster Tätigkeitsstätte und die keine Familienheimfahrten sind (§ 9 Abs. 1 Satz 3 Nr. 4a EStG sind). Dabei gilt für die Ermittlung der abziehbaren Werbungskosten, dass Fahrten im Sinne der Nr. 4 nur im Rahmen der Entfernungspauschale (also durch Ansatz der einfachen Entfernung) zu berücksichtigen sind, während Fahrten im Sinne der Nr. 4a mit den pauschalen Kilometersätzen nach dem Bundesreisekostengesetz angesetzt werden können – also insbesondere für die Hin- und Rückfahrt. Für die Abgrenzung kommt es darauf an, ob es sich um Fahrten zwischen Wohnung und erster Tätigkeitsstätte im Sinne des Absatz 4 handelt, oder ob der Arbeitnehmer eine andere beruflich veranlasste Fahrt zu einem Ort ausführt, der keine erste Tätigkeitsstätte ist.\n\naa. Erste Tätigkeitsstätte ist nach der Legaldefinition in § 9 Abs. 4 Satz 1 EStG die ortsfeste betriebliche Einrichtung des Arbeitgebers, eines verbundenen Unternehmens oder eines vom Arbeitgeber bestimmten Dritten, der der Arbeitnehmer dauerhaft zugeordnet ist. Ortsfeste betriebliche Einrichtungen sind räumlich zusammengefasste Sachmittel, die der Tätigkeit des Arbeitgebers, eines verbundenen Unternehmens oder eines vom Arbeitgeber bestimmten Dritten dienen und mit dem Erdboden verbunden oder dazu bestimmt sind, überwiegend standortgebunden genutzt zu werden (vgl. BFH, Urteil vom 22. November 2022 – VI R 6/21 –, juris, m. w. N.).\n\nDass es sich bei der Dienststelle der Bundeswehr in … um eine ortsfeste betriebliche Einrichtung in diesem Sinne handelt ist zwischen den Beteiligten nicht streitig. Und auch das Gericht sieht keinen Anlass, dies in Frage zu stellen.\n\nbb. Die Zuordnung zu dieser Einrichtung wird gemäß § 9 Abs. 4 Satz 2 EStG durch die dienst- oder arbeitsrechtlichen (nachfolgend: nur noch arbeitsrechtliche) Festlegungen sowie die diese ausfüllenden Absprachen und Weisungen bestimmt.\n\nZu den arbeitsrechtlichen Weisungen und Verfügungen zählen alle schriftlichen, aber auch mündlichen Absprachen oder Weisungen. Die Zuordnung kann also insbesondere in einem Arbeitsvertrag (was hier nicht einschlägig ist) oder durch Ausübung des Direktionsrechts, beispielsweise bei Beamten und Soldanten durch dienstliche Anordnung, kraft der Organisationsgewalt des Arbeitgebers oder Dienstherrn (nachfolgend: nur noch Arbeitgeber) vorgenommen werden. Die Zuordnung zu einer ersten Tätigkeitsstätte muss dabei nicht ausdrücklich erfolgen. Wird der Arbeitnehmer (womit auch Beamte oder Soldaten mit umfasst sind) von seinem Arbeitgeber einer betrieblichen Einrichtung zugeordnet, weil er dort seine Arbeitsleistung (seinen Dienst) erbringen soll, ist diese Zuordnung aufgrund der steuerrechtlichen Anknüpfung an das Dienst- oder Arbeitsrecht auch steuerrechtlich maßgebend. Entscheidend ist, ob der Arbeitnehmer aus der Sicht ex ante nach den arbeitsrechtlichen Festlegungen an einer ortsfesten betrieblichen Einrichtung des Arbeitgebers, eines verbundenen Unternehmens oder eines vom Arbeitgeber bestimmten Dritten tätig werden sollte (vgl. BFH, a.a.O., m. w. N.).\n\nNach diesen Grundsätzen ist das Gericht davon überzeugt, dass der Kläger der Dienststelle der Bundeswehr in … zugeordnet war, um dort den ihm zugewiesenen Aufgaben und dem ihm zugewiesenen Dienst nachzukommen. Dies ergibt sich insbesondere auch aus der Verfügung zum Dienstpostenwechsel vom 27. April 20xx. Danach wurde ihm, nachdem er Anfang 20xx zum Berufssoldaten ernannt wurde, ein höherwertiger Dienstposten mit der Bewertung … – einem Bündelposten zur späteren möglichen Beförderung zum Oberleutnant – zugewiesenen und wurde er fortan, nach abgeschlossener Ausbildung und Studium, entsprechend dem ihm zugewiesenen Rang dienstlich eingesetzt und zwar als Leiter eines technischen Zuges in der Funktion eines Zugführers und als Instandsetzungsoffizier Landsysteme. Hierdurch hat der Dienstherr klargemacht, dass er den Kläger nach bestandener Offiziersausbildung entsprechend dem ihm verliehenen Rang einsetzen und verwenden will und dass dies an der Dienststelle in … geschehen soll.\n\nAuch zwischen den Beteiligten war dies nicht weiter streitig und hat insbesondere der Kläger diese Zuordnungsentscheidung des Dienstherrn nicht näher thematisiert oder in Abrede gestellt.\n\ncc. Entgegen der Auffassung des Klägers erfolgte diese Zuordnungsentscheidung auch dauerhaft.\n\nVon einer dauerhaften Zuordnung ist nach den Regelbeispielen des § 9 Abs. 4 Satz 3 EStG insbesondere dann auszugehen, wenn der Arbeitnehmer unbefristet (Alt. 1), für die Dauer des Dienstverhältnisses (Alt. 2) oder über einen Zeitraum von 48 Monaten hinaus (Alt. 3) an einer solchen Tätigkeitsstätte tätig werden soll.\n\nVorliegend erfolgte die Zuordnungsentscheidung gemäß § 9 Abs. 4 Satz 3 Alt. 1 EStG deshalb dauerhaft, weil der Kläger unbefristet der Dienststelle zugeordnet wurde. Dabei ist im Streitfall für die Abgrenzung zwischen einer unbefristeten und einer befristeten Tätigkeit zunächst zu beachten und maßgeblich, dass der Kläger im Februar 20xx einen Statuswechsel vollzogen hat und er von einer befristeten Tätigkeit – Soldat auf Zeit – zu einer unbefristeten Betätigung – Berufssoldat – wechselte. Denn während bei einem Soldaten auf Zeit das Dienstverhältnis zeitlich befristet ist und mit Ablauf der Zeit endet, für die er in das Dienstverhältnis berufen wurde (§ 54 Abs. 1 Satz 1 Soldatengesetz –SG–), ist das Dienstverhältnis bei einem Berufssoldaten grundsätzlich unbefristet und endet durch Eintritt oder Versetzung in den Ruhestand (§ 43 Abs. 1 SG).\n\nDies bedeutet, dass ab der Ernennung des Klägers zum Berufssoldat für die Frage, ob eine Zuordnung zu einer Dienststätte, wie hier der Zuordnung zu der Dienststätte in …, maßgeblich ist, ob die Dauer der Zuordnung zu der Tätigkeitsstätte aus der maßgeblichen ex-ante-Sicht kalendermäßig nicht bestimmt ist und sich auch nicht aus Art, Zweck oder Beschaffenheit der Arbeitsleistung ergibt. (vgl. BFH, a.a.O., m. w. N.). Darauf, ob die zeitliche Verwendungsdauer für die Dauer des Dienstverhältnisses erfolgte oder ob der Kläger über einen Zeitraum von 48 Monaten hinaus tätig werden sollte (§ 9 Abs. 4 Satz 3 Alt. 2 und 3 EStG), kommt es nicht an, da diese Alternativen eine befristete Tätigkeit voraussetzen.\n\nDiese oben genannten Voraussetzungen sind im Streitfall erfüllt. Insbesondere kann der Versetzungsverfügung vom 27. April 20xx keine kalendermäßige Befristung entnommen werden und spielt der Umstand, dass in der genannten Verfügung als voraussichtliche Verwendungsdauer der Zeitpunkt 30. April 20xx genannt wird, keine Rolle. Denn es handelt sich insoweit nicht um eine kalendermäßig bestimmte zeitliche Befristung der Versetzung mit der Folge, dass nach zeitlichem Ablauf automatisch eine Rückkehr an den früheren Dienstort (bei dem es sich im Übrigen auch zuvor um die Dienststätte in … handelte) erfolgt. Vielmehr ist es so, dass die (bloße) Voraussichtlichkeit der Verwendung schon nach dem Wortsinn keine feste Bindung der Bundeswehr an die betreffende Verwendungsdauer beinhaltet; sie beschreibt lediglich den nach der jeweiligen (gegenwärtigen) Sachlage geplanten Verwendungszeitraum (vgl. BFH, a.a.O., m. w. N.).\n\nEine befristete Dauer der Zuordnung zu der neuen Tätigkeitsstätte ergibt sich im Streitfall auch nicht aus der Art, dem Zweck oder der Beschaffenheit der Tätigkeit. Maßgeblich hierfür ist regelmäßig die Prüfung im Einzelfall dahingehend, ob der Arbeitgeber den Arbeitnehmer beispielsweise nur zur zeitweisen Verstärkung, etwa bei personalen Engpässen oder zum Abfangen bei erhöhtem Arbeitsanfall, für bestimmte Projekte oder aus anderen Gründen nur vorübergehend an dem anderen Ort einsetzen will. Ein gewichtiges Indiz für die Dauerhaftigkeit der Zuordnungsentscheidung dürfte insoweit regelmäßig sein, ob der Arbeitnehmer nach der insoweit einschlägigen organisatorischen Planung des Arbeitgebers an dem neuen / anderen Dienstort einen bestimmten fest eingerichteten Arbeitsplatz oder Dienstposten dauerhaft zugewiesen bekommt und diesem Dienstposten oder Arbeitsplatz seiner Art nach auch keine zeitliche Begrenzung zu entnehmen ist. Im öffentlichen Dienst, bei Beamten und Soldaten, kann hierfür durchaus zugrunde gelegt werden, ob eine Person etwa nur vorübergehend abgeordnet oder abkommandiert wird oder ob eine (förmliche) Versetzung auf einen neuen Dienstposten mit einem fortan fest zugewiesenen Aufgaben- und Arbeitsbereich endgültig erfolgen soll und die Person diesen Dienstposten zugewiesen bekommt.\n\nEntsprechend diesen Maßstäben erfolgte die Zuordnung zu dem Dienstort in … vorliegend auch nach der Art, dem Zweck und der Beschaffenheit der Arbeitsleistung dauerhaft. Dies ergibt sich recht eindeutig aus der Zuordnungsentscheidung der Bundeswehr aufgrund der Verfügung zum Dienstpostenwechsel vom 27. April 20xx. Wie oben bereits ausgeführt wurde ihm hiermit ein höherwertiger Dienstposten mit der Bewertung … zugewiesenen und war er fortan auf einem festen Dienstposten als Leiter eines technischen Zuges in der Funktion eines Zugführers und als Instandsetzungsoffiziers Landsysteme tätig. Dadurch hat der Dienstherr deutlich gemacht, dass er den Kläger nach bestandener Offiziersausbildung entsprechend dem ihm verliehenen Rang einsetzen und verwenden will und dass dies an der Dienststätte in … dauerhaft geschehen soll.\n\nDass der Kläger, wie im öffentlichen Dienst bei Soldaten und Beamten insbesondere im Zusammenhang mit der weiteren Karriere und einer Beförderung üblich, möglicherweise zu einem späteren Zeitpunkt – aus ex-ante-Sicht – an eine andere Dienststätte versetzt werden könnte führt nicht dazu, dass es sich bei der vorangegangenen Zuordnung nicht um eine dauerhafte Zuordnung handelt. Es existiert diesbezüglich nämlich weder ein Automatismus noch ist von vornherein festgelegt oder bestimmt, dass es zu einem bestimmten späteren Zeitpunkt zu einer Änderung der Verwendung oder des Dienstortes des Beamten oder Soldaten kommt.\n\nb. Zu Recht hat das Finanzamt auch den vom Kläger begehrten Werbungskostenabzug für Aufwendungen einer doppelten Haushaltsführung verweigert. Denn der Kläger hat die Voraussetzungen für die Berücksichtigung von Mehraufwendungen für eine beruflich veranlasste doppelte Haushaltsführung nach § 9 Abs. 1 Satz 3 Nr. 5 EStG in den Streitjahren nicht zur Überzeugung des Gerichts nachweisen können.\n\nGemäß § 9 Abs. 1 Satz 3 Nr. 5 EStG sind Werbungskosten auch notwendige Mehraufwendungen, die einem Arbeitnehmer wegen einer beruflich veranlassten doppelten Haushaltsführung entstehen. Eine doppelte Haushaltsführung liegt nur vor, wenn der Arbeitnehmer außerhalb des Ortes seiner ersten Tätigkeitsstätte einen eigenen Hausstand unterhält und auch am Ort der ersten Tätigkeitsstätte wohnt. Das Vorliegen eines eigenen Hausstandes setzt das Innehaben einer Wohnung sowie eine finanzielle Beteiligung an den Kosten der Lebensführung voraus.\n\naa. Die Vorschrift setzt zunächst voraus, dass der Steuerpflichtige außerhalb des Orts seiner ersten Tätigkeitsstätte einen eigenen Hausstand unterhält. Dies erfordert das Innehaben einer Wohnung, in der sich ein Haushalt räumlich entfalten kann. Eine Wohnung ist dabei jede Unterkunft, die zur Übernachtung genutzt wird. Dabei kommt es nicht darauf an, dass die Räumlichkeiten den bewertungsrechtlichen Anforderungen an eine Wohnung gerecht werden. Dies bedeutet, dass die Wohnverhältnisse auch vergleichsweise einfach und beengt sein können und die Wohnung nicht über eine eigene Küche oder Kochgelegenheit verfügen muss, solange der Steuerpflichtige in den Hausstand insgesamt eingegliedert und nicht bloß Gast in fremden Räumen ist. Erforderlich ist aber, dass die Hauptwohnung nach Größe, Einrichtung und Ausstattung ein eigenständiges Wohnen und Wirtschaften gestatten muss. Darüber hinaus muss der Steuerpflichtige die Wohnung auch aus eigenem, gemeinsamem oder abgeleitetem Recht, etwa als Eigentümer, Mieter, Untermieter, Nießbraucher, Mitbewohner, Ehegatte oder Lebenspartner, nutzen; das Verbleiben in der Wohnung muss aufgrund einer geschützten Rechtsposition gesichert sein (vgl. Oertel in: Kirchhof/ Seer, Einkommensteuergesetz, 23. Auflage 2024, § 9 EStG, Rn. 102).\n\nDer Begriff \"Hausstand\" umschreibt dabei den Ersthaushalt (Hauptwohnung), an dem sich der Steuerpflichtige regelmäßig aufhält, den er fortwährend nutzt und von dem aus er sein Privatleben führt, an dem er also seinen Lebensmittelpunkt hat. Trotz des Wohnens am Beschäftigungsort muss der Steuerpflichtige einen eigenen Hausstand in einer anderen Wohnung, welche sich als Mittelpunkt seiner Lebensinteressen darstellt, unterhalten. Der Mittelpunkt der Lebensinteressen ist regelmäßig durch eine Gesamtwürdigung aller Umstände des Einzelfalls festzustellen. Zu würdigen ist danach insbesondere, wie oft und wie lange sich der Steuerpflichtige in der einen oder anderen Wohnung aufhält, wie die Wohnungen ausgestattet sind, welche Größe sie haben, Lage und Entfernung zu anderen Punkten sowie die Zahl der Heimfahrten. Erhebliches Gewicht hat die Frage, zu welchem Ort die engeren persönlichen Beziehungen bestehen, etwa die Intensität der sozialen Kontakte, Vereinszugehörigkeiten, andere private Aktivitäten etc. (vgl. Oertel, a.a.O., Rn. 106).\n\nDas \"Unterhalten\" eines eigenen Hausstands setzt voraus, dass der Arbeitnehmer ein für die Haushaltsführung wesentlich bestimmender oder zumindest mitbestimmender Teil ist. Dies erfordert gleichwohl nicht, dass ununterbrochen ein hauswirtschaftliches Leben durch die Anwesenheit von Familienangehörigen herrscht. Die Hauptwohnung muss nach Größe, Einrichtung und Ausstattung ein eigenständiges Wohnen und Wirtschaften gestatten. Das Vorhalten einer Wohnung für gelegentliche Besuche oder Ferienaufenthalte ist nicht als Unterhalten zu bewerten. Ist der Arbeitnehmer lediglich in einen fremden Haushalt eingegliedert, so wird ebenfalls kein eigener Hausstand unterhalten (vgl. Oertel, a.a.O., Rn. 105).\n\nWeitere Voraussetzung ist darüber hinaus eine finanzielle Beteiligung an den Kosten der Lebensführung, wobei diese nicht zwingend in Form von Geldzuwendungen erfolgen muss. Sie kann vielmehr auch in der Anschaffung von Haushaltsgegenständen oder Möbeln bestehen. Berücksichtigungsfähig sind danach alle Aufwendungen für den Haushalt (etwa Finanzierungs- oder Mietkosten, Betriebs- und sonstige Nebenkosten, Kosten für die Anschaffung und Reparatur von Haushaltsgegenständen, Renovierungs- und Instandhaltungskosten) und die Lebenshaltung am Haupthausstand (zum Beispiel Aufwendungen für Lebensmittel, Hygiene, Zeitung, Rundfunk, Telekommunikation etc.), nicht dagegen sonstige Aufwendungen für die persönliche Lebensführung, Kleidung, Urlaub, Freizeitgestaltung, Pkw und Gesundheitsvorsorge. Der Höhe nach ist eine maßgebende finanzielle Beteiligung anzunehmen, wenn die Beiträge für die Unterhaltung des Hausstands im Einzelfall nicht erkennbar unzureichend sind (vgl. Oertel, a.a.O., Rn. 104).\n\nbb. Unter Zugrundelegung dieser Grundsätze hat der Kläger bei Abwägung der Gesamtumstände zur Überzeugung des Gerichts weder nachgewiesen, dass sich sein Lebensmittelpunkt in den Streitjahren in … unter der Anschrift … befand, noch, dass er sich finanziell an den Kosten der Lebensführung beteiligte.\n\naaa. Wie das Finanzamt zurecht ausgeführt hat, ist allein die Meldebescheinigung kein ausreichendes Indiz für eine Verlagerung des Lebensmittelpunktes. Durch diese wird lediglich nachgewiesen, dass der Kläger an einem bestimmten Tag bei der Meldebehörde war und dort erklärt hat, dass er fortan in …, …, wohnhaft und dort gemeldet sein will. Darüber, ob und in welchem Umfang er sich tatsächlich dort aufhielt und welche Qualität der Aufenthalt hatte, kann die Meldebescheinigung naturgemäß keine Informationen geben.\n\nDas Finanzamt hat ferner – im Ergebnis zu Recht – ausgeführt, dass sich nicht nachvollziehen lasse, ob, inwieweit und ab welchem Zeitpunkt der Kläger bei den Eltern aus eigenem Recht Wohnräume genutzt hat. Selbst wenn man zugunsten des Klägers noch unterstellen mag, dass er zumindest aufgrund einer Duldung durch seine Eltern eine geschützte Rechtsposition gehabt haben mag und eine Nutzung aus abgeleitetem Recht erfolgte, so ist das Gericht jedoch nicht zu der Überzeugung gelangt, dass dies genau im Streitzeitraum erfolgte und dass es sich bei den insoweit genutzten Räumlichkeiten im Haus der Eltern des Klägers überhaupt um einen eigenen Hausstand handelt, in dem er seinen Lebensmittelpunkt hatte.\n\nDa der Beurteilung des Tatbestandsmerkmals des eigenen Hausstandes durch eine Gesamtwürdigung aller Umstände zu erfolgen hat, oblag es insbesondere dem Kläger, geeignete Nachweise vorzulegen und in der Sache entsprechend vorzutragen, dass und warum sich in … der Mittelpunkt seiner Lebensinteressen befand. Dies ist ihm im Streitfall nicht gelungen.\n\nSo ist bereits nur eingeschränkt nachvollziehbar, wie oft sich der Kläger in … überhaupt aufgehalten hat. Das Einzige, was in diesem Zusammenhang vorgebracht wurde, war die Aufstellung über die behauptete Häufigkeit seiner Anwesenheiten in ….\n\nInsoweit konnte der Kläger aber lediglich Kopien von Kalenderblättern mit handschriftlichen Anmerkungen vorliegen. Weitere Nachweise darüber, dass die behaupteten Fahrten tatsächlich stattgefunden haben, blieb er schuldig. So erklärte er etwa auf die Frage des Gerichts, mit welchen Fahrzeugen er die Fahrten zurückgelegt haben will, dass er dies bis / ab Dezember 20xx jeweils mit einem BMW und ab März 20xx zusätzlich mit einem Motorrad getan habe, dass es ihm aber nicht mehr möglich sei mitzuteilen, welches Fahrzeug er wann genutzt habe. Auf die weitergehende Bitte um Vorlage von Belegen (etwa Werkstattrechnungen oder ähnlichem) aus denen möglicherweise abgeleitet werden könnte, dass in einem gewissen Umfang überhaupt Fahrten stattgefunden haben, wurde nicht näher eingegangen.\n\nSehr dünn und vage sind auch die weiteren Angaben zur sozialen Verankerung, persönlichen Beziehungen und Treffen in …. So hat der Kläger auf die entsprechenden Fragen des Gerichts bezüglich seines sozialen Umfeldes in … lediglich mitgeteilt, dass es vor Ort keine aktiven Vereinsmitgliedschaften gebe und dass er sich dort mit seinem Bruder und mit zwei Freunden an Wochenenden, dienstfreien Tagen oder im Urlaub getroffen habe, insoweit aber keine näheren Angaben mehr machen könne. Zu anderen privaten Aktivitäten, die sich vor Ort in … abgespielt haben, macht der Kläger überhaupt keine Ausführungen.\n\nAuch die Häufigkeit des Besuchs der Kinder bei ihm ist nicht näher belegt. Insbesondere hätte man gerade hier erwarten können, dass der Kläger näher und detaillierter ausführt, was er mit seinen Kindern, in den Zeiten wo sie bei ihm waren, gemacht hat. Es dürfte sicherlich zu erwarten sein, dass er bei einigen Gelegenheiten möglicherweise Bilder gemacht hat oder sonst wie gezeigt werden könnte, dass es sich insoweit um ein Familienleben des Klägers mit seinen Kindern am Wochenende handelt. Auch diesbezüglich bleibt der Vortrag oberflächlich und vage.\n\nGegen einen Mittelpunkt der Lebensinteressen spricht des Weiteren, dass der Kläger in seinem Vortrag bezüglich der Ausstattung der Räume widersprüchlich ist. So wurde zunächst im Klageschriftsatz behauptet, dass er in dem Haus seiner Eltern (welches dort nicht näher beschrieben wurde) im 2. OG eine Wohnung bezogen habe. Erst später kam dann heraus, dass es sich nicht um eine (eigene) Wohnung im allgemeinen Sprachgebrauch handelt, sondern der Kläger lediglich in einem Reihenhaus oder einer Doppelhaushälfte der Eltern im Obergeschoss einen Raum und zusätzlich das Dachgeschoss zur Verfügung gehabt haben will. Hier wurde dann auch behauptet (unter Vorlage entsprechender Pläne) dass er sich diese Zimmer entsprechend umgebaut, er insbesondere im Dachgeschoss eine Küchenzeile und ein kleines Bad eingebaut und er die Kosten für den Umbau und die Anschaffung von Möbeln ausschließlich selbst getragen habe. Damit hat der Kläger den Eindruck erweckt, dass er ab dem Juli 20xx in entsprechend umgebauten und ausgestatteten Räumen im Haus seiner Eltern gewohnt haben will. Als das Gericht aber dann Informationen zu den Umbaumaßnahmen und zu der Anschaffung der Möbel eingefordert hat konnte der Kläger lediglich acht Belege über diverse Einrichtungsgegenstände vorlegen, von denen sogar nur ein Beleg (betreffend eine Duschrinne) aus 20xx stammte, vier weitere Belege aus 20xx und die übrigen sogar erst aus späteren Jahren. Üblicherweise, wenn die Behauptungen des Klägers betreffend den Umbau, insbesondere des Dachgeschosses, zutreffend gewesen wären, hätte es ihm ein Leichtes sein müssen, durch geeignete Nachweise (zahlreiche Belege über Möbel, Baumaterial, und dergleichen) sowie durch Vorlage von Fotos (Vorher /Nachher) zu belegen, dass und vor allem auch wann er selbst und auf eigene Kosten die Räumlichkeiten im Haus seiner Eltern zu seinen Zwecken und wie von ihm gewünscht umgebaut hat. All dies hat er jedoch versäumt. Letztlich liegen nur der Plan mit den handschriftlichen Ergänzungen sowie acht Belege vor, die ihrerseits kaum Aussagekraft haben und bei denen noch nicht mal klar ist, für welche Wohnung die Anschaffungen erfolgten.\n\nbbb. Eine Anerkennung der doppelten Haushaltsführung scheitert des Weiteren auch daran, dass der Kläger nicht hat nachweisen können, dass er sich an den Kosten der Lebensführung finanziell beteiligt hat. Auch insoweit bleiben die Behauptungen des Klägers sehr vage. Es wird lediglich vorgebracht, dass er sich an den Kosten der Lebensführung mit einem monatlichen Beitrag von xxx € beteiligt habe, den er in bar jeweils an seine Eltern gezahlt haben will. Nachweise hierfür blieb er aber schuldig. Trotz Nachfrage wurden auch keine Kontoauszüge vorgelegt, die belegen könnten, dass er in entsprechendem Umfang überhaupt regelmäßig Barabhebungen vorgenommen hat, um das Geld seinen Eltern zu geben.\n\nDie übrigen vorgelegten Belege (soweit diese überhaupt den Streitjahren zuzuordnen sind) lassen, wie das Finanzamt zu Recht bemängelt, ebenfalls nicht erkennen, dass der Kläger sich in relevantem Umfang finanziell an den Kosten der Lebensführung beteiligte, zumal – wie oben ausgeführt – überhaupt nicht nachgewiesen wurde, dass die entsprechenden Aufwendungen der Unterkunft in … überhaupt zugeordnet werden können.\n\nc. Aus denselben Gründen wie unter a. konnte der Kläger auch nicht mit Erfolg einen Werbungskostenabzug der Übernachtungskosten in … gemäß § 9 Abs. 1 Nr. 5a Satz 1 EStG geltend machen. Denn nach dieser Vorschrift sind Werbungskosten u.a. auch notwendige Mehraufwendungen eines Arbeitnehmers für beruflich veranlasste Übernachtungen an einer Tätigkeitsstätte, die nicht erste Tätigkeitsstätte ist. Da es sich vorliegend jedoch bei der Dienststätte in … um die erste Tätigkeitsstätte des Klägers handelte, waren die Voraussetzungen hierfür nicht erfüllt.\n\n3. Die Kostenentscheidung beruht auf § 135 Abs. 1 FGO."}, {"id": "P25", "query": "Zeitschriften der Universitätsbibliothek", "description": "Wie finde und nutze ich Zeitschriften der Universitätsbibliothek?", "narrative": "Relevant sind Informationen zu gedruckten und elektronischen Zeitschriften sowie deren Zugang.", "title": "DEAL-Verträge mit Wiley, Springer Nature und Elsevier - UB - Uni Kassel", "url": "https://www.uni-kassel.de/ub/publizieren/open-access/verlagsvereinbarungen/deal.html", "text": "DEAL-Verträge mit Wiley, Springer Nature und Elsevier\n\nDie Hochschulrektorenkonferenz verhandelt im Auftrag der Allianz der deutschen Wissenschaftsorganisationen mit den Verlagen Wiley, Springer Nature und Elsevier im Rahmen von DEAL ein neues Vertragsmodell, von dem alle deutschen Wissenschaftseinrichtungen profitieren. Die abgeschlossenen Verträge gewährleisten Zugriff auf einen Großteil des Zeitschriftenportfolios der Verlage. Zusätzlich beinhalten sie eine Open-Access-Publikationskomponente, die es den Angehörigen der teilnehmenden Einrichtungen, so auch der Universität Kassel, ermöglicht, ihre Artikel in den meisten Zeitschriften der Verlage ohne eigene Kosten weltweit frei zugänglich im Open Access zu publizieren. Dies gilt sowohl für Artikel in reinen Gold-OA-Zeitschriften als auch in den Hybridzeitschriften der Verlage, also in Subskriptionszeitschriften, die optional die OA-Freischaltung einzelner Artikel anbieten. Die maximale Fördergrenze von 2.000 EUR netto, die bei unserem OA-Publikationsfonds Anwendung findet, gilt im Rahmen von DEAL nicht.\n\nDie OA-Policy der Universität Kassel empfiehlt die Publikation im Open Access. Entscheiden Sie sich gegen eine OA-Freischaltung Ihres Artikels bei einem DEAL-Verlag, wird der Universität Kassel die Artikelgebühr dennoch berechnet. Zudem verzichten Sie damit auf eine größere Rezeption und Reichweite Ihres Artikels. Ausführliche Informationen, warum Sie die Open-Access-Option nicht ungenutzt lassen sollten, finden Sie in diesem Blogbeitrag. Weitere Informationen gibt es auch auf der Webseite des DEAL Konsortiums.\n\nVertragslaufzeit\n\nWiley\n\n2019-2023, 2024-2028\n\nSpringer Nature\n\n2020-2023, 2024-2028\n\nElsevier\n\n2024-2028\n\nOA-Veröffentlichungen in (hybriden) Subskriptionszeitschriften\n\nWiley\n\nMöglich in über 1.400 (hybriden) Subskritionszeitschriften (Hybrid Open Access - HOA).\n\nEinige wenige Titel bieten derzeit noch keine OA-Optionen, werden aber im Rahmen der Vereinbarung in OA-Modelle überführt.\n\nSpringer Nature\n\nMöglich in rund 1.900 (hybriden) Subskriptionszeitschriften (Springer Open Choice).\n\nDie Nature-Subskriptionszeitschriften und einige andere Titel werden vom Vertrag nicht abgedeckt.\n\nElsevier\n\nMöglich in über 1.800 (hybriden) Subskriptionszeitschriften ab dem 01.01.2024 (Zeitpunkt der Annahme des Papers).\n\nEinige wenige Titel sind von der OA-Option ausgenommen.\n\nOA-Veröffentlichungen in reinen Gold-OA-Zeitschriften\n\nWiley\n\nMöglich in rund 100 OA-Zeitschriften mit einem Rabatt von 20% für DEAL-Einrichtungen.\n\nSpringer Nature\n\nMöglich in rund 600 OA-Zeitschriften, darunter SpringerOpen-, Nature- und BMC-Titel mit 20 % Rabatt für DEAL-Einrichtungen außer für Artikel in Nature Communications und Scientific Reports.\n\nElsevier\n\nMöglich in über 600 OA-Zeitschriften ab dem 01.01.2024 (Zeitpunkt der Einreichung des Papers) mit einem Rabatt von 20% für DEAL-Einrichtungen (15% für OA-Zeitschriften der Marken \"Cell Press\" und \"The Lancet\").\n\nWelche Artikel sind berechtigt?\n\nWiley\n\nPrimary Research Articles und Review Articles mit (Primary / Submitting / Responsible) Corresponding Author der Universität Kassel zum Zeitpunkt der Annahme zur Veröffentlichung\n\nRedaktionelle Beiträge wie Letters oder Book Reviews sind nicht abgedeckt.\n\nSpringer Nature\n\nOriginal Papers, Review Papers, Brief Communications, Editorial Notes, Book Reviews, Letters und Reports mit Corresponding Author der Universität Kassel\n\nInvited Reviews und Brief Communications in Facharztzeitschriften sind nicht abgedeckt.\n\nElsevier\n\nalle Artikeltypen mit Peer Review (Full Length Article, Review Article, Case Report, Data in Brief, Microarticle, Original Software Publication, Protocol, Replication Study, Short Communication, Short Survey, Video Article) mit Corresponding Author der Universität Kassel\n\nWie kann ich bei den DEAL-Verlagen im Open Access publizieren?\n\nBerechtigung und Autor:innenzugehörigkeit werden im Hintergrund vom Verlag geprüft und durch die UB Kassel bestätigt. Die Zuordnung von Publikationsgebühren zur Universität Kassel erfolgt nach der Affiliation des corresponding author.\n\nGeben Sie als (responsible) corresponding author im Einreichungs- und Publikationsprozess die Unversität Kassel an. Diese Angabe sollte auch dem Manuskript und der Publikation selbst entsprechen.\n\nWenn Sie mit mehreren Einrichtungen affiliiert sind, sollte die Universität Kassel (oder eine andere DEAL-Einrichtung) möglichst an erster Stelle genannt werden. Die angegebene Einrichtung sollte jene Einrichtung sein, an der die dem Artikel zugrundeliegende Forschung durchgeführt wurde (z. B. wenn Sie Ihre Einrichtung kürzlich gewechselt haben).\n\nVerwenden Sie ausschließlich Ihre institutionelle E-Mail-Adresse der Domain uni-kassel.de.\n\nWenn Sie Ihren Artikel bei einer Open-Access-Zeitschrift einreichen, brauchen Sie nichts weiter zu beachten. Haben Sie bei einer Subskriptionszeitschrift eingereicht, werden Sie im Publikationsworkflow aufgefordert, Open Access zu wählen, nachdem Ihr Artikel zur Veröffentlichung angenommen wurde. Bestätigen Sie dann die jeweils angebotene Open-Access-Option des Verlages.\n\nSobald Sie sich für Open Access entschieden haben, werden Sie aufgefordert, die Creative Commons Attribution License für Ihren Artikel zu bestätigen. Während Autor:innen traditionell alle Rechte an ihren Werken an die Verlage übertragen haben, behalten Sie unter der CC-BY-Lizenz das Recht, Ihre eigene Arbeit wiederzuverwenden und Ihre veröffentlichten Artikel frei und legal weiterzugeben, sodass Wissenschaftler:innen weltweit Ihre Arbeit lesen und darauf aufbauen können, vorausgesetzt, dass sie Sie korrekt zitieren. Die UB empfiehlt die Verwendung der Lizenz CC BY, sofern für die jeweilige Zeitschrift verfügbar, da sie unter Wahrung Ihrer Urheberschaft im Sinne des Open-Access-Gedankens die weitestgehende Nachnutzung und Verbreitung Ihres Artikels ermöglicht (s. auch Warum CC BY?).\n\nWeitere Informationen finden Sie auch auf den Verlagswebseiten:"}, {"id": "P26", "query": "Dienstausweis", "description": "Wie erhalte ich als Beschäftigter einen Dienstausweis oder eine Chipkarte?", "narrative": "Relevant sind Informationen zur Beantragung von Dienstausweis oder Chipkarte.", "title": "Rotraud Gitter - FB07 - Uni Kassel", "url": "https://www.uni-kassel.de/fb07/en/iwr/oeffentliches-recht-insb-umwelt-und-technikrecht/team/ehemalige/dr-rotraud-gitter-llm.html", "text": "Dr. Rotraud Gitter, LL.M.\n\nEhemalige wissenschaftliche Mitarbeiterin\n\nFachgebiet Öffentliches Recht, insb. Umwelt- und Technikrecht\n\nProjektgruppe verfassungsverträgliche Technikgestaltung\n- provet -\n\nUniversität Kassel, FB 07\nPfannkuchstr. 1\n34109 Kassel\n\n \n\n  • Preisträgerin des Wissenschaftspreises 2006 der Industrie- und Handelskammer Kassel.\n  • 9/2006 bis 8/2008 Mitarbeit im Projekt Orinoco, 7/2007 bis 10/2008 Mitarbeiterin im Projekt Voteremote.\n  • 2006 Promotion zum Thema „Softwareagenten im elektronischen Geschäftsverkehr – Rechtliche Rahmenbedingungen und Gestaltungsvorschläge für agentengestützte Assistenzsysteme“ (summa cum laude).\n  • Von 7/2002 bis 8/2006 Geschäftsführerin von provet.\n  • Seit 2000 Mitarbeiterin bei provet, unter anderem in den Projekten MAPLiving in a Smart EnvironmentMIKVesuV und der Machbarkeitsstudie \"Digitaler Personalausweis\".\n  • Von 1999 bis 2000 freie Mitarbeiterin am Institut für Finanzdienstleistungen e.V. Hamburg.\n  • Von 1997 bis 1999 Referendarin am OLG Schleswig, Zweites Juristisches Staatsexamen.\n  • Von 1996 bis 1998 Internationaler Studiengang \"European and International Law\" an der Universität Bremen.\n  • Von 12/1995-3/1996 Intern in der Communications Branch im Menschenrechtszentrum der Vereinten Nationen, Genf.\n  • Studium der Rechtswissenschaften in Tübingen, Dijon und Hamburg, 1996 Erstes Juristisches Staatsexamen.\n\nBuchpublikationen\n\n  • Softwareagentensysteme im elektronischen Geschäftsverkehr: Rechtliche Rahmenbedingungen und Gestaltungsanforderungen an agentengestützte Assistenzsysteme, 2007, Nomos.\n\nAufsätze\n\n  • Rotraud Gitter / Volkmar Lotz / Ulrich Pinsdorf / Alexander Roßnagel, Sicherheit und Rechtsverbindlichkeit mobiler Agenten, 2007.\n  • Long-term retention in e-voting - Legal requirements and technical implementation, in: Krimmer, R. / Grimm, R. (Hrsg.), 3rd International Conference on electronic voting 2008, Bonn 2008, 109-123 (zusammen mit Langer, L. / Okunick, S. / Opitz-Talidou, Z.).\n  • Die Haftung der Betreiber von Web 2.0-Plattformen, in: von Kortzfleisch, H. / Bohl, O. (Hrsg.), Wissen, Vernetzung, Virtualisierung - Liber amicorum zum 65. Geburtstag von Prof. Dr. Udo Winand, Lohmar 2008, 279-286.\n  • Softwareagentensysteme im elektronischen Geschäftsverkehr: Rechtliche Rahmenbedingungen und Gestaltungsanforderungen an agentengestützte Assistenzsysteme, Baden-Baden 2007.\n  • Die Richtlinie zur Vorratsspeicherung und ihre Umsetzung in das nationale Recht, MMR 2007, 411-417 (zusammen mit Schnabel, C.).\n  • Die zweite Simulationsstudie, in: Gitter, R. / Pinsdorf, U. / Lotz, V. / Roßnagel, A. (Hrsg.), Sicherheit und Rechtsverbindlichkeit mobiler Agenten, DUV 2007 (zusammen mit Laue, P. / Peters, J.).\n  • Rechtliche Gestaltungsvorschläge, in: Gitter, R. / Pinsdorf, U. / Lotz, V. / Roßnagel, A. (Hrsg.), Sicherheit und Rechtsverbindlichkeit mobiler Agenten, DUV 2007 (zusammen mit Learnt, L.).\n  • Rechtsfragen mobiler Agenten, in: Gitter, R. / Pinsdorf, U. / Lotz, V. / Roßnagel, A. (Hrsg.), Sicherheit und Rechtsverbindlichkeit mobiler Agenten, DUV 2007.\n  • Das Verhältnis des Digitalen Personalausweises zu anderen Chipkarten und Anwendungsprojekten, in: Reichl, H. / Roßnagel, A. / Müller, G. (Hrsg.), Digitaler Personalausweis - Eine Machbarkeitsstudie, 2005, 317-321 (zusammen mit Roßnagel, A. / Hornung, G. / Strasser, M.).\n  • Kosten und Umsetzungsmodelle, in: Reichl, H. / Roßnagel, A. / Müller, G. (Hrsg.), Digitaler Personalausweis - Eine Machbarkeitsstudie, 2005, 243-279 (zusammen mit Strasser, M. / Müller, G. / Roßnagel, A.).\n  • Möglichkeiten zur Erfüllung der ordnungsrechtlichen Anforderungen, in: Reichl, H. / Roßnagel, A. / Müller, G. (Hrsg.), Digitaler Personalausweis - Eine Machbarkeitsstudie, 2005, 238-241 (zusammen mit Roßnagel, A. / Hornung, G.).\n  • Möglichkeiten zur Erfüllung der signaturrechtlichen Anforderungen, in: Reichl, H. / Roßnagel, A. / Müller, G. (Hrsg.), Digitaler Personalausweis - Eine Machbarkeitsstudie, 2005, 219-223 (zusammen mit Roßnagel, A.).\n  • Rechtliche Rahmenanforderungen an Geschäftsmodelle, in: Reichl, H. / Roßnagel, A. / Müller, G. (Hrsg.), Digitaler Personalausweis - Eine Machbarkeitsstudie, 2005, 151-162 (zusammen mit Roßnagel, A.).\n  • Ordnungsrechtliche Anforderungen, in: Reichl, H. / Roßnagel, A. / Müller, G. (Hrsg.), Digitaler Personalausweis - Eine Machbarkeitsstudie, 2005, 145-151 (zusammen mit Roßnagel, A. / Hornung, G.).\n  • Signaturrechtliche Anforderungen, in: Reichl, H. / Roßnagel, A. / Müller, G. (Hrsg.): Digitaler Personalausweis - Eine Machbarkeitsstudie, 2005, 91-106 (zusammen mit Roßnagel, A.).\n  • Ausweise als Träger von Signaturverfahren, DuD 2005, 74-77 (zusammen mit Strasser, M.).\n  • Der Rechtsrahmen für elektronische Signaturen, Frauenarbeit und Informatik 27/2003, 25-29.\n  • Die Beschränkung des qualifizierten Zertifikats - § 7 Abs. 1 Nr. 7 SigG als wichtiges Mittel der Risikokalkulation, MMR 6/2003, 384-389 (zusammen mit Fischer-Dieskau, S. / Hornung, G.).\n  • Rechtsfragen mobiler Agentensysteme im E-Commerce, K&R 2/2003, 64-72 (zusammen mit Roßnagel, A.).\n  • Elektronisch signierte Dokumente als Beweismittel im Zivilprozess, MMR 11/2002, 709-713 (zusammen mit Fischer-Dieskau, S. / Paul, S. / Steidle, R.).\n  • arbeit 21 - Herausforderung und Perspektive für das Recht. Neue Informations- und Kommunikationstechnologien am Arbeitsplatz, in: Mobile Arbeitswelten - Soziale Gestaltung von \"Electronic Mobility\", Alcatel SEL Stiftung für Kommunikationsforschung/Forum soziale Technikgestaltung (Hrsg.), 2002, 132-141.\n  • arbeit 21 - Herausforderung und Perspektive für das Recht, in: Weiss, M. / Schröter, W. (Hrsg.), arbeit 21 - online mobil, 2001, 34-38.\n  • Banken und Internet - Das Online-Angebot von Banken aus der Perspektive des Verbraucherschutzes, 1999 (zusammen mit Jack, S.).\n\nVorträge und Konferenzen\n\n  • \"Reflexive Innovation and the Case of Pervasive Computing\", esa-conference8, 8th conference of the European Sociological Association, 3-6.9.2007, Glasgow (zusammen mit Oertel, B. / Sellke, P.).\n  • \"Datenschutz und Informatik\", sIT - Studentische Informatiktage, 7.5.200, Göttingen.\n  • \"Die Integration elektronsicher Signaturen in multifunktionale Chipkarten\", Kolloquium Recht und Ökonomie, Universität Kassel, 7.12.2004, Kassel.\n  • \"Der Digitale Personalausweis: Integration digitaler Signaturen und Geschäftsmodelle\", CAST-Forum Publik Key Infrastrukturen, 22.1.2004, Darmstadt.\n  • \"Rechtsfragen mobiler Agentensysteme\", Kolloquium Recht und Ökonomie, Universität Kassel, 19.11.2002, Kassel.\n  • \"Rechtsverträgliche Gestaltung von Agentensystemen\", Kolloquium Institut für Informatik, Universität Jena, 17.6.2002, Jena.\n  • \"Rechtsverträgliche Gestaltung mobiler Agentensysteme\", MTI-Workshop Usability, 25.2.02, Stuttgart.\n  • \"Rechtliche Fragen zur Verarbeitung von Nutzerdaten\", MTI-Workshop Nutzer- und Kontextadaptivität, 25.09.2001.\n  • \"Rechtliche Aspekte der Arbeit am Netz\", 3. Anwendertag Telearbeit, 08.11.2001, Stuttgart.\n  • \"Rechtliche Akzeptabilität und Aspekte im Wireless Business\", Hydeparc Konferenz \"Wireless Business Applications\", 9./10.7.2001, Hamburg.\n  • \"Rechtliche Anforderungen an die Gestaltung mobiler Agenten\", Management-Circle Seminar \"Rechts- und Sicherheitsaspekte im mobilen Zahlungsverkehr\", 27.4.2001, Bad Homburg.\n  • \"Rechtliche Anforderungen an die Gestaltung mobiler Agenten\", CAST-Forum Mobile Security Workshop, 2.2.2001.\n\nFrühere Lehrveranstaltungen\n\n  • \"Europäisches Telekommunikationsrecht\", Vorlesung (MA), WS 2008/09.\n  • \"Verantwortlichkeit und Datenschutz\", Seminar, SS 2008.\n  • \"Verantwortlichkeit und Datenschutz\", Seminar, WS 2007/08.\n  • \"Urheberrecht und neue Medien\", Vorlesung, SS 2007.\n  • \"Rechtsfragen des E-Commerce\", Vorlesung, WS 2004/05.\n  • \"Urheberrecht und Neue Medien\", Seminar, SS 2004.\n  • \"Multimediarecht\", Vorlesung, WS 2003/04.\n  • \"Rechtsfragen des Multimediarechts\", Seminar, SS 2003."}, {"id": "P27", "query": "Direct purchase value limit", "description": "Up to which amount can I order goods directly?", "narrative": "Relevant documents state value limits for direct orders and small purchases.", "title": "Separation - INTERN - Uni Kassel", "url": "https://www.uni-kassel.de/intern/en/interne-bereiche-der-abteilungen/finanzen/materialwirtschaft/aussonderung.html", "text": "Separation\n\nThe content on this page was translated automatically.\n\nSorting and utilization procedures at the University of Kassel\n\nWhat happens to equipment at the University of Kassel that is defective or still functional but no longer needed in your area?\n\nThe directive of the state of Hesse on the disposal and utilization of state-owned movable property regulates the handling of equipment that is defective or still functional but no longer required in its area. Special provisions for the disposal of company vehicles are integrated into this directive.\n\nThe additional working instructions for the disposal and recycling procedure within the University of Kassel stipulate\n\n  • that you can initially offer obsolete, functional or repairable equipment and items that are no longer used in your own area for further use within the university to other areas within the university on a page set up for this purpose on the Sharepoint . You can register via your university account. You will find brief instructions for posting articles below.            \n\n  • that you must report defective equipment and items with a net purchase value of > EUR 410 to Division IV C for disposal via a disposal request (orcollective requestfor disposals). After approval by the Finance Department, you must arrange for the disposal of the equipment. Important information on waste disposal can be found belowm.\n\nThe disposal or recycling procedure must always be approved by the budget officer of the responsible department.\n\nDo you have any further questions on the subject of segregation and recovery procedures?"}, {"id": "P28", "query": "Tagegeld auswärtige Tätigkeit Dienststätte HRKG", "description": "Hat ein Beschäftigter Anspruch auf Tagegeld, wenn er dauerhaft außerhalb der Dienststätte arbeitet?", "narrative": "Relevant ist das Urteil zum Begriff der Dienststätte und zum Tagegeldanspruch nach HRKG.", "title": " Inhaltsverzeichnis HRKG | Landesnorm Hessen | Inhaltsverzeichnis | gültig ab: 01.01.2010 | gültig bis: 31.12.2020", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/jlr-NNLHE0000518BNN00000000001", "text": "Hessisches Reisekostengesetz\n(HRKG)\nVom 9. Oktober 2009 1)\n\nInhaltsübersicht\n§ 1Geltungsbereich\n§ 2Dienstreisen\n§ 3Reisen aus besonderem Anlass\n§ 4Reisekostenerstattung\n§ 5Fahrt- und Flugkostenerstattung\n§ 6Wegstrecken- und Mitnahmeentschädigung\n§ 7Tagegeld\n§ 8Übernachtungsgeld\n§ 9Erstattung der Auslagen bei längerem Aufenthalt am Geschäftsort\n§ 10Kürzung des Tagegeldes nach § 7 und § 9 Abs. 1 Satz 1\n§ 11Erstattung von sonstigen Kosten\n§ 12Bemessung der Reisekostenerstattung in besonderen Fällen\n§ 13Erkrankung während einer Dienstreise\n§ 14Verbindung von Dienstreisen und privaten Reisen\n§ 15Aufwandsentschädigung\n§ 16Pauschalerstattung\n§ 17Auslandsdienstreisen\n§ 18Beamtinnen und Beamte der Gemeinden, Gemeindeverbände und sonstigen Körperschaften, Anstalten und Stiftungen des öffentlichen Rechts\n§ 19Trennungsgeld\n§ 20Zuständigkeitsregelungen\n§ 21Übergangsvorschriften\n§ 22Ermächtigungen\n§ 23Inkrafttreten, Außerkrafttreten\n\nWeitere Fassungen dieser Norm ausblendenWeitere Fassungen dieser Norm\n\nInhaltsverzeichnis HRKG, vom 15.11.2021, gültig ab 01.01.2021\n\nFußnoten ausblendenFußnoten\n\n1)\nVerkündet als Artikel 1 des Gesetzes zur Reform des hessischen Reisekostenrechts und zur Verlängerung der Geltungsdauer des Hessischen Personalvertretungsgesetzes vom 9. Oktober 2009 (GVBl. I S. 397)"}, {"id": "P29", "query": "Gerät leasen statt kaufen", "description": "Darf ein Gerät für die Universität geleast oder gemietet statt gekauft werden?", "narrative": "Relevant sind Vorgaben zu Leasing, Miete und Kauf bei Beschaffungen.", "title": "UniKasselClient (UKC) - ITS - Uni Kassel", "url": "https://www.uni-kassel.de/its/?id=4331", "text": "UniKasselClient (UKC)\n\nZurück zur Übersicht\n\nNeu: Der UKC ist jetzt auch für Dekanate, Prüfungsämter und Fachgebietssekretariate verfügbar.\n\nAllgemeine Informationen\n\nUni Kassel Clients (UKCs) werden zentral vom IT Servicezentrum der Universität Kassel verwaltet und bieten automatisierte Software- und Sicherheitsupdates, die direkt von einer zentralen Stelle aus bereitgestellt werden. Um Ihr Endgerät mit den notwendigen Updates zu versorgen, müssen Sie lediglich mit dem kabelgebundenen Netzwerk der Universität verbunden sein oder eine VPN-Verbindung herstellen.\n\nDurch die zentrale Geräteverwaltung, den Einsatz vorkonfigurierter Systeme und unser breites Angebot an Softwarelösungen bieten wir Ihnen ein hochsicheres und effizientes System. Dies trägt nicht nur zur Sicherheit Ihrer Daten bei, sondern steigert auch die Effizienz Ihrer Arbeitsprozesse.\n\nDas IT Servicezentrum verwendet ausschließlich qualifizierte Business-Hardware aus unserem aktuellen Rahmenvertrag. Derzeit laufen die Geräte unter Windows 11. Neben der Bereitstellung übernimmt das IT Servicezentrum auch die professionelle Verwaltung und die umweltgerechte Entsorgung der Geräte nach Ablauf ihrer Nutzungsdauer.\n\nDie UKCs bieten ein umfangreiches Softwareportfolio, das auf die verschiedenen Arbeitsbereiche und Bedürfnisse unserer Nutzer:innen abgestimmt ist. Dadurch können wir Lösungen bereitstellen, die Ihren Arbeitsalltag gezielt unterstützen und erleichtern. Alle Geräte werden vollständig vorkonfiguriert ausgeliefert und sind sofort einsatzbereit.\n\nDie Anmeldung an einem UKC erfolgt über Ihren persönlichen UniAccount. Für die erstmalige Anmeldung ist eine einmalige Verbindung mit dem kabelgebundenen Netzwerk der Universität erforderlich.\n\nWoran erkenne ich, ob ich einen UKC besitze?\n\nAlle Uni Kassel Clients (UKCs) sind mit einem sorgfältig angebrachten Etikett des IT-Servicezentrums versehen. Dieses Etikett enthält wichtige Informationen wie die Modellbezeichnung, den Gerätenamen, die MAC-Adresse, das Kaufdatum sowie das Garantieende. Diese Daten erleichtern die Identifizierung des Geräts und ermöglichen einen schnellen Zugriff auf relevante Informationen, insbesondere bei Supportanfragen.\n\nHologramm-Aufkleber:\n\nBei neueren UKC-Geräten, insbesondere solchen mit Windows 11, befindet sich auf der Vorderseite des Notebooks ein spezieller Hologramm-Aufkleber mit dem UKC-Waschbär. Dieser Aufkleber dient als gut sichtbarer Hinweis darauf, dass das Gerät zum Uni Kassel Client-Programm gehört.\n\nLabel auf der Unterseite:\n\nAuf der Unterseite des Notebooks befindet sich ein weiteres Label mit wichtigen Geräteinformationen. Das ITS-Wasserzeichen im Hintergrund und die angegebene ITS-Telefonnummer machen ebenfalls deutlich, dass es sich um ein UKC-Gerät handelt.\n\nDiese Informationen sind besonders hilfreich, wenn Sie den IT-Servicedesk kontaktieren oder ein Support-Ticket erstellen. Ein solches Label ist auch auf anderen Geräten, wie Druckern oder Monitoren, zu finden, die im Rahmen des UKC-Angebots angeschafft wurden.\n\nMatrix42 Software:\n\nSollte auf Ihrem Gerät kein Etikett des IT-Servicezentrums vorhanden sein, können Sie dennoch überprüfen, ob es sich um einen UKC handelt.\n\nIn der Taskleiste, unter den ausgeblendeten Symbolen, finden Sie die Matrix42 Software Depot-Anwendung, erkennbar an einem markanten lila Viereck. Wenn dieses Symbol sichtbar ist, können Sie sicher sein, dass Sie auf einem Uni Kassel Client arbeiten.\n\n(öffnet Vergrößerung des Bildes)\n(öffnet Vergrößerung des Bildes)\n(öffnet Vergrößerung des Bildes)\n\nServiceangebote\n\nSoftware\n\nNeu beschaffte UKCs werden mit dem Betriebssystem Windows 11 ausgeliefert, Bestandsgeräte sind flächendeckend auf Windows 11 aktualisiert.\n\nWICHTIG: Sollten Sie noch ein Gerät mit Windows 10 vorfinden bitte umgehend Kontakt mit dem IT Servicezentrum aufnehmen und das Gerät keinesfalls im Netzwerk betreiben!\n\nUnser Standardsoftware-Portfolio umfasst unter anderem:\n\n\n  • Office 2016, das bald auf Office 2021 (inklusive Word, Excel, PowerPoint, Outlook) aktualisiert wird\n  • Cisco Secure Client für VPN-Verbindungen\n  • ISL-Fernwartungstool für Remote-Support\n  • Sophos Endpoint Security (Antivirus-Software)\n\nDarüber hinaus haben Sie die Möglichkeit, unser Standard-Portfolio individuell zu erweitern und an Ihre spezifischen Anforderungen anzupassen. So stellen wir sicher, dass Ihre IT-Umgebung optimal auf Ihre Bedürfnisse zugeschnitten ist.\n\nHardware\n\nDas IT Servicezentrum der Universität Kassel setzt auf hochwertige Business-Hardware aus dem aktuellen Rahmenvertrag, wobei besonderer Wert auf Zuverlässigkeit, Leistungsfähigkeit und Nachhaltigkeit gelegt wird.\n\n\n\nUm die mobile Arbeit unserer Mitarbeiter:innen zu unterstützen, setzen wir überwiegend auf Notebooks. Je nach individuellem Bedarf und speziellen Anforderungen bieten wir auch angepasste Hardwarelösungen an.\n\n\n\n\nSo stellen wir sicher, dass die technische Ausstattung exakt auf Ihre Bedürfnisse abgestimmt ist und Sie bestmöglich in Ihrer Arbeit unterstützt.\n\n\n\n\n\n\n\n\nBeschaffung\n\nDie Bestellung der Geräte erfolgt zentral über das IT Servicezentrum. Bitte beachten Sie die folgenden Schritte, um eine Bestellung durchzuführen:\n\n1.  Füllen Sie den Antrag auf Beschaffung aus und wählen Sie in diesem Formular eines der drei Modelle aus unserem Rahmenvertrag aus.\n\n2.  Informieren Sie sich über die unterschiedlichen Modelle aus unserem Rahmenvertrag, um die passende Option für Ihren Bedarf auszuwählen.\n\n3.  Das vollständig ausgefüllte Formular senden Sie bitte per E-Mail-Kette an it-beschaffung[at]uni-kassel[dot]de. Achten Sie darauf, dass die E-Mail von der kostenstellenverantwortlichen Person Ihres Bereichs versendet wird.\n\nBitte stellen Sie sicher, dass die Anträge ausschließlich über den genannten Weg eingereicht werden. Anträge, die auf einem anderen Weg bei uns eingehen, können aus organisatorischen Gründen nicht bearbeitet werden.\n\nMit dieser strukturierten Vorgehensweise stellen wir einen effizienten und fehlerfreien Bestellprozess sicher und gewährleisten, dass Ihre IT-Ausstattung entsprechend den festgelegten Rahmenbedingungen zur Verfügung gestellt wird.\n\nHinweise für den First-Level-Support\n\nSollten Sie Fragen, Probleme oder andere Anliegen im Zusammenhang mit einem UniKasselClient (UKC) haben, steht Ihnen unser IT-Servicedesk gerne zur Verfügung. Hier erhalten Sie umfangreichen First-Level-Support:\n\n- Telefon: 0561 804 5678\n\n- E-Mail: it-servicedesk[at]uni-kassel[dot]de\n\n \n\nWir sind bemüht, jedes IT-Problem schnellstmöglich zu lösen, bitten jedoch um Verständnis, dass nicht alle Probleme sofort behoben werden können. Bei komplexeren oder spezialisierteren Angelegenheiten wird Ihr Anliegen in Form eines qualifizierten Tickets an die zuständigen Kolleginnen und Kollegen weitergeleitet.\n\nWir setzen alles daran, Ihnen effizient und zeitnah zu helfen und arbeiten eng mit den entsprechenden Stellen zusammen, um Ihre Anfragen bestmöglich zu bearbeiten. Zögern Sie nicht, sich bei Bedarf an unseren IT-Servicedesk zu wenden. Wir sehen unsere Aufgabe darin, Ihre Arbeit durch einen funktionalen digitalen Arbeitsplatz zu vereinfachen und zu unterstützten.\n\nGo-Link dieser Seite: https://www.uni-kassel.de/go/ukc-info"}, {"id": "P30", "query": "Versorgung Ruhegehalt Beamte", "description": "Wie wird das Ruhegehalt hessischer Beamter berechnet?", "narrative": "Relevant ist das Hessische Beamtenversorgungsgesetz.", "title": " § 1 EhrBürgMEhrensoldV HE | Landesnorm Hessen | Anspruch auf Aufwandsentschädigung | § 1 - Anspruch auf Aufwandsentschädigung | gültig ab: 05.04.2025 | gültig bis: 31.12.2035", "url": "https://www.rv.hessenrecht.hessen.de/bshe/document/jlr-NNLHE00005124NN00000000006", "text": "Verordnung über die Aufwandsentschädigung und den Ehrensold\nder ehrenamtlichen Bürgermeisterinnen und ehrenamtlichen Bürgermeister\nVom 7. Dezember 2016\n\n§ 1\nAnspruch auf Aufwandsentschädigung\n\n(1) Die Aufwandsentschädigung nach § 44 Abs. 3 Satz 1 der Hessischen Gemeindeordnung wird vom Beginn des Kalendermonats an gewährt, in dem die ehrenamtliche Bürgermeisterin oder der ehrenamtliche Bürgermeister ihr oder sein Amt antritt. Der Anspruch auf Aufwandsentschädigung endet mit dem Ablauf des Kalendermonats, in dem die ehrenamtliche Bürgermeisterin oder der ehrenamtliche Bürgermeister aus ihrem oder seinem Amt ausscheidet. Die Aufwandsentschädigung ist monatlich im Voraus zu gewähren.\n\n(2) Die Höhe der monatlichen Aufwandsentschädigung bestimmt sich nach der Anlage 1 zu dieser Verordnung. Die Aufwandsentschädigung ändert sich in dem Maß, wie die Grundgehälter der Beamtinnen und Beamten des Landes allgemein erhöht oder vermindert werden.\n\n(3) War die ehrenamtliche Bürgermeisterin oder der ehrenamtliche Bürgermeister zuvor hauptamtliche kommunale Wahlbeamtin oder hauptamtlicher kommunaler Wahlbeamter und hat sie oder er aus diesem Hauptamt einen Versorgungsanspruch erworben, so darf die Aufwandsentschädigung abweichend von Abs. 2 den Unterschiedsbetrag zwischen dem Ruhegehalt und der Besoldung, die einer hauptamtlichen Bürgermeisterin oder einem hauptamtlichen Bürgermeister in der Gemeinde nach § 2 Abs. 1 der Verordnung über die Besoldung, Dienstaufwandsentschädigung und Reisekostenpauschale der hauptamtlichen kommunalen Wahlbeamtinnen und Wahlbeamten auf Zeit vom 17. Februar 2014 (GVBl. S. 54), zuletzt geändert durch Verordnung vom 1. April 2025 (GVBl. 2025 Nr. 24), zustünde, nicht übersteigen.\n\nWeitere Fassungen dieser Norm ausblendenWeitere Fassungen dieser Norm\n\n§ 1 EhrBürgMEhrensoldV HE, vom 07.12.2016, gültig ab 01.01.2017 bis 04.04.2025"}];
const PREVIEW_CHARS = 3000;
const SCALE = [
  [0, "hat nichts mit der Frage zu tun"],
  [1, "passt zum Thema, beantwortet die Frage aber nicht"],
  [2, "enthält eine Teilantwort, unklar oder zwischen anderem versteckt"],
  [3, "beschäftigt sich direkt mit der Frage und enthält die Antwort"],
];
const STORAGE_KEY = "relevanz-check-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (error) { return {}; }
}
const state = Object.assign({ index: 0, grades: {}, comments: {} }, loadState());
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) { /* private mode: keep in memory */ }
}

const el = (id) => document.getElementById(id);
let expanded = false;

const gradeButtons = SCALE.map(([value, text]) => {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "grade";
  button.innerHTML = `<b>${value}</b>`;
  button.append(text);
  button.addEventListener("click", () => setGrade(value));
  el("grades").append(button);
  return button;
});

function setGrade(value) {
  state.grades[PAIRS[state.index].id] = value;
  saveState();
  render();
}

function render() {
  const pair = PAIRS[state.index];
  el("query").textContent = pair.query;
  el("description").textContent = pair.description || "–";
  el("narrative").textContent = pair.narrative || "–";
  el("title").textContent = pair.title || "(ohne Titel)";
  el("url").textContent = pair.url;
  const long = pair.text.length > PREVIEW_CHARS;
  el("text").textContent = long && !expanded ? pair.text.slice(0, PREVIEW_CHARS) + " …" : pair.text;
  el("more").hidden = !long;
  el("more").textContent = expanded ? "Text kürzen" : "ganzen Text anzeigen";
  const grade = state.grades[pair.id];
  gradeButtons.forEach((button, value) => button.setAttribute("aria-pressed", String(grade === value)));
  el("comment").value = state.comments[pair.id] || "";
  const graded = PAIRS.filter((p) => p.id in state.grades).length;
  el("progress").textContent = `${state.index + 1}/${PAIRS.length}`;
  el("bar").style.width = `${(100 * graded) / PAIRS.length}%`;
  el("status").textContent = `${graded} von ${PAIRS.length} bewertet`;
  el("status").classList.toggle("missing", graded < PAIRS.length);
  el("prev").disabled = state.index === 0;
  el("next").disabled = state.index === PAIRS.length - 1;
}

function go(step) {
  const target = state.index + step;
  if (target < 0 || target >= PAIRS.length) return;
  state.index = target;
  expanded = false;
  saveState();
  render();
  window.scrollTo(0, 0);
}

el("prev").addEventListener("click", () => go(-1));
el("next").addEventListener("click", () => go(1));
el("more").addEventListener("click", () => { expanded = !expanded; render(); });
el("comment").addEventListener("input", (event) => {
  state.comments[PAIRS[state.index].id] = event.target.value;
  saveState();
});
document.addEventListener("keydown", (event) => {
  if (event.target === el("comment")) return;
  if (["0", "1", "2", "3"].includes(event.key)) setGrade(Number(event.key));
  if (event.key === "ArrowRight") go(1);
  if (event.key === "ArrowLeft") go(-1);
});

el("export").addEventListener("click", () => {
  const missing = PAIRS.filter((p) => !(p.id in state.grades)).map((p) => p.id);
  if (missing.length) {
    el("status").textContent = `Noch ohne Note: ${missing.join(", ")} – Export enthält nur die bewerteten Paare.`;
  }
  const result = {
    exported: new Date().toISOString(),
    grades: PAIRS.filter((p) => p.id in state.grades).map((p) => ({
      pair_id: p.id,
      grade: state.grades[p.id],
      comment: state.comments[p.id] || "",
    })),
  };
  const blob = new Blob([JSON.stringify(result, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "manual_grades.json";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
});

state.index = Math.min(state.index, PAIRS.length - 1);
render();
</script>
